<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 345" width="500" height="345" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Nghiệm có phạt KL với ba giá trị beta</title>
<desc id="d">Thanh chồng một trăm phần trăm, mỗi hàng một chính sách, phần y 1 bên trái, phần y 2 bên phải. Hàng pi ref, xám: hai phần ba và một phần ba. Hàng pi sao với beta bằng 1, tím: 0,8 và 0,2.</desc>
