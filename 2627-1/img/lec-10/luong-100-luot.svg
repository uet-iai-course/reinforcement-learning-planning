<text x="10.0" y="28.0" font-size="26" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>chính sách cũ </tspan><tspan>π = (0,5;</tspan><tspan> </tspan><tspan>⅔)</tspan></text>
