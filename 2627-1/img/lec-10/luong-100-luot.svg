<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Luồng 100 lượt của chính sách cũ và chính sách ứng viên</title>
<desc id="d">Luồng của chính sách cũ pi bằng (0,5; hai phần ba): khối 100 lượt tách thành dải tới s B, 50 lượt, và dải nhận 1 tại s A, 50 lượt; từ khối tới s B tách thành nhận 3, 33 lượt, viền xanh, và nhận 0, 17 lượt, viền xám. Bề dày mỗi dải tỉ lệ số lượt; các dải màu xám. Chú thích dưới: số lượt kỳ vọng; 33 và một phần ba, 16 và hai phần ba làm tròn. Thêm luồng của ứng viên pi ngã bằng (0,9; 0,5): khối 100 lượt tách thành dải tới s B, 90 lượt, tô tím, khối tới s B viền tím, và dải nhận 1 tại s A, 10 lượt; từ khối tới s B tách thành nhận 3, 45 lượt, và nhận 0, 45 lượt.</desc>
