<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" width="700" height="620" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Một vòng lặp TRPO</title>
<desc id="d">Sơ đồ đứng năm khối nối bằng mũi tên. Thu lượt: bộ đệm, lưu phân phối cũ. Ước lượng lợi thế: delta t, GAE. Tính hướng, viền tím: giải F x bằng g bằng gradient liên hợp; nhãn tím bên phải: khoảng mười tích F v. Chọn độ dài bước: kiểm hàm thay thế mẫu và KL trung bình trên bộ đệm; vòng đỏ nét liền quay lại chính khối này, nhãn: không đạt, thu nhỏ bước. Cập nhật critic. Mũi tên cuối từ khối cập nhật critic vòng về khối thu lượt, nhãn: bỏ bộ đệm, thu lượt mới.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="40.0" y="4.0" width="420.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="250.0" y="42.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>Thu lượt</tspan></text>
<text x="250.0" y="76.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>bộ đệm, lưu phân phối cũ</tspan></text>
<rect x="40.0" y="114.0" width="420.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="250.0" y="152.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>Ước lượng lợi thế</tspan></text>
<text x="250.0" y="186.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="6.8" font-style="italic" font-size="21.6">t</tspan><tspan dy="-6.8">, GAE</tspan></text>
<rect x="40.0" y="224.0" width="420.0" height="124.0" rx="10" fill="#F1EAF9" stroke="#6B3FA0" stroke-width="4"/>
<text x="250.0" y="262.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#6B3FA0"><tspan>Tính hướng</tspan></text>
<text x="250.0" y="296.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>giải </tspan><tspan font-style="italic">Fx</tspan><tspan> = </tspan><tspan font-style="italic">g</tspan><tspan> bằng</tspan></text>
<text x="250.0" y="330.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>gradient liên hợp</tspan></text>
<rect x="40.0" y="368.0" width="420.0" height="124.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="250.0" y="406.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>Chọn độ dài bước</tspan></text>
<text x="250.0" y="440.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>kiểm hàm thay thế mẫu</tspan></text>
<text x="250.0" y="474.0" font-size="27" text-anchor="middle" fill="#1d2433"><tspan>và KL trung bình trên bộ đệm</tspan></text>
<rect x="40.0" y="512.0" width="420.0" height="56.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="250.0" y="550.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>Cập nhật critic</tspan></text>
<line x1="250.0" y1="96.0" x2="250.0" y2="111.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="250.0" y1="206.0" x2="250.0" y2="221.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="250.0" y1="350.0" x2="250.0" y2="365.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="250.0" y1="494.0" x2="250.0" y2="509.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="476.0" y="280.0" font-size="27" text-anchor="start" font-weight="bold" fill="#6B3FA0"><tspan>khoảng mười</tspan></text>
<text x="476.0" y="314.0" font-size="27" text-anchor="start" font-weight="bold" fill="#6B3FA0"><tspan>tích </tspan><tspan font-style="italic">Fv</tspan></text>
<path d="M 462.0 466.0 L 494.0 466.0 L 494.0 394.0 L 465.0 394.0" stroke="#C62828" stroke-width="3.5" fill="none" stroke-linejoin="miter" marker-end="url(#mr)"/>
<text x="506.0" y="424.0" font-size="27" text-anchor="start" font-weight="bold" fill="#C62828"><tspan>không đạt:</tspan></text>
<text x="506.0" y="458.0" font-size="27" text-anchor="start" font-weight="bold" fill="#C62828"><tspan>thu nhỏ bước</tspan></text>
<path d="M 250.0 570.0 L 250.0 592.0 L 16 592.0 L 16 49.0 L 36.0 49.0" stroke="#1d2433" stroke-width="3" fill="none" stroke-linejoin="miter" marker-end="url(#mk)"/>
<text x="264.0" y="601.0" font-size="27" text-anchor="start" fill="#1d2433"><tspan>bỏ bộ đệm, thu lượt mới</tspan></text>
</svg>
