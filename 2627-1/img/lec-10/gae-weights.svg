<pattern id="hz" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#FBEDE3"/><line x1="0" y1="0" x2="0" y2="9" stroke="#B15A2B" stroke-width="3"/></pattern>
</defs>
