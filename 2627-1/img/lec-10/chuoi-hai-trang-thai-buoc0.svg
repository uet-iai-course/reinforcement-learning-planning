<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" width="640" height="450" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Chuỗi hai trạng thái</title>
<desc id="d">Ô s A, ghi xuất phát, ở trên trái; ô s B ở dưới trái; hai ô kết thúc màu xám ở bên phải. Từ s A: mũi tên đi xuống s B ghi 1, thưởng 0; mũi tên sang phải tới ô kết thúc trên ghi 2, thưởng 1. Từ s B: hai mũi tên sang phải tới ô kết thúc dưới, ghi 1, thưởng 3 và 2, thưởng 0.</desc>
