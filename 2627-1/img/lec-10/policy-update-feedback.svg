<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Vòng phản hồi khi cập nhật chính sách</title><desc id="desc">Chính sách cũ sinh dữ liệu, dữ liệu tạo gradient, cập nhật lớn làm phân phối trạng thái đổi và dữ liệu cũ kém đại diện.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="40" y="105" width="190" height="100" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="135" y="148">Chính sách cũ</text><text x="135" y="183">π_old</text><rect x="385" y="105" width="190" height="100" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="480" y="148">Dữ liệu</text><text x="480" y="183">on-policy</text><rect x="730" y="105" width="190" height="100" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="825" y="148">Chính sách mới</text><text x="825" y="183">π_θ</text><path d="M230 155H375M575 155H720" stroke="#2f3e7a" stroke-width="6" marker-end="url(#a)"/><path d="M825 218 C825 310 135 310 135 218" fill="none" stroke="#b15a2b" stroke-width="6" marker-end="url(#a)"/><text x="480" y="300" fill="#8b351f">Cập nhật lớn làm phân phối dữ liệu đổi mạnh</text></g></svg>
