<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 312" width="1290" height="312" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Vòng phản hồi khi cập nhật chính sách</title>
<desc id="d">Vòng phản hồi bốn khung nối bằng mũi tên. Khung một: chính sách pi old sinh dữ liệu S t, A t, R t+1, với trạng thái phân bố theo nu mũ pi old. Khung hai: từ dữ liệu, ước lượng lợi thế A mũ t và tính bước cập nhật theta old thành theta. Khung ba: chính sách mới pi theta. Khung bốn: pi theta thăm trạng thái theo phân bố nu mũ pi theta, khác nu mũ pi old. Mũi tên nét đứt từ khung bốn quay về khung một ghi: dữ liệu theo nu mũ pi theta chỉ có sau khi chạy pi theta.</desc>
<defs>
<marker id="an" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#2F3E7A"/></marker>
<marker id="ao" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#B15A2B"/></marker>
</defs>
<rect x="15" y="40" width="285" height="140" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="31" y="30" font-size="19" font-weight="700" fill="#424954">1</text>
<rect x="340" y="40" width="285" height="140" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/>
<text x="356" y="30" font-size="19" font-weight="700" fill="#424954">2</text>
<rect x="665" y="40" width="285" height="140" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/>
<text x="681" y="30" font-size="19" font-weight="700" fill="#424954">3</text>
<rect x="990" y="40" width="285" height="140" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="1006" y="30" font-size="19" font-weight="700" fill="#424954">4</text>
<text x="157.5" y="76" font-size="21" text-anchor="middle" font-weight="700">chính sách <tspan font-style="italic">π</tspan><tspan dy="6.3" font-size="14.7">old</tspan></text>
<text x="157.5" y="112" font-size="20" text-anchor="middle">sinh dữ liệu <tspan font-style="italic">S</tspan><tspan dy="6" font-size="14" font-style="italic">t</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">A</tspan><tspan dy="6" font-size="14" font-style="italic">t</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">R</tspan><tspan dy="6" font-size="14" font-style="italic">t</tspan><tspan font-size="14">+1</tspan></text>
<text x="157.5" y="150" font-size="22" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan dy="-6.6"> ∼ </tspan><tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">ν</tspan><tspan dy="-8.8" font-size="15.4" font-style="italic">π</tspan><tspan dy="4.6" font-size="10.8">old</tspan></text>
<text x="482.5" y="76" font-size="21" text-anchor="middle" font-weight="700">từ dữ liệu:</text>
<text x="482.5" y="112" font-size="20" text-anchor="middle">ước lượng <tspan font-style="italic">Â</tspan><tspan dy="6" font-size="14" font-style="italic">t</tspan><tspan dy="-6">,</tspan></text>
<text x="482.5" y="148" font-size="20" text-anchor="middle">bước cập nhật <tspan font-style="italic">θ</tspan><tspan dy="6" font-size="14">old</tspan><tspan dy="-6"> → </tspan><tspan font-style="italic">θ</tspan></text>
<text x="807.5" y="96" font-size="21" text-anchor="middle" font-weight="700">chính sách mới</text>
<text x="807.5" y="138" font-size="26" text-anchor="middle"><tspan font-style="italic">π</tspan><tspan dy="7.8" font-size="18.2" font-style="italic">θ</tspan></text>
<text x="1132.5" y="76" font-size="21" text-anchor="middle" font-weight="700"><tspan font-style="italic">π</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">θ</tspan><tspan dy="-6.3"> thăm trạng thái</tspan></text>
<text x="1132.5" y="112" font-size="20" text-anchor="middle">theo phân bố</text>
<text x="1132.5" y="150" font-size="22" text-anchor="middle"><tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">ν</tspan><tspan dy="-8.8" font-size="15.4" font-style="italic">π</tspan><tspan dy="4.6" font-size="10.8" font-style="italic">θ</tspan><tspan dy="4.2"> </tspan><tspan font-family="'Noto Sans Math','Cambria Math','DejaVu Sans',sans-serif">≠</tspan> <tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">ν</tspan><tspan dy="-8.8" font-size="15.4" font-style="italic">π</tspan><tspan dy="4.6" font-size="10.8">old</tspan></text>
<line x1="302" y1="110" x2="336" y2="110" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<line x1="627" y1="110" x2="661" y2="110" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<line x1="952" y1="110" x2="986" y2="110" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<path d="M1132,182 V238 Q1132,250 1120,250 H170 Q158,250 158,238 V186" fill="none" stroke="#B15A2B" stroke-width="3" stroke-dasharray="12 8" marker-end="url(#ao)"/>
<text x="645" y="280" font-size="21" text-anchor="middle" fill="#7a3a17">dữ liệu theo <tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">ν</tspan><tspan dy="-8.4" font-size="14.7" font-style="italic">π</tspan><tspan dy="4.4" font-size="10.3" font-style="italic">θ</tspan><tspan dy="4"> chỉ có sau khi chạy </tspan><tspan font-style="italic">π</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">θ</tspan></text>
</svg>
