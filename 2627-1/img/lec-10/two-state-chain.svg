<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Chuỗi hai trạng thái</title>
<desc id="d">Chuỗi hai trạng thái. Ô s A, ghi xuất phát và p A bằng xác suất chọn hành động 1, có hai cung: hành động 1 sang ô s B với phần thưởng 0; hành động 2 tới ô kết thúc tô xám với phần thưởng 1. Ô s B, ghi p B, có hai cung tới ô kết thúc: hành động 1 với phần thưởng 3, hành động 2 với phần thưởng 0. Góc dưới ghi gamma bằng 0,9 và chính sách cũ p A bằng 1/2, p B bằng 2/3.</desc>
<defs>
<marker id="an" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#2F3E7A"/></marker>
</defs>
<text x="130" y="82" font-size="19" text-anchor="middle" fill="#2F3E7A">xuất phát</text>
<rect x="30" y="95" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/>
<text x="130" y="136" font-size="27" text-anchor="middle"><tspan font-style="italic">s</tspan><tspan dy="8.1" font-size="18.9" font-style="italic">A</tspan></text>
<text x="130" y="176" font-size="19" text-anchor="middle"><tspan font-style="italic">p</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">A</tspan><tspan dy="-5.7"> = </tspan><tspan font-style="italic">π</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">θ</tspan><tspan dy="-5.7">(1 | </tspan><tspan font-style="italic">s</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">A</tspan><tspan dy="-5.7">)</tspan></text>
<rect x="400" y="95" width="200" height="100" rx="12" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/>
<text x="500" y="136" font-size="27" text-anchor="middle"><tspan font-style="italic">s</tspan><tspan dy="8.1" font-size="18.9" font-style="italic">B</tspan></text>
<text x="500" y="176" font-size="19" text-anchor="middle"><tspan font-style="italic">p</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">B</tspan><tspan dy="-5.7"> = </tspan><tspan font-style="italic">π</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">θ</tspan><tspan dy="-5.7">(1 | </tspan><tspan font-style="italic">s</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">B</tspan><tspan dy="-5.7">)</tspan></text>
<rect x="800" y="40" width="170" height="210" rx="12" fill="#e3e6ec" stroke="#2F3E7A" stroke-width="3"/>
<text x="885" y="140" font-size="21" text-anchor="middle">trạng thái</text>
<text x="885" y="166" font-size="21" text-anchor="middle">kết thúc</text>
<line x1="232" y1="145" x2="396" y2="145" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="314" y="110" font-size="19" text-anchor="middle">hành động 1</text>
<text x="314" y="133" font-size="19" text-anchor="middle">phần thưởng 0</text>
<line x1="602" y1="115" x2="796" y2="115" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="699" y="80" font-size="19" text-anchor="middle">hành động 1</text>
<text x="699" y="103" font-size="19" text-anchor="middle">phần thưởng 3</text>
<line x1="602" y1="175" x2="796" y2="175" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="699" y="203" font-size="19" text-anchor="middle">hành động 2</text>
<text x="699" y="226" font-size="19" text-anchor="middle">phần thưởng 0</text>
<path d="M130,197 V282 Q130,292 140,292 H875 Q885,292 885,282 V256" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="420" y="280" font-size="19" text-anchor="middle">hành động 2, phần thưởng 1</text>
<text x="30" y="334" font-size="19" fill="#424954"><tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">γ</tspan> = 0,9; chính sách cũ: <tspan font-style="italic">p</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">A</tspan><tspan dy="-5.7"> = 1/2, </tspan><tspan font-style="italic">p</tspan><tspan dy="5.7" font-size="13.3" font-style="italic">B</tspan><tspan dy="-5.7"> = 2/3</tspan></text>
</svg>
