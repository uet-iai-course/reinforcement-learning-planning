<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Actor và critic tạo ước lượng lợi thế</title><desc id="desc">Actor lấy mẫu hành động, môi trường trả phần thưởng và trạng thái mới, critic tính giá trị tại trạng thái hiện tại và kế tiếp để tạo sai số TD.</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs><g font-family="Arial,sans-serif" font-size="32" text-anchor="middle"><rect x="35" y="62" width="230" height="104" rx="15" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="150" y="123">Actor π_θ</text><rect x="360" y="62" width="240" height="104" rx="15" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="480" y="123">Môi trường</text><rect x="685" y="48" width="245" height="132" rx="15" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="807" y="96">Critic V_old</text><text x="807" y="143">V(S_t), V(S_{t+1})</text><path d="M265 114H350M600 114H675" stroke="#2f3e7a" stroke-width="6" marker-end="url(#b)"/><text x="307" y="92">A_t</text><text x="640" y="92">S_{t+1}</text><rect x="270" y="232" width="420" height="78" rx="14" fill="#fff" stroke="#2e7d32" stroke-width="4"/><text x="480" y="281">δ_t → Â_raw → Â_actor</text><path d="M807 182V220H700" fill="none" stroke="#2f3e7a" stroke-width="6" marker-end="url(#b)"/><path d="M480 168V220" fill="none" stroke="#b15a2b" stroke-width="6" marker-end="url(#b)"/></g></svg>
