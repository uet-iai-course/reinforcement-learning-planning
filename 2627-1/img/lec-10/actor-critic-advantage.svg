<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 445" width="1200" height="445" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Sai số TD dùng chung cho critic và actor</title>
<desc id="d">Sơ đồ một bước chuyển: S t, hành động A t, phần thưởng R t+1, trạng thái S t+1 và cờ Z t+1. Khung critic v mũ của s, w tính v mũ tại S t và tại S t+1. Nút sai số TD: delta t bằng R t+1 cộng gamma nhân (1 trừ Z t+1) nhân v mũ của S t+1, trừ v mũ của S t; phần mục tiêu R t+1 cộng gamma (1 trừ Z t+1) v mũ của S t+1 nằm trong khung nét đứt ghi dừng gradient. Từ delta t có hai mũi tên: tới critic, ghi w cộng alpha w nhân delta t nhân gradient theo w của v mũ tại S t; tới actor pi theta, ghi theta cộng alpha theta nhân I nhân delta t nhân psi theta tại S t, A t.</desc>
<defs>
<marker id="an" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#2F3E7A"/></marker>
<marker id="ao" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#B15A2B"/></marker>
</defs>
<rect x="40" y="20" width="120" height="60" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="100" y="59" font-size="25" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan dy="7.5" font-size="17.5" font-style="italic">t</tspan></text>
<line x1="162" y1="50" x2="326" y2="50" stroke="#B15A2B" stroke-width="3" marker-end="url(#ao)"/>
<text x="244" y="38" font-size="21" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3">, </tspan><tspan font-style="italic">R</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan font-size="14.7">+1</tspan></text>
<rect x="330" y="20" width="230" height="60" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="445" y="59" font-size="25" text-anchor="middle"><tspan font-style="italic">S</tspan><tspan dy="7.5" font-size="17.5" font-style="italic">t</tspan><tspan font-size="17.5">+1</tspan><tspan dy="-7.5">, </tspan><tspan font-style="italic">Z</tspan><tspan dy="7.5" font-size="17.5" font-style="italic">t</tspan><tspan font-size="17.5">+1</tspan></text>
<rect x="40" y="140" width="520" height="110" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/>
<text x="300" y="172" font-size="22" text-anchor="middle" font-weight="700">critic <tspan font-style="italic">v̂</tspan>(<tspan font-style="italic">s</tspan>, <tspan font-style="italic">w</tspan>)</text>
<rect x="70" y="190" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<text x="170" y="220" font-size="21" text-anchor="middle"><tspan font-style="italic">v̂</tspan>(<tspan font-style="italic">S</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3">, </tspan><tspan font-style="italic">w</tspan>)</text>
<rect x="330" y="190" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<text x="430" y="220" font-size="21" text-anchor="middle"><tspan font-style="italic">v̂</tspan>(<tspan font-style="italic">S</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan font-size="14.7">+1</tspan><tspan dy="-6.3">, </tspan><tspan font-style="italic">w</tspan>)</text>
<line x1="100" y1="82" x2="100" y2="136" stroke="#B15A2B" stroke-width="3" marker-end="url(#ao)"/>
<line x1="430" y1="82" x2="430" y2="136" stroke="#B15A2B" stroke-width="3" marker-end="url(#ao)"/>
<rect x="630" y="120" width="545" height="150" rx="12" fill="#FFFFFF" stroke="#1d2433" stroke-width="4"/>
<text x="902" y="154" font-size="22" text-anchor="middle" font-weight="700">sai số TD</text>
<text x="648" y="236" font-size="22"><tspan font-style="italic">δ</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan dy="-6.6"> =</tspan></text>
<rect x="700" y="192" width="330" height="62" rx="6" fill="#FFFFFF" stroke="#424954" stroke-width="2" stroke-dasharray="8 5"/>
<text x="865" y="185" font-size="19" text-anchor="middle" fill="#424954">dừng gradient</text>
<text x="865" y="236" font-size="22" text-anchor="middle"><tspan font-style="italic">R</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan font-size="15.4">+1</tspan><tspan dy="-6.6"> + </tspan><tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">γ</tspan>(1 − <tspan font-style="italic">Z</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan font-size="15.4">+1</tspan><tspan dy="-6.6">) </tspan><tspan font-style="italic">v̂</tspan>(<tspan font-style="italic">S</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan font-size="15.4">+1</tspan><tspan dy="-6.6">, </tspan><tspan font-style="italic">w</tspan>)</text>
<text x="1040" y="236" font-size="22">− <tspan font-style="italic">v̂</tspan>(<tspan font-style="italic">S</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">t</tspan><tspan dy="-6.6">, </tspan><tspan font-style="italic">w</tspan>)</text>
<line x1="562" y1="210" x2="626" y2="210" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<path d="M562,50 H902 V116" fill="none" stroke="#B15A2B" stroke-width="3" marker-end="url(#ao)"/>
<path d="M700,272 V318 H300 V254" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="500" y="306" font-size="21" text-anchor="middle"><tspan font-style="italic">w</tspan> ← <tspan font-style="italic">w</tspan> + <tspan font-style="italic">α</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">w</tspan><tspan dy="-6.3"> </tspan><tspan font-style="italic">δ</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3"> ∇</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">w</tspan><tspan dy="-6.3" font-style="italic">v̂</tspan>(<tspan font-style="italic">S</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3">, </tspan><tspan font-style="italic">w</tspan>)</text>
<line x1="1040" y1="272" x2="1040" y2="366" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
<text x="1028" y="336" font-size="21" text-anchor="end"><tspan font-style="italic">θ</tspan> ← <tspan font-style="italic">θ</tspan> + <tspan font-style="italic">α</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">θ</tspan><tspan dy="-6.3"> </tspan><tspan font-style="italic">I</tspan> <tspan font-style="italic">δ</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3"> </tspan><tspan font-style="italic">ψ</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">θ</tspan><tspan dy="-6.3">(</tspan><tspan font-style="italic">S</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3">, </tspan><tspan font-style="italic">A</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3">)</tspan></text>
<rect x="905" y="370" width="270" height="60" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/>
<text x="1040" y="408" font-size="22" text-anchor="middle" font-weight="700">actor <tspan font-style="italic">π</tspan><tspan dy="6.6" font-size="15.4" font-style="italic">θ</tspan></text>
</svg>
