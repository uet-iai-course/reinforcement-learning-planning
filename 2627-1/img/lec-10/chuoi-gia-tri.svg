<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 320" width="580" height="320" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Chuỗi hai trạng thái và giá trị của chính sách cũ</title>
<desc id="d">Hai ô trạng thái s A và s B. Trên s A ghi v pi của s A bằng một nửa nhân 0,9 nhân 2 cộng một nửa nhân 1, bằng 1,4. Trên s B ghi v pi của s B bằng hai phần ba nhân 3, bằng 2. Cung từ s A sang s B ghi 1, thưởng 0. Cung từ s A xuống dải kết thúc tô đỏ, ghi 2, thưởng 1, và thưởng 1 nhỏ hơn mức thường có 1,4. Hai cung từ s B xuống dải kết thúc ghi 1, thưởng 3 và 2, thưởng 0.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="20.0" y="110.0" width="130.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="85.0" y="154.4" font-size="26" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">A</tspan><tspan dy="-6.5"></tspan></text>
<rect x="330.0" y="110.0" width="130.0" height="70.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="395.0" y="154.4" font-size="26" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">B</tspan><tspan dy="-6.5"></tspan></text>
<text x="20.0" y="45.0" font-size="22" text-anchor="start" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="5.5" font-size="17.6">π</tspan><tspan dy="-5.5">(</tspan><tspan font-style="italic">s</tspan><tspan dy="5.5" font-style="italic" font-size="17.6">A</tspan><tspan dy="-5.5">)</tspan><tspan> = ½·0,9·2 + ½·1 = 1,4</tspan></text>
<text x="330.0" y="90.0" font-size="22" text-anchor="start" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="5.5" font-size="17.6">π</tspan><tspan dy="-5.5">(</tspan><tspan font-style="italic">s</tspan><tspan dy="5.5" font-style="italic" font-size="17.6">B</tspan><tspan dy="-5.5">)</tspan><tspan> = ⅔·3 = 2</tspan></text>
<line x1="150.0" y1="145.0" x2="328.0" y2="145.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="240.0" y="133.0" font-size="22" text-anchor="middle" fill="#1d2433"><tspan>1, thưởng 0</tspan></text>
<rect x="20.0" y="268.0" width="540.0" height="40.0" rx="6" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<text x="550.0" y="296.0" font-size="22" text-anchor="end" fill="#6E7787"><tspan>kết thúc</tspan></text>
<line x1="85.0" y1="180.0" x2="85.0" y2="266.0" stroke="#C62828" stroke-width="4" marker-end="url(#mr)"/>
<text x="97.0" y="206.0" font-size="22" text-anchor="start" fill="#C62828"><tspan>2, thưởng 1</tspan></text>
<text x="97.0" y="233.0" font-size="22" text-anchor="start" font-weight="bold" fill="#C62828"><tspan>thưởng 1 &lt;</tspan></text>
<text x="97.0" y="259.0" font-size="22" text-anchor="start" font-weight="bold" fill="#C62828"><tspan>mức thường có 1,4</tspan></text>
<line x1="355.0" y1="180.0" x2="355.0" y2="266.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="345.0" y="230.0" font-size="22" text-anchor="end" fill="#1d2433"><tspan>1, thưởng 3</tspan></text>
<line x1="440.0" y1="180.0" x2="440.0" y2="266.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="452.0" y="230.0" font-size="22" text-anchor="start" fill="#1d2433"><tspan>2, thưởng 0</tspan></text>
</svg>
