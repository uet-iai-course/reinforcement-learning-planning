<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Đường ống dữ liệu PPO</title><desc id="desc">N môi trường sinh rollout H bước, giữ quan sát cuối trước reset để bootstrap, tính lợi thế và target, rồi giữ chúng cố định trong khi tính lại tỷ số.</desc><defs><marker id="f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="25" y="110" width="180" height="95" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="115" y="150">N môi trường</text><text x="115" y="184">H bước</text><rect x="250" y="110" width="180" height="95" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="340" y="144">Buffer [H,N,…]</text><text x="340" y="180">final obs trước reset</text><rect x="475" y="110" width="180" height="95" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="565" y="150">A_raw, A_actor</text><text x="565" y="184">target đóng băng</text><rect x="700" y="110" width="180" height="95" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="790" y="150">K epoch</text><text x="790" y="184">tính lại w</text><rect x="925" y="110" width="150" height="95" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="1000" y="150">Đồng bộ</text><text x="1000" y="184">π_old</text><path d="M205 158H240M430 158H465M655 158H690M880 158H915" stroke="#2f3e7a" stroke-width="6" marker-end="url(#f)"/><text x="550" y="300">Giữ old data và target; tính lại log π_θ, V_φ và w ở mỗi minibatch</text></g></svg>
