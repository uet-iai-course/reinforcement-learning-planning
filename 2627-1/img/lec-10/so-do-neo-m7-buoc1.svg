<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1730 820" width="1730" height="820" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Vòng cập nhật chính sách</title>
<desc id="d">Sơ đồ vòng năm khối lần cuối, mỗi khối một tiêu đề: phần thưởng; thu lượt bằng chính sách cũ; critic v mũ; hệ số; cập nhật. Khối critic: delta t bằng R t cộng 1 cộng gamma v mũ của S t cộng 1 trừ v mũ của S t. Khối hệ số, chữ tím: G t, rồi G t trừ v pi của S t, rồi delta t, rồi A mũ t bằng tổng theo k của gamma lambda mũ k nhân delta t cộng k; dòng dưới: tọa độ theta A, phương sai 0,69, 0,20, 0.</desc>
