<text x="980.0" y="434.0" font-size="26" text-anchor="middle" fill="#6B3FA0"><tspan>→ </tspan><tspan font-style="italic">Â</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"> = Σ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">k</tspan><tspan dy="-6.5"> (γλ)</tspan><tspan dy="-9.9" font-style="italic" font-size="20.8">k</tspan><tspan dy="9.9"> δ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan font-size="20.8">+</tspan><tspan font-style="italic" font-size="20.8">k</tspan><tspan dy="-6.5"></tspan></text>
