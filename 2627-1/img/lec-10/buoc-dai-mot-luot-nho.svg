<title id="t">Bước dài theo lượt s_A → 2 làm J giảm</title>
<desc id="d">Hình thu nhỏ, tiêu đề bước dài theo lượt s A, hành động 2, làm J giảm. Đường xanh J theo bước học alpha đi xuống từ 1,4 về gần 1; đường ngang nét đứt tại 1 ghi giới hạn.</desc>
