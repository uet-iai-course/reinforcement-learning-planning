<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 370" width="1250" height="370" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Mục tiêu không cắt và có cắt trên bộ đệm hai lượt</title>
<desc id="d">Hai khung. Khung trái, phần của s A theo p A từ 0 tới 0,7: đường cam nét đứt, không cắt, âm 0,8 trừ 2 p A, đi xuống đều; đường tím đậm, nét liền, có cắt, gấp khúc: âm 1,92 cộng 0,8 p A khi p A dưới 0,4, trùng đường cam trên đoạn từ 0,4 tới 0,6, âm 2,8 p A trừ 0,32 khi p A trên 0,6. Đường có cắt đạt cực đại âm 1,6 tại p A bằng 0,4, chấm tím; mũi tên tím từ chính sách cũ p A bằng 0,5 tới chấm đó. Khung phải, phần của s B theo p B từ hai phần ba tới 1: đường cam nét đứt, không cắt, âm 3 cộng 3 p B, đi lên tới 0; đường tím đậm, nét liền, có cắt, đi lên từ âm 1 tới âm 0,8 tại p B bằng 11 phần 15, chấm tím, rồi nằm ngang; đoạn ngang tô sọc, ghi gradient bằng 0.</desc>
