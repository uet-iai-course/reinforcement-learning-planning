<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 240" width="1500" height="240" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Ba mắt xích từ giới hạn KL tới sai số của hàm thay thế</title>
<desc id="d">Khối 1, viền tím: KL trung bình không vượt kappa. Mũi tên ghi bất đẳng thức Pinsker và bất đẳng thức Jensen tới khối 2: TV kỳ vọng theo nu pi nhỏ. Mũi tên ghi bổ đề dịch chuyển tới khối 3: phân bố chiếm dụng ít thay đổi. Mũi tên ghi đẳng thức sai số tới khối 4: sai số, trị tuyệt đối của delta J trừ delta L, nhỏ.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="10.0" y="16.0" width="265.0" height="118.0" rx="10" fill="#F1EAF9" stroke="#6B3FA0" stroke-width="3.5"/>
<text x="142.5" y="66.0" font-size="24" text-anchor="middle" font-weight="bold" fill="#6B3FA0"><tspan>KL trung bình</tspan></text>
<text x="142.5" y="104.0" font-size="24" text-anchor="middle" font-weight="bold" fill="#6B3FA0"><tspan> ≤ κ</tspan></text>
<line x1="285.0" y1="75.0" x2="407.0" y2="75.0" stroke="#1d2433" stroke-width="3.5" marker-end="url(#mk)"/>
<text x="345.0" y="186.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>Pinsker và Jensen</tspan></text>
<rect x="415.0" y="16.0" width="265.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="547.5" y="66.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>TV kỳ vọng</tspan></text>
<text x="547.5" y="104.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>theo ν</tspan><tspan dy="-9.0" font-size="19.2">π</tspan><tspan dy="9.0"> nhỏ</tspan></text>
<line x1="690.0" y1="75.0" x2="812.0" y2="75.0" stroke="#1d2433" stroke-width="3.5" marker-end="url(#mk)"/>
<text x="750.0" y="186.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>bổ đề dịch chuyển</tspan></text>
<rect x="820.0" y="16.0" width="265.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="952.5" y="66.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>phân bố chiếm dụng</tspan></text>
<text x="952.5" y="104.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>ít thay đổi</tspan></text>
<line x1="1095.0" y1="75.0" x2="1217.0" y2="75.0" stroke="#1d2433" stroke-width="3.5" marker-end="url(#mk)"/>
<text x="1155.0" y="186.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>đẳng thức sai số</tspan></text>
<rect x="1225.0" y="16.0" width="265.0" height="118.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="1357.5" y="66.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>sai số</tspan></text>
<text x="1357.5" y="104.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>|Δ</tspan><tspan font-style="italic">J</tspan><tspan> − Δℒ|</tspan><tspan> nhỏ</tspan></text>
</svg>
