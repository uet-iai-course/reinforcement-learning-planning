<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Bốn chẩn đoán của PPO</title><desc id="desc">Bảng điều khiển gồm KL xấp xỉ, tỷ lệ mẫu có tỷ số ngoài dải clip, entropy và explained variance.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="45" y="45" width="400" height="115" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="245" y="90">KL xấp xỉ</text><text x="245" y="130">độ dịch chuyển chính sách</text><rect x="515" y="45" width="400" height="115" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="715" y="90">Clipfrac</text><text x="715" y="130">tỷ số ngoài dải clip</text><rect x="45" y="205" width="400" height="115" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="245" y="250">Entropy</text><text x="245" y="290">mức phân tán hành động</text><rect x="515" y="205" width="400" height="115" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="715" y="250">Explained variance</text><text x="715" y="290">chất lượng critic</text></g></svg>
