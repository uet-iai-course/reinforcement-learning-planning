<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 275" width="900" height="275" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Tính lùi lợi thế GAE trên lượt (i)</title>
<desc id="d">Dòng thời gian: ô s A tại t bằng 0, ô s B tại t bằng 1, ô kết thúc; trên mũi tên thứ nhất delta 0 bằng âm 0,5, trên mũi tên thứ hai delta 1 bằng 2. Mũi tên cong màu tím quay ngược từ ô kết thúc về s B, ghi A mũ 1 bằng delta 1 bằng 2. Mũi tên cong màu tím thứ hai quay ngược từ s B về s A, ghi A mũ 0 bằng âm 0,5 cộng 0,45 nhân 2 bằng 0,4.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="30.0" y="60.0" width="140.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="100.0" y="99.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">A</tspan><tspan dy="-6.0"></tspan></text>
<text x="100.0" y="40.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">t</tspan><tspan> = 0</tspan></text>
<rect x="400.0" y="60.0" width="140.0" height="60.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="470.0" y="99.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">B</tspan><tspan dy="-6.0"></tspan></text>
<text x="470.0" y="40.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">t</tspan><tspan> = 1</tspan></text>
<rect x="770.0" y="60.0" width="120.0" height="60.0" rx="10" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="830.0" y="97.0" font-size="20" text-anchor="middle" fill="#6E7787"><tspan>kết thúc</tspan></text>
<line x1="170.0" y1="90.0" x2="398.0" y2="90.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="540.0" y1="90.0" x2="768.0" y2="90.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="285.0" y="76.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="5.2" font-size="16.8">0</tspan><tspan dy="-5.2"> = −0,5</tspan></text>
<text x="655.0" y="76.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="5.2" font-size="16.8">1</tspan><tspan dy="-5.2"> = 2</tspan></text>
<path d="M 820 122 C 790 205, 520 205, 490 128" stroke="#6B3FA0" stroke-width="3.5" fill="none" stroke-linejoin="round" marker-end="url(#mp)"/>
<text x="655.0" y="222.0" font-size="22" text-anchor="middle" fill="#6B3FA0"><tspan font-style="italic">Â</tspan><tspan dy="5.5" font-size="17.6">1</tspan><tspan dy="-5.5"> = δ</tspan><tspan dy="5.5" font-size="17.6">1</tspan><tspan dy="-5.5"> = 2</tspan></text>
<path d="M 450 122 C 420 220, 150 220, 120 128" stroke="#6B3FA0" stroke-width="3.5" fill="none" stroke-linejoin="round" marker-end="url(#mp)"/>
<text x="285.0" y="250.0" font-size="22" text-anchor="middle" fill="#6B3FA0"><tspan font-style="italic">Â</tspan><tspan dy="5.5" font-size="17.6">0</tspan><tspan dy="-5.5"> = −0,5 + 0,45·2 = 0,4</tspan></text>
</svg>
