<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 588" width="820" height="588" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hai cách lấy trung bình KL trên chuỗi hai trạng thái</title>
<desc id="d">Hai bảng cạnh nhau, cùng một thang trọng số từ 0 tới 1, vạch 1 nét đứt chạy qua cả hai bảng. Hàng dưới mỗi bảng ghi cùng giá trị D KL của s: s A 0,511, s B 0,0566, chữ tím. Bảng trái, trọng số nu pi có chiết khấu: cột s A 0,1, cột s B 0,045, cột tổng 0,145, phần còn lại tới 1 chỉ là khung nét đứt; kết quả D gạch trên KL bằng 0,1 nhân 0,511 cộng 0,045 nhân 0,0566 bằng 0,0536. Bảng phải, tần suất trên bộ đệm: cột s A hai phần ba, cột s B một phần ba, cột tổng 1; kết quả D mũ bằng hai phần ba nhân 0,511 cộng một phần ba nhân 0,0566 xấp xỉ 0,36.</desc>
