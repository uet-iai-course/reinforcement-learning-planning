<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Tỉ trọng hai thành phần của gradient và gradient tự nhiên</title>
<desc id="d">Chú giải: thành phần theta A xám, thành phần theta B tím. Hai thanh xếp chồng 100 phần trăm. g bằng (0,2; 0,3): theta A 40 phần trăm, theta B 60 phần trăm. F mũ âm 1 g bằng (8; 30): theta A 21 phần trăm, theta B 79 phần trăm. Chú thích dưới: tỉ trọng theo tổng giá trị tuyệt đối, không phải độ dài bước.</desc>
