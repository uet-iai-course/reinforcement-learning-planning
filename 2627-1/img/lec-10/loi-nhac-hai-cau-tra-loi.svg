<title id="t">Một lời nhắc, hai câu trả lời, sáu lần chọn</title>
<desc id="d">Thẻ lời nhắc ở trên, hai mũi tên xuống hai thẻ câu trả lời 1 và câu trả lời 2. Thẻ 1 ghi mô hình: hai phần ba, kèm thanh xác suất; thẻ 2 ghi mô hình: một phần ba. Dưới thẻ 1 bốn dấu chọn, ghi người chọn 4/6; dưới thẻ 2 hai dấu chọn, ghi người chọn 2/6.</desc>
