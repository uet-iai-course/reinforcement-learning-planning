<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 215" width="540" height="215" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Lượt (a) trên hành lang ngắn</title>
<desc id="d">Hành lang bốn ô xếp một hàng: s 1, s 2, s 3, s 4. Ô s 2 viền nét đứt, ghi hành động 1 sang trái. Ô s 4 tô xám, ghi đích. Ba mũi tên cong phía trên nối các ô theo đường đi của lượt (a): t bằng 0 từ s 1 sang s 2, t bằng 1 từ s 2 sang s 3, t bằng 2 từ s 3 sang s 4.</desc>
