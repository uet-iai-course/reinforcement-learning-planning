<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 350" width="620" height="350" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Lợi thế của từng hành động trên chuỗi hai trạng thái</title>
<desc id="d">Chuỗi dọc: ô s A ghi v pi bằng 1,4 ở trên, ô s B ghi v pi bằng 2 ở dưới; mỗi cung ghi hành động, giá trị hành động q pi và lợi thế A pi. Từ s A: hành động 1 xuống s B, q pi bằng 1,8, A pi bằng cộng 0,4, nét liền xanh; hành động 2 tới ô kết thúc, q pi bằng 1, A pi bằng âm 0,4, nét đứt đỏ. Từ s B tới ô kết thúc: hành động 1, q pi bằng 3, A pi bằng cộng 1, nét liền xanh; hành động 2, q pi bằng 0, A pi bằng âm 2, nét đứt đỏ.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="20.0" y="20.0" width="200.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="120.0" y="55.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="7.0" font-style="italic" font-size="22.4">A</tspan><tspan dy="-7.0"></tspan></text>
<text x="120.0" y="93.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 1,4</tspan></text>
<rect x="20.0" y="230.0" width="200.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="120.0" y="265.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="7.0" font-style="italic" font-size="22.4">B</tspan><tspan dy="-7.0"></tspan></text>
<text x="120.0" y="303.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 2</tspan></text>
<line x1="80.0" y1="110.0" x2="80.0" y2="228.0" stroke="#2E7D4F" stroke-width="3.5" marker-end="url(#mg)"/>
<text x="96.0" y="178.0" font-size="24" text-anchor="start" fill="#2E7D4F"><tspan>1: </tspan><tspan font-style="italic">q</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 1,8</tspan><tspan>, </tspan><tspan font-style="italic">A</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = +0,4</tspan></text>
<line x1="220.0" y1="55.0" x2="568.0" y2="55.0" stroke="#C62828" stroke-width="3.5" marker-end="url(#mr)" stroke-dasharray="10 7"/>
<text x="400.0" y="40.0" font-size="24" text-anchor="middle" fill="#C62828"><tspan>2: </tspan><tspan font-style="italic">q</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 1</tspan><tspan>, </tspan><tspan font-style="italic">A</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = −0,4</tspan></text>
<line x1="220.0" y1="255.0" x2="568.0" y2="255.0" stroke="#2E7D4F" stroke-width="3.5" marker-end="url(#mg)"/>
<text x="400.0" y="240.0" font-size="24" text-anchor="middle" fill="#2E7D4F"><tspan>1: </tspan><tspan font-style="italic">q</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 3</tspan><tspan>, </tspan><tspan font-style="italic">A</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = +1</tspan></text>
<line x1="220.0" y1="300.0" x2="568.0" y2="300.0" stroke="#C62828" stroke-width="3.5" marker-end="url(#mr)" stroke-dasharray="10 7"/>
<text x="400.0" y="332.0" font-size="24" text-anchor="middle" fill="#C62828"><tspan>2: </tspan><tspan font-style="italic">q</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = 0</tspan><tspan>, </tspan><tspan font-style="italic">A</tspan><tspan dy="6.0" font-size="19.2">π</tspan><tspan dy="-6.0"> = −2</tspan></text>
<rect x="572.0" y="40.0" width="30.0" height="30.0" rx="3" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<rect x="572.0" y="240.0" width="30.0" height="30.0" rx="3" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<rect x="572.0" y="285.0" width="30.0" height="30.0" rx="3" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
</svg>
