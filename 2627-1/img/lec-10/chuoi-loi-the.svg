<rect x="387.0" y="252.0" width="26.0" height="26.0" rx="3" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<text x="255.0" y="288.0" font-size="20" text-anchor="middle" fill="#C62828"><tspan>2: 0 − 2 = −2</tspan></text>
</svg>
