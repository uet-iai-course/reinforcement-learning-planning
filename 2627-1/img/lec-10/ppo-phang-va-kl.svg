<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Mục tiêu cắt phẳng trong khi KL tăng tại s B</title>
<desc id="d">Hai bảng theo p B từ 2/3 tới 0,96. Bảng trái, tiêu đề mục tiêu đã phẳng: phần của s B trong 3 lần L CLIP, bằng âm max của 3 trừ 3 p B và 0,8; chấm xám tại p B bằng 2/3, giá trị âm 1, ghi chính sách cũ; đường tím đi lên từ âm 1 tới âm 0,8 tại 11/15, rồi nằm ngang ở âm 0,8; ba chấm tím tại p B bằng 0,733; 0,85; 0,95 đều ở âm 0,8. Bảng phải, tiêu đề đỏ KL vẫn tăng: D KL tại s B theo chiều cũ‖mới, p B cũ bằng 2/3; chấm xám tại 2/3, KL bằng 0, ghi chính sách cũ; đường tím tăng nhanh dần; chấm tại 0,733 ghi 0,011, tại 0,85 ghi 0,104, tại 0,95 ghi 0,396.</desc>
