<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hiệu năng J của ba chính sách trên chuỗi hai trạng thái</title>
<desc id="d">Ba thanh ngang theo J. Chính sách cũ, (0,5; 2/3): thanh xám, 1,400. Giới hạn khi tối đa L CPI trên bộ đệm, (0; 1): thanh đỏ, 1,000. PPO-Clip, (0,4; 11/15): thanh tím, 1,392. Vạch dọc xanh lá tại J bằng 1,4, ghi J bằng 1,4; thanh PPO-Clip kết thúc ngay trước vạch.</desc>
