<title id="t">Vòng cập nhật chính sách</title>
<desc id="d">Sơ đồ vòng năm khối của mạch 6 như ở trang RLHF: khung so sánh của người cho mô hình phần thưởng r mũ, trừ phạt KL, vào khối phần thưởng; vòng chạy PPO ở khối cập nhật; ghi RLHF: bốn mô hình, sinh câu trong lúc học.</desc>
