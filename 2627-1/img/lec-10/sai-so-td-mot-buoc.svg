<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Sai số TD với giá trị đúng sau một bước từ s A</title>
<desc id="d">Ô s A ghi v pi bằng 1,4 bên trái. Cung trên ghi 1, thưởng 0, sang ô s B ghi v pi bằng 2; khung dưới cung: delta 0 bằng 0 cộng 0,9 nhân 2 trừ 1,4 bằng 0,4, bằng A pi của s A, 1. Cung dưới ghi 2, thưởng 1, tới ô kết thúc; khung dưới cung: delta 0 bằng 1 trừ 1,4 bằng âm 0,4, bằng A pi của s A, 2.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="10.0" y="40.0" width="170.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="95.0" y="80.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="7.0" font-style="italic" font-size="22.4">A</tspan><tspan dy="-7.0"></tspan></text>
<text x="95.0" y="119.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="6.2" font-size="20.0">π</tspan><tspan dy="-6.2"> = 1,4</tspan></text>
<rect x="540.0" y="40.0" width="170.0" height="100.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="625.0" y="80.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="7.0" font-style="italic" font-size="22.4">B</tspan><tspan dy="-7.0"></tspan></text>
<text x="625.0" y="119.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v</tspan><tspan dy="6.2" font-size="20.0">π</tspan><tspan dy="-6.2"> = 2</tspan></text>
<rect x="540.0" y="320.0" width="170.0" height="80.0" rx="6" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<text x="625.0" y="369.0" font-size="25" text-anchor="middle" fill="#6E7787"><tspan>kết thúc</tspan></text>
<line x1="180.0" y1="90.0" x2="538.0" y2="90.0" stroke="#1d2433" stroke-width="3.5" marker-end="url(#mk)"/>
<text x="359.0" y="76.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan>1, thưởng 0</tspan></text>
<path d="M 95.0 140.0 L 95.0 360.0 L 538.0 360.0" stroke="#1d2433" stroke-width="3.5" fill="none" stroke-linejoin="round" marker-end="url(#mk)"/>
<text x="330.0" y="346.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan>2, thưởng 1</tspan></text>
<rect x="165.0" y="150.0" width="390.0" height="88.0" rx="10" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<text x="360.0" y="186.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="6.2" font-size="20.0">0</tspan><tspan dy="-6.2"> = 0 + 0,9·2 − 1,4 = 0,4</tspan></text>
<text x="360.0" y="222.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan> = </tspan><tspan font-style="italic">A</tspan><tspan dy="6.2" font-size="20.0">π</tspan><tspan dy="-6.2">(</tspan><tspan font-style="italic">s</tspan><tspan dy="6.2" font-style="italic" font-size="20.0">A</tspan><tspan dy="-6.2">, 1)</tspan></text>
<rect x="165.0" y="378.0" width="390.0" height="88.0" rx="10" fill="#EEF0F4" stroke="#3E4A5E" stroke-width="2"/>
<text x="360.0" y="414.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="6.2" font-size="20.0">0</tspan><tspan dy="-6.2"> = 1 − 1,4 = −0,4</tspan></text>
<text x="360.0" y="450.0" font-size="25" text-anchor="middle" fill="#1d2433"><tspan> = </tspan><tspan font-style="italic">A</tspan><tspan dy="6.2" font-size="20.0">π</tspan><tspan dy="-6.2">(</tspan><tspan font-style="italic">s</tspan><tspan dy="6.2" font-style="italic" font-size="20.0">A</tspan><tspan dy="-6.2">, 2)</tspan></text>
</svg>
