<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 345" width="430" height="345" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Critic đánh giá thấp s B</title>
<desc id="d">Chuỗi thu nhỏ, ô s A ở trên, ô s B ở dưới, các cung ghi hành động và phần thưởng: từ s A, 1, thưởng 0 sang s B; 2, thưởng 1 tới kết thúc; từ s B, 1, thưởng 3 và 2, thưởng 0 tới kết thúc. Dưới ô s B hai thẻ: v mũ bằng 1, màu cam, nét đứt; v pi bằng 2, màu xanh, nét liền.</desc>
