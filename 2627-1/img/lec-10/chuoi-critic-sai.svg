<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 365" width="640" height="365" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Critic đúng ở s A, đánh giá thấp s B</title>
<desc id="d">Chuỗi dọc: ô s A ở trên, ô s B ở dưới; các cung ghi hành động và phần thưởng: từ s A, 1, thưởng 0 xuống s B và 2, thưởng 1 tới kết thúc; từ s B, 1, thưởng 3 và 2, thưởng 0 tới kết thúc. Dưới ô s A, thẻ xanh nét liền: v mũ bằng 1,4 bằng v pi. Dưới ô s B, thẻ cam nét đứt v mũ bằng 1, dấu nhỏ hơn, thẻ xanh nét liền v pi bằng 2.</desc>
