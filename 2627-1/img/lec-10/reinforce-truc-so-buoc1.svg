<title id="t">Ba giá trị của ước lượng REINFORCE, tọa độ θ A</title>
<desc id="d">Trục số đứng ghi g mũ A, tọa độ theta A của ước lượng REINFORCE, từ âm 1 ở dưới tới 1,5 ở trên, có vạch 0. Cạnh mỗi chấm ghi xác suất của loại lượt; diện tích chấm tỉ lệ với xác suất. Chấm tại 1,35, xác suất một phần ba.</desc>
