<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 475" width="840" height="475" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hàm thay thế và ΔJ tính trực tiếp trên đoạn từ π tới π̃</title>
<desc id="d">Đồ thị theo t từ 0 tới 1 dọc đoạn thẳng từ chính sách cũ pi, tại t bằng 0, tới chính sách ứng viên pi ngã bằng (0,9; 0,5), tại t bằng 1. Trục tung từ âm 0,1 tới 0,1. Đường thẳng cam, nét đứt, ghi hàm thay thế: delta L bằng 0,095 t. Đường cong xanh, nét liền, ghi Delta J tính trực tiếp: delta J bằng 0,095 t trừ 0,18 t bình phương; hai đường chung điểm và độ dốc tại t bằng 0. Tại t bằng 1: điểm cam ghi cộng 0,095, điểm xanh ghi âm 0,085. Tại t bằng 0,25: điểm cam ghi 0,02375, điểm xanh ghi 0,0125.</desc>
