<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Ba trực giác của TRPO</title>
<desc id="d">Ba bảng nhỏ. Bảng hàm thay thế: đường cong xanh nét liền và tiếp tuyến cam nét đứt chạm nhau tại một điểm. Bảng miền tin cậy: vòng tròn tím nét đứt quanh một tâm, một chấm xanh bên trong ghi bước nhận, một chấm đỏ bên ngoài, mũi tên từ tâm qua chấm xanh tới chấm đỏ, nhãn đỏ cạnh chấm đỏ: ngoài miền. Bảng gradient tự nhiên: elip tím, mũi tên tím và mũi tên xám nét đứt từ tâm tới biên elip.</desc>
