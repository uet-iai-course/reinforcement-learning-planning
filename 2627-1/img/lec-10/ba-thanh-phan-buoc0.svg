<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Ba thành phần của bổ đề chênh lệch hiệu năng</title>
<desc id="d">Ba khối ngang viền xám, theo thứ tự ba thừa số của công thức. Khối 1: eta pi phẩy của s, số lần thăm có chiết khấu của s dưới pi phẩy; với pi ngã, eta bằng (1; 0,81). Khối 2: pi phẩy của a khi biết s, phân phối hành động mới; pi ngã chọn hành động 1 với xác suất (0,9; 0,5). Khối 3: A pi của (s, a), lợi thế của pi; tại s A (0,4; âm 0,4), tại s B (1; âm 2).</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="3.0" y="4.0" width="386.0" height="144.0" rx="10" fill="#FFFFFF" stroke="#8C95A6" stroke-width="2.5"/>
<text x="196.0" y="44.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>η</tspan><tspan dy="7.0" font-size="22.4">π′</tspan><tspan dy="-7.0">(</tspan><tspan font-style="italic">s</tspan><tspan>)</tspan></text>
<text x="196.0" y="88.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>số lần thăm có chiết khấu</tspan></text>
<text x="196.0" y="128.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>η</tspan><tspan dy="6.0" font-size="19.2">π̃</tspan><tspan dy="-6.0"> = (1;</tspan><tspan> </tspan><tspan>0,81)</tspan></text>
<rect x="407.0" y="4.0" width="386.0" height="144.0" rx="10" fill="#FFFFFF" stroke="#8C95A6" stroke-width="2.5"/>
<text x="600.0" y="44.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>π′(</tspan><tspan font-style="italic">a</tspan><tspan> ∣ </tspan><tspan font-style="italic">s</tspan><tspan>)</tspan></text>
<text x="600.0" y="88.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>phân phối hành động mới</tspan></text>
<text x="600.0" y="128.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>π̃(1 ∣ </tspan><tspan font-style="italic">s</tspan><tspan>) = (0,9;</tspan><tspan> </tspan><tspan>0,5)</tspan></text>
<rect x="811.0" y="4.0" width="386.0" height="144.0" rx="10" fill="#FFFFFF" stroke="#8C95A6" stroke-width="2.5"/>
<text x="1004.0" y="44.0" font-size="28" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan font-style="italic">A</tspan><tspan dy="7.0" font-size="22.4">π</tspan><tspan dy="-7.0">(</tspan><tspan font-style="italic">s</tspan><tspan>, </tspan><tspan font-style="italic">a</tspan><tspan>)</tspan></text>
<text x="1004.0" y="88.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>lợi thế của </tspan><tspan>π</tspan></text>
<text x="1004.0" y="128.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">A</tspan><tspan dy="-6.0">: </tspan><tspan>(0,4;</tspan><tspan> </tspan><tspan>−0,4)</tspan><tspan>, </tspan><tspan font-style="italic">s</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">B</tspan><tspan dy="-6.0">: </tspan><tspan>(1;</tspan><tspan> </tspan><tspan>−2)</tspan></text>
</svg>
