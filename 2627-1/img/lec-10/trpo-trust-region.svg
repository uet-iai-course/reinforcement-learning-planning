<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Miền tin cậy của TRPO</title><desc id="desc">Gradient đề xuất một hướng, ellipsoid Fisher giới hạn bước và tìm điểm có surrogate tốt hơn trong miền KL.</desc><defs><marker id="d" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b15a2b"/></marker></defs><g font-family="Arial,sans-serif" font-size="30"><ellipse cx="480" cy="185" rx="300" ry="115" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="480" y="55" text-anchor="middle">miền KL cục bộ</text><circle cx="400" cy="215" r="11" fill="#222"/><text x="370" y="255" text-anchor="middle">θ_old</text><path d="M410 205L650 115" stroke="#b15a2b" stroke-width="8" marker-end="url(#d)"/><circle cx="650" cy="115" r="11" fill="#b15a2b"/><text x="710" y="100">bước được chọn</text><path d="M410 205L855 35" stroke="#888" stroke-width="5" stroke-dasharray="14 10"/><text x="770" y="60" fill="#555">bước gradient thô</text><text x="480" y="335" text-anchor="middle">tối đa hóa surrogate dưới ràng buộc dịch chuyển chính sách</text></g></svg>
