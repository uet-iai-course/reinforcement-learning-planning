<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 478" width="1000" height="478" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Miền tin cậy bậc hai và bước gradient tự nhiên</title>
<desc id="d">Mặt phẳng tọa độ của bước Delta, cùng tỉ lệ trên hai trục. Elip tâm gốc tọa độ, phương trình một nửa Delta chuyển vị F Delta bằng 0,01 với F bằng diag(4; 1), bán trục 0,0707 theo trục thứ nhất và 0,1414 theo trục thứ hai. Mũi tên nét liền từ gốc theo hướng gradient g bằng (2; 1), dừng ở biên elip. Mũi tên nét đứt từ gốc tới điểm (0,05; 0,1) trên biên elip, ghi bước gradient tự nhiên F mũ trừ 1 g nhân 0,1. Hai mũi tên lệch hướng nhau.</desc>
