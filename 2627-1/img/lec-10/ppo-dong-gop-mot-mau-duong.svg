<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Đóng góp của một mẫu có lợi thế dương</title>
<desc id="d">Đồ thị theo rho từ 0,4 tới 1,6, tiêu đề A bằng cộng 1, epsilon bằng 0,2. Đường cam nét đứt rho nhân A, bằng rho, đi lên đều. Vùng rho lớn hơn 1,2 tô tím nhạt, ghi không thưởng thêm. Đường tím là mục tiêu cắt, min của rho và 1,2: trùng đường cam tới rho bằng 1,2 rồi nằm ngang ở 1,2. Tại rho bằng 1,3: điểm cam 1,3 trên đường cam, điểm tím 1,2 trên đường tím.</desc>
