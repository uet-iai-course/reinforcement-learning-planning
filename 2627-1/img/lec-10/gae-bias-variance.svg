<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Đánh đổi độ chệch và phương sai của GAE</title><desc id="desc">Lambda tăng từ không đến một, trọng số trải sang nhiều sai số TD hơn, thường giảm độ chệch và tăng phương sai.</desc><defs><marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f3e7a"/></marker></defs><g font-family="Arial,sans-serif" font-size="30"><line x1="110" y1="235" x2="850" y2="235" stroke="#2f3e7a" stroke-width="7" marker-end="url(#c)"/><text x="100" y="285" text-anchor="middle">λ=0</text><text x="855" y="285" text-anchor="middle">λ=1</text><text x="480" y="320" text-anchor="middle">nhiều bước TD hơn</text><path d="M125 190 C340 80 620 80 835 190" fill="none" stroke="#b15a2b" stroke-width="8"/><text x="260" y="95" fill="#8b351f">phương sai tăng</text><path d="M125 85 C340 200 620 200 835 85" fill="none" stroke="#2e7d32" stroke-width="8"/><text x="700" y="95" fill="#236128">độ chệch thường giảm</text></g></svg>
