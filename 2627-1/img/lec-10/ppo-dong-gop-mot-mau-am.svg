<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 440" width="740" height="440" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Đóng góp của một mẫu có lợi thế âm</title>
<desc id="d">Đồ thị theo rho từ 0,4 tới 1,6, tiêu đề A bằng âm 2, epsilon bằng 0,2. Đường cam nét đứt rho nhân A, bằng âm 2 rho, đi xuống đều. Vùng rho nhỏ hơn 0,8 tô tím nhạt, ghi không thưởng thêm. Đường tím là mục tiêu cắt, min của âm 2 rho và âm 1,6: nằm ngang ở âm 1,6 tới rho bằng 0,8 rồi trùng đường cam. Tại rho bằng 0,7: điểm cam âm 1,4, điểm tím âm 1,6. Tại rho bằng 1,3: hai đường trùng nhau, giá trị âm 2,6.</desc>
