<title id="t">Mục tiêu cắt theo tỉ số chính sách, hai dấu của lợi thế</title>
<desc id="d">Khung trái, A mũ dương: đường tím đậm là mục tiêu cắt, đi lên theo rho tới 1,2 rồi nằm ngang; đoạn ngang tô sọc, ghi gradient bằng 0. Đường cam mảnh nét đứt là rho nhân A mũ. Trục hoành có vạch 0,8; 1; 1,2. Khung phải, A mũ âm: mục tiêu cắt nằm ngang tới rho bằng 0,8, đoạn ngang tô sọc ghi gradient bằng 0, rồi đi xuống theo rho nhân A mũ.</desc>
