<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Trọng số của lợi tức λ và của GAE, λ = 0,5</title>
<desc id="d">Hai biểu đồ cột xếp chồng. Trên: trọng số (1 trừ lambda) nhân lambda mũ n trừ 1 của lợi tức n bước, lambda bằng 0,5, n từ 1 đến 4: 0,5; 0,25; 0,125; 0,0625; tiếp tục giảm một nửa. Dưới: trọng số (gamma lambda) mũ k của sai số TD delta t cộng k, gamma lambda bằng 0,45, k từ 0 đến 3: 1; 0,45; 0,2025; 0,091; tiếp tục giảm. Dưới hình ghi: trên chuỗi, T trừ t trừ 1 bằng 1: trọng số 0,5 cho G 0:1, 0,5 dồn vào G 0.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<text x="20.0" y="34.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>trọng số </tspan><tspan>(1 − λ)λ</tspan><tspan dy="-9.1" font-style="italic" font-size="19.2">n</tspan><tspan font-size="19.2">−1</tspan><tspan dy="9.1"> của </tspan><tspan font-style="italic">G</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan font-size="19.2">:</tspan><tspan font-style="italic" font-size="19.2">t</tspan><tspan font-size="19.2">+</tspan><tspan font-style="italic" font-size="19.2">n</tspan><tspan dy="-6.0">, </tspan><tspan>λ = 0,5</tspan></text>
<rect x="70.0" y="80.0" width="60.0" height="110.0" rx="0" fill="#3E4A5E" stroke="none" stroke-width="0"/>
<text x="100.0" y="70.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,5</tspan></text>
<text x="100.0" y="220.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>1</tspan></text>
<rect x="180.0" y="135.0" width="60.0" height="55.0" rx="0" fill="#3E4A5E" stroke="none" stroke-width="0"/>
<text x="210.0" y="125.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,25</tspan></text>
<text x="210.0" y="220.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>2</tspan></text>
<rect x="290.0" y="162.5" width="60.0" height="27.5" rx="0" fill="#3E4A5E" stroke="none" stroke-width="0"/>
<text x="320.0" y="152.5" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,125</tspan></text>
<text x="320.0" y="220.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>3</tspan></text>
<rect x="400.0" y="176.2" width="60.0" height="13.8" rx="0" fill="#3E4A5E" stroke="none" stroke-width="0"/>
<text x="430.0" y="166.2" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,0625</tspan></text>
<text x="430.0" y="220.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>4</tspan></text>
<text x="540.0" y="176.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan>…</tspan></text>
<text x="540.0" y="220.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>…</tspan></text>
<line x1="50.0" y1="190.0" x2="580.0" y2="190.0" stroke="#1d2433" stroke-width="2"/>
<text x="590.0" y="220.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan font-style="italic">n</tspan></text>
<text x="20.0" y="279.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>trọng số </tspan><tspan>(γλ)</tspan><tspan dy="-9.1" font-style="italic" font-size="19.2">k</tspan><tspan dy="9.1"> của </tspan><tspan>δ</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan font-size="19.2">+</tspan><tspan font-style="italic" font-size="19.2">k</tspan><tspan dy="-6.0">, </tspan><tspan>γλ = 0,45</tspan></text>
<rect x="70.0" y="325.0" width="60.0" height="110.0" rx="0" fill="#6B3FA0" stroke="none" stroke-width="0"/>
<text x="100.0" y="315.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>1</tspan></text>
<text x="100.0" y="465.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0</tspan></text>
<rect x="180.0" y="385.5" width="60.0" height="49.5" rx="0" fill="#6B3FA0" stroke="none" stroke-width="0"/>
<text x="210.0" y="375.5" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,45</tspan></text>
<text x="210.0" y="465.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>1</tspan></text>
<rect x="290.0" y="412.7" width="60.0" height="22.3" rx="0" fill="#6B3FA0" stroke="none" stroke-width="0"/>
<text x="320.0" y="402.7" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,2025</tspan></text>
<text x="320.0" y="465.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>2</tspan></text>
<rect x="400.0" y="425.0" width="60.0" height="10.0" rx="0" fill="#6B3FA0" stroke="none" stroke-width="0"/>
<text x="430.0" y="415.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>0,091</tspan></text>
<text x="430.0" y="465.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>3</tspan></text>
<text x="540.0" y="421.0" font-size="28" text-anchor="middle" fill="#1d2433"><tspan>…</tspan></text>
<text x="540.0" y="465.0" font-size="24" text-anchor="middle" fill="#1d2433"><tspan>…</tspan></text>
<line x1="50.0" y1="435.0" x2="580.0" y2="435.0" stroke="#1d2433" stroke-width="2"/>
<text x="590.0" y="465.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan font-style="italic">k</tspan></text>
<text x="20.0" y="505.0" font-size="24" text-anchor="start" fill="#6E7787"><tspan>trên chuỗi, </tspan><tspan font-style="italic">T</tspan><tspan> − </tspan><tspan font-style="italic">t</tspan><tspan> − 1 = 1</tspan><tspan>: trọng số 0,5 cho </tspan><tspan font-style="italic">G</tspan><tspan dy="6.0" font-size="19.2">0:1</tspan><tspan dy="-6.0">,</tspan></text>
<text x="20.0" y="540.0" font-size="24" text-anchor="start" fill="#6E7787"><tspan>0,5 dồn vào </tspan><tspan font-style="italic">G</tspan><tspan dy="6.0" font-size="19.2">0</tspan><tspan dy="-6.0"></tspan></text>
</svg>
