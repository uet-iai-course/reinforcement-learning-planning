<text x="320.0" y="399.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"> = </tspan><tspan font-style="italic">R</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan font-size="20.8">+1</tspan><tspan dy="-6.5"> + γ </tspan><tspan font-style="italic">v̂</tspan><tspan>(</tspan><tspan font-style="italic">S</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan font-size="20.8">+1</tspan><tspan dy="-6.5">) − </tspan><tspan font-style="italic">v̂</tspan><tspan>(</tspan><tspan font-style="italic">S</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5">)</tspan></text>
<text x="980.0" y="399.0" font-size="26" text-anchor="middle" fill="#6B3FA0"><tspan font-style="italic">G</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"> → </tspan><tspan font-style="italic">G</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"> − </tspan><tspan font-style="italic">v</tspan><tspan dy="6.5" font-size="20.8">π</tspan><tspan dy="-6.5">(</tspan><tspan font-style="italic">S</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5">) → δ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"></tspan></text>
<text x="980.0" y="434.0" font-size="26" text-anchor="middle" fill="#6B3FA0"><tspan>→ </tspan><tspan font-style="italic">Â</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan dy="-6.5"> = Σ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">k</tspan><tspan dy="-6.5"> (γλ)</tspan><tspan dy="-9.9" font-style="italic" font-size="20.8">k</tspan><tspan dy="9.9"> δ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">t</tspan><tspan font-size="20.8">+</tspan><tspan font-style="italic" font-size="20.8">k</tspan><tspan dy="-6.5"></tspan></text>
<text x="980.0" y="469.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan>tọa độ </tspan><tspan>θ</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">A</tspan><tspan dy="-6.5">: phương sai 0,69 → 0,20 → 0</tspan></text>
