<text x="1050.0" y="674.0" font-size="26" text-anchor="middle" fill="#6B3FA0"><tspan>→ tối đa min(</tspan><tspan>ρ</tspan><tspan font-style="italic">Â</tspan><tspan>, clip(</tspan><tspan>ρ</tspan><tspan>)</tspan><tspan font-style="italic">Â</tspan><tspan>) (PPO)</tspan></text>
<text x="1050.0" y="709.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan>hàm thay thế đoán +0,175, thật −0,05</tspan></text>
<text x="1050.0" y="744.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">B</tspan><tspan dy="-6.5">, mẫu đúng tần suất: dừng ở </tspan><tspan font-style="italic">p</tspan><tspan> = 0,8</tspan></text>
