<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 1730 820" width="1730" height="820" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Vòng cập nhật chính sách</title>
<desc id="d">Sơ đồ vòng năm khối lần cuối, mỗi khối một tiêu đề: phần thưởng; thu lượt bằng chính sách cũ; critic v mũ; hệ số; cập nhật. Khối critic: delta t bằng R t cộng 1 cộng gamma v mũ của S t cộng 1 trừ v mũ của S t. Khối hệ số, chữ tím: G t, rồi G t trừ v pi của S t, rồi delta t, rồi A mũ t bằng tổng theo k của gamma lambda mũ k nhân delta t cộng k; dòng dưới: tọa độ theta A, phương sai 0,69, 0,20, 0. Khối cập nhật, chữ tím: một bước gradient, rồi tối đa L với KL không quá kappa (TRPO), rồi tối đa min của rho A mũ và clip của rho nhân A mũ (PPO); dòng dưới: hàm thay thế đoán cộng 0,175, thật âm 0,05; s B, mẫu đúng tần suất: dừng ở p bằng 0,8. Khối thu lượt thêm dòng: lượt vừa thu, dùng K lần rồi bỏ. Khối phần thưởng: của môi trường, hoặc học từ so sánh và trừ phạt KL: pi sao tỉ lệ với pi ref nhân e mũ r mũ chia beta, ví dụ (bốn phần năm; một phần năm). Dưới trái, khung so sánh của người: mũi tên mảnh lên khối phần thưởng và mũi tên nét đứt tím ghi DPO chạy dưới vòng, không chạm khối nào, tới mũi tên quay về, ghi tới pi sao.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
