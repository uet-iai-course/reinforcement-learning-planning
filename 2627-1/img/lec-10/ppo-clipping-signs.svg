<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">PPO clipping phụ thuộc dấu lợi thế</title><desc id="desc">Với lợi thế dương, trần nằm ở một cộng epsilon; với lợi thế âm, sàn tỷ số nằm ở một trừ epsilon. Phía bất lợi không bị cắt.</desc><g font-family="Arial,sans-serif" font-size="30"><line x1="90" y1="280" x2="880" y2="280" stroke="#222" stroke-width="4"/><line x1="190" y1="320" x2="190" y2="50" stroke="#222" stroke-width="4"/><text x="880" y="320">w</text><text x="125" y="60">ℓ</text><path d="M90 250 L555 80 L870 80" fill="none" stroke="#2e7d32" stroke-width="8"/><text x="650" y="65" fill="#236128">Â &gt; 0: trần tại 1+ε</text><path d="M90 210 L330 210 L870 330" fill="none" stroke="#b15a2b" stroke-width="8"/><text x="340" y="195" fill="#8b351f">Â &lt; 0: sàn tỷ số tại 1−ε</text><line x1="330" y1="45" x2="330" y2="300" stroke="#888" stroke-width="3" stroke-dasharray="10 8"/><line x1="555" y1="45" x2="555" y2="300" stroke="#888" stroke-width="3" stroke-dasharray="10 8"/><text x="330" y="340" text-anchor="middle">1−ε</text><text x="555" y="340" text-anchor="middle">1+ε</text></g></svg>
