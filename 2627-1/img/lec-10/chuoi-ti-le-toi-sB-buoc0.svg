<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 335" width="520" height="335" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Xác suất thăm s B của chính sách cũ và chính sách ứng viên</title>
<desc id="d">Trên: ô s A, mũi tên hành động 1 sang ô s B. Dưới: tiêu đề xác suất thăm s B và hai thanh ngang trong khung dài một đơn vị: chính sách cũ pi, 0,5, thanh xám dài một nửa; chính sách ứng viên pi ngã, 0,9, thanh tím dài 0,9.</desc>
