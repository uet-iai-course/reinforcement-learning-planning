<rect x="450" y="196" width="200" height="104" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="550" y="236" font-size="21" text-anchor="middle" font-weight="700">TRPO</text>
<text x="550" y="272" font-size="21" text-anchor="middle">KL trung bình ≤ <tspan font-style="italic">κ</tspan></text>
