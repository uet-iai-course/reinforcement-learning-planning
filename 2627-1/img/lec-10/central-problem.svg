<text x="795" y="228" font-size="21" text-anchor="middle" font-weight="700">PPO</text>
<text x="795" y="257" font-size="21" text-anchor="middle">cắt <tspan font-style="italic">ρ</tspan><tspan dy="6.3" font-size="14.7" font-style="italic">t</tspan><tspan dy="-6.3"> vào</tspan></text>
<text x="795" y="285" font-size="21" text-anchor="middle">[1 − <tspan font-style="italic">ϵ</tspan>, 1 + <tspan font-style="italic">ϵ</tspan>]</text>
<text x="300" y="322" font-size="19" text-anchor="middle" fill="#424954">Mục 4</text>
<text x="550" y="322" font-size="19" text-anchor="middle" fill="#424954">Mục 5</text>
<text x="795" y="322" font-size="19" text-anchor="middle" fill="#424954">Mục 6</text>
<rect x="950" y="108" width="285" height="144" rx="12" fill="#FFFFFF" stroke="#1d2433" stroke-width="5"/>
<text x="1092.5" y="142" font-size="21" text-anchor="middle" font-weight="700">Thuật toán 10.49</text>
<text x="1092.5" y="172" font-size="21" text-anchor="middle">PPO kiểu actor–critic</text>
<text x="1092.5" y="204" font-size="20" text-anchor="middle">GAE cho lợi thế,</text>
<text x="1092.5" y="232" font-size="20" text-anchor="middle">mục tiêu cắt cho chính sách</text>
<line x1="902" y1="100" x2="944" y2="140" stroke="#B15A2B" stroke-width="3" marker-end="url(#ao)"/>
<line x1="902" y1="244" x2="944" y2="214" stroke="#2F3E7A" stroke-width="3" marker-end="url(#an)"/>
