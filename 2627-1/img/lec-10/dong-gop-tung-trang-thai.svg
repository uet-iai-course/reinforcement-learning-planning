<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Đóng góp của từng trạng thái vào dự báo và vào mức thay đổi tính trực tiếp</title>
<desc id="d">Bảng trái, delta L: số lần thăm eta pi. Trục tung chung từ âm 0,45 tới 0,4. Cột s A dương, xanh lục nhạt: 1 nhân 0,32 bằng cộng 0,32. Cột s B âm, xám đậm: 0,45 nhân âm 0,5 bằng âm 0,225. Tổng delta L bằng cộng 0,095, chữ cam trong khung nét đứt. Bảng phải, delta J: số lần thăm eta pi ngã. Cột s A: cộng 0,32. Cột s B: 0,81 nhân âm 0,5 bằng âm 0,405. Tổng delta J bằng âm 0,085, chữ xanh trong khung liền. Ngoặc đỏ tại s B nối mức âm 0,225 với mức âm 0,405, ghi âm 0,18.</desc>
