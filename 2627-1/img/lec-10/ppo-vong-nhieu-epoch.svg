<line x1="800.0" y1="204.0" x2="800.0" y2="254.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="576.0" y1="350.0" x2="466.0" y2="350.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="240.0" y1="256.0" x2="240.0" y2="206.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="256.0" y="238.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan>thu bộ đệm mới</tspan></text>
<text x="816.0" y="238.0" font-size="24" text-anchor="start" fill="#6E7787"><tspan>dùng lại, không đổi</tspan></text>
<path d="M 1022.0 400.0 L 1064.0 400.0 L 1064.0 300.0 L 1026.0 300.0" stroke="#6B3FA0" stroke-width="3.5" fill="none" stroke-linejoin="miter" marker-end="url(#mp)"/>
<text x="1074.0" y="358.0" font-size="24" text-anchor="start" font-weight="bold" fill="#6B3FA0"><tspan font-style="italic">K</tspan><tspan> lần</tspan></text>
<rect x="20.0" y="460.0" width="28.0" height="24.0" rx="4" fill="#EEF0F4" stroke="#8C95A6" stroke-width="3"/>
<text x="58.0" y="480.0" font-size="22" text-anchor="start" fill="#6E7787"><tspan>giữ cố định trong cả vòng</tspan></text>
<rect x="580.0" y="460.0" width="28.0" height="24.0" rx="4" fill="#F1EAF9" stroke="#6B3FA0" stroke-width="4"/>
