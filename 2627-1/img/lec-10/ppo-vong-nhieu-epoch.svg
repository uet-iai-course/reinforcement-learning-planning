<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Một vòng PPO với nhiều lần qua bộ đệm</title>
<desc id="d">Bốn khối xếp thành vòng. Khối 1, trên trái: thu bộ đệm D bằng pi old. Mũi tên sang khối 2, trên phải, nền xám: giữ cố định log pi old của a t khi biết s t, A mũ t, V targ t. Mũi tên xuống khối 3, dưới phải, viền tím: K lần qua bộ đệm, mỗi lần tính lại rho t của theta và mất mát; mũi tên tím vòng bên phải ghi K lần. Mũi tên sang khối 4, dưới trái: theo dõi mức đổi chính sách, nhận chính sách mới. Mũi tên từ khối 4 lên khối 1 ghi thu bộ đệm mới. Chú giải: xám là giữ cố định, tím là tính lại.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="20.0" y="20.0" width="440.0" height="180.0" rx="12" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<circle cx="56.0" cy="60.0" r="22" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="3"/>
<text x="56.0" y="69.4" font-size="26" text-anchor="middle" font-weight="bold" fill="#3E4A5E"><tspan>1</tspan></text>
<text x="92.0" y="66.0" font-size="26" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>Thu bộ đệm </tspan><tspan>𝒟</tspan></text>
<text x="92.0" y="103.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan>bằng </tspan><tspan>π</tspan><tspan dy="6.0" font-size="19.2">old</tspan><tspan dy="-6.0"></tspan></text>
<rect x="580.0" y="20.0" width="440.0" height="180.0" rx="12" fill="#EEF0F4" stroke="#8C95A6" stroke-width="3"/>
<circle cx="616.0" cy="60.0" r="22" fill="#FFFFFF" stroke="#8C95A6" stroke-width="3"/>
<text x="616.0" y="69.4" font-size="26" text-anchor="middle" font-weight="bold" fill="#8C95A6"><tspan>2</tspan></text>
<text x="652.0" y="66.0" font-size="26" text-anchor="start" font-weight="bold" fill="#6E7787"><tspan>Giữ cố định</tspan></text>
<text x="652.0" y="103.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan>log</tspan><tspan> π</tspan><tspan dy="6.0" font-size="19.2">old</tspan><tspan dy="-6.0">(</tspan><tspan font-style="italic">a</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan dy="-6.0"> | </tspan><tspan font-style="italic">s</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan dy="-6.0">)</tspan></text>
<text x="652.0" y="140.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan font-style="italic">Â</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan dy="-6.0">,  </tspan><tspan font-style="italic">V</tspan><tspan dy="-9.1" font-size="19.2">targ</tspan><tspan dy="15.1" font-style="italic" font-size="19.2">t</tspan><tspan dy="-6.0"></tspan></text>
<rect x="580.0" y="260.0" width="440.0" height="180.0" rx="12" fill="#F1EAF9" stroke="#6B3FA0" stroke-width="4"/>
<circle cx="616.0" cy="300.0" r="22" fill="#FFFFFF" stroke="#6B3FA0" stroke-width="3"/>
<text x="616.0" y="309.4" font-size="26" text-anchor="middle" font-weight="bold" fill="#6B3FA0"><tspan>3</tspan></text>
<text x="652.0" y="306.0" font-size="26" text-anchor="start" font-weight="bold" fill="#6B3FA0"><tspan font-style="italic">K</tspan><tspan> lần qua bộ đệm</tspan></text>
<text x="652.0" y="343.0" font-size="24" text-anchor="start" fill="#6B3FA0"><tspan>mỗi lần tính lại</tspan></text>
<text x="652.0" y="380.0" font-size="24" text-anchor="start" fill="#6B3FA0"><tspan>ρ</tspan><tspan dy="6.0" font-style="italic" font-size="19.2">t</tspan><tspan dy="-6.0">(θ)</tspan><tspan> và mất mát</tspan></text>
<rect x="20.0" y="260.0" width="440.0" height="180.0" rx="12" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<circle cx="56.0" cy="300.0" r="22" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="3"/>
<text x="56.0" y="309.4" font-size="26" text-anchor="middle" font-weight="bold" fill="#3E4A5E"><tspan>4</tspan></text>
<text x="92.0" y="306.0" font-size="26" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>Theo dõi</tspan></text>
<text x="92.0" y="343.0" font-size="24" text-anchor="start" fill="#1d2433"><tspan>mức đổi chính sách</tspan></text>
<text x="92.0" y="380.0" font-size="24" text-anchor="start" font-weight="bold" fill="#1d2433"><tspan>→ chính sách mới</tspan></text>
