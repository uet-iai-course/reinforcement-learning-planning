<title id="t">Bốn tỉ số trong một lô và khoảng cắt</title>
<desc id="d">Bốn thanh đứng theo rho, dải từ 0,8 tới 1,2 tô nhạt, ghi khoảng cắt. Mẫu 1: 1,05, tím, trong dải. Mẫu 2: 1,18, tím, trong dải. Mẫu 3: 1,24, đỏ, vượt dải. Mẫu 4: 0,70, đỏ, dưới dải. KL xấp xỉ (approxKL) của lô, một phần tư tổng của (rho trừ 1) trừ log rho, bằng 0,0243.</desc>
