<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hàm mục tiêu theo độ dài bước, lượt s A rồi hành động 2</title>
<desc id="d">Đồ thị J theo bước học alpha từ 0 tới 8. Trục tung từ 0,95 tới 1,45. Đường ngang mảnh tại 1,4 ghi chính sách hiện tại; điểm tại alpha bằng 0, J bằng 1,4. Điểm tại alpha bằng 1, J bằng 1,30. Điểm tại alpha bằng 2, J bằng 1,22. Đường cong xanh, nét liền, J bằng 1 cộng 0,8 nhân sigma của âm 0,5 alpha, đi qua ba điểm và giảm dần về đường ngang nét đứt tại 1, ghi giới hạn.</desc>
