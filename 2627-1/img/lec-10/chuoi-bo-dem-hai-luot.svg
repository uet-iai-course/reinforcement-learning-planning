<title id="t">Bộ đệm hai lượt trên chuỗi</title>
<desc id="d">Chuỗi thu nhỏ: ô s A trên, ô s B dưới, hai ô kết thúc bên phải. Lượt 1, nét liền đậm: từ s A xuống s B rồi tới kết thúc, thưởng 0. Lượt 2, nét đứt đậm: từ s A tới kết thúc, thưởng 1.</desc>
