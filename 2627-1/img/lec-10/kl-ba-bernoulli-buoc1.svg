<title id="t">Ba phân phối hành động tại s A với TV và KL so với π</title>
<desc id="d">Tiêu đề: phân phối hành động tại s A; chú giải: hành động 1 xanh dương, hành động 2 xám. Mỗi hàng một thanh xếp chồng 100 phần trăm, cột phải ghi TV và KL so với pi. Hàng pi: 50 phần trăm và 50 phần trăm; TV 0, KL 0. Hàng t bằng 0,25: 60 phần trăm và 40 phần trăm; TV 0,1, KL 0,0204.</desc>
