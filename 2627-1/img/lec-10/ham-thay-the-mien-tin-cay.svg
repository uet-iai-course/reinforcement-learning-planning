<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 470" width="600" height="470" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Miền tin cậy trên đoạn từ π tới π̃</title>
<desc id="d">Cùng hai đường theo t của trang trước: hàm thay thế, đường thẳng cam nét đứt; Delta J tính trực tiếp, đường cong xanh nét liền. Dải tím nhạt phủ t từ 0 tới 0,515, ghi miền tin cậy, kappa bằng 0,01; trong dải, Delta J tính trực tiếp không âm. Phần t lớn hơn 0,515 phủ trắng mờ, ghi ngoài miền. Tại t bằng 1 ghi: pi ngã, D KL trung bình bằng 0,054.</desc>
