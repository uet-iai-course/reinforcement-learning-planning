<title id="t">Hàm thay thế tiếp xúc J tại chính sách cũ</title>
<desc id="d">Đồ thị theo t từ 0 tới 1 dọc đoạn từ chính sách cũ (một nửa; hai phần ba) tới (1; 0,5); dưới trục, t bằng 0,4 ứng với chính sách (0,7; 0,6). Đường thẳng màu cam, nét đứt: delta L bằng 0,175 t. Đường cong xanh, nét liền: delta J bằng 0,175 t trừ 0,225 t bình phương. Hai đường chung điểm và độ dốc tại t bằng 0. Tại t bằng 0,4: điểm cam đoán 0,07, điểm xanh thật 0,034.</desc>
