<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" width="540" height="350" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Critic chấm hành động sau một bước</title>
<desc id="d">Ô s A ghi v mũ bằng 1,4, mũi tên ghi 1, thưởng 0 sang ô s B ghi v mũ bằng 2. Khung giữa: delta t bằng 0 cộng 0,9 nhân 2 trừ 1,4 bằng 0,4, bằng A pi của s A, 1. Từ khung này hai mũi tên xuống hai khung: actor, hệ số của hàm điểm; critic, viền tím, sai lệch để học v mũ.</desc>
<defs><marker id="mk" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#1d2433"/></marker><marker id="mf" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#3E4A5E"/></marker><marker id="mx" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#8C95A6"/></marker><marker id="mr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#C62828"/></marker><marker id="mo" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#B35C00"/></marker><marker id="mg" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#2E7D4F"/></marker><marker id="mp" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="15" refY="9" orient="auto"><path d="M0,1 L17,9 L0,17 Z" fill="#6B3FA0"/></marker><pattern id="sx" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#8C95A6" stroke-width="3"/></pattern><pattern id="sp" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#6B3FA0" stroke-width="3"/></pattern><pattern id="sg" patternUnits="userSpaceOnUse" width="11" height="11" patternTransform="rotate(45)"><rect width="11" height="11" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="11" stroke="#2E7D4F" stroke-width="3"/></pattern></defs>
<rect x="20.0" y="20.0" width="160.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="100.0" y="57.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">A</tspan><tspan dy="-6.5"></tspan></text>
<text x="100.0" y="93.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v̂</tspan><tspan> = 1,4</tspan></text>
<rect x="360.0" y="20.0" width="160.0" height="90.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="440.0" y="57.0" font-size="26" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">s</tspan><tspan dy="6.5" font-style="italic" font-size="20.8">B</tspan><tspan dy="-6.5"></tspan></text>
<text x="440.0" y="93.0" font-size="21" text-anchor="middle" fill="#1d2433"><tspan font-style="italic">v̂</tspan><tspan> = 2</tspan></text>
<line x1="180.0" y1="65.0" x2="358.0" y2="65.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<text x="270.0" y="52.0" font-size="20" text-anchor="middle" fill="#1d2433"><tspan>1, thưởng 0</tspan></text>
<rect x="60.0" y="130.0" width="420.0" height="86.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="270.0" y="165.0" font-size="22" text-anchor="middle" fill="#1d2433"><tspan>δ</tspan><tspan dy="5.5" font-style="italic" font-size="17.6">t</tspan><tspan dy="-5.5"> = 0 + 0,9·2 − 1,4 = 0,4</tspan></text>
<text x="270.0" y="199.0" font-size="22" text-anchor="middle" fill="#1d2433"><tspan> = </tspan><tspan font-style="italic">A</tspan><tspan dy="5.5" font-size="17.6">π</tspan><tspan dy="-5.5">(</tspan><tspan font-style="italic">s</tspan><tspan dy="5.5" font-style="italic" font-size="17.6">A</tspan><tspan dy="-5.5">,1)</tspan></text>
<line x1="200.0" y1="216.0" x2="140.0" y2="256.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<line x1="340.0" y1="216.0" x2="400.0" y2="256.0" stroke="#1d2433" stroke-width="3" marker-end="url(#mk)"/>
<rect x="20.0" y="258.0" width="240.0" height="82.0" rx="10" fill="#FFFFFF" stroke="#3E4A5E" stroke-width="2.5"/>
<text x="140.0" y="290.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d2433"><tspan>actor</tspan></text>
<text x="140.0" y="322.0" font-size="20" text-anchor="middle" fill="#1d2433"><tspan>hệ số của hàm điểm</tspan></text>
<rect x="280.0" y="258.0" width="240.0" height="82.0" rx="10" fill="#F1EAF9" stroke="#6B3FA0" stroke-width="3.5"/>
<text x="400.0" y="290.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#6B3FA0"><tspan>critic</tspan></text>
<text x="400.0" y="322.0" font-size="20" text-anchor="middle" fill="#1d2433"><tspan>sai lệch để học </tspan><tspan font-style="italic">v̂</tspan></text>
</svg>
