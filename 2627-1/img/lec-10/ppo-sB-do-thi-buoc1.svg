<desc id="d">Đồ thị theo p từ hai phần ba tới 1, trục tung từ 0 tới 1. Điểm đen tại p bằng hai phần ba ghi chính sách cũ. Đường cam, nét đứt: 3p trừ 2. Đường xanh, nét liền đậm, trùng 3p trừ 2 từ hai phần ba tới 0,73; vạch đứng mảnh tại 0,73, ghi rho của hành động 2 bằng 0,8.</desc>
