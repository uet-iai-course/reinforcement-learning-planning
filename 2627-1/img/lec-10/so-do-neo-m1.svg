<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -30 2620 820" width="2620" height="820" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Vòng cập nhật chính sách</title>
<desc id="d">Sơ đồ vòng năm khối của REINFORCE. Khối phần thưởng phần thưởng; khối thu lượt thu lượt bằng chính sách cũ; khối critic chưa có, nét đứt; khối hệ số hệ số của mỗi bước G t, kèm dấu hỏi đỏ ghi dao động; khối cập nhật cập nhật một bước gradient, kèm dấu hỏi đỏ ghi bước dài làm J giảm; mũi tên từ khối cập nhật vòng về khối thu lượt ghi chính sách mới thành chính sách cũ. Cạnh các khối có thẻ tên mạch: mạch 6 ở khối phần thưởng, mạch 2 ở khối critic, mạch 2 và 3 ở khối 4, mạch 4 và 5 ở khối cập nhật. Cột phải liệt kê sáu mạch: 2. So lợi tức với giá trị của trạng thái; 3. Trộn đánh giá một bước và cả lượt; 4. Đánh giá chính sách mới bằng dữ liệu cũ; 5. Giữ chính sách mới gần chính sách cũ; 6. Học từ so sánh của người; 7. Tổng kết.</desc>
