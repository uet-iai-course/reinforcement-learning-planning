<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 572" width="1000" height="572" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Sơ đồ tổng thể của TRPO</title>
<desc id="d">Khối trên cùng: lượt thu bằng chính sách cũ. Từ khối này một mũi tên tách thành hai, xuống hai khối cạnh nhau. Khối trái, viền cam nét đứt: hàm thay thế, dự báo mức cải thiện. Khối phải, viền tím: KL trung bình, giới hạn mức đổi chính sách. Hai mũi tên từ hai khối giữa hội tụ vào khối: tối ưu trong miền tin cậy, bằng gradient tự nhiên và tìm kiếm lùi. Mũi tên cuối xuống khối: chính sách mới.</desc>
