<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 380" role="img" aria-labelledby="title desc">
  <title id="title">Hai giao diện quan sát mê cung</title><desc id="desc">Bên trái tác tử nhận tọa độ trong bản đồ cố định; bên phải tác tử chỉ nhận một cửa sổ cục bộ có thể giống nhau tại nhiều tọa độ.</desc>
  <g font-family="sans-serif" text-anchor="middle"><rect x="55" y="55" width="420" height="265" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="265" y="105" font-size="30" font-weight="bold">Quan sát: tọa độ</text><circle cx="265" cy="195" r="48" fill="#B15A2B"/><text x="265" y="205" font-size="30" fill="#fff">(1,1)</text><text x="265" y="285" font-size="30">Đầy đủ với bản đồ cố định đã nêu</text><rect x="575" y="55" width="420" height="265" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="785" y="105" font-size="30" font-weight="bold">Quan sát: ảnh cục bộ</text><g stroke="#2F3E7A" stroke-width="3"><rect x="665" y="130" width="240" height="140" fill="#fff"/><path d="M725 130V270M785 130V270M845 130V270M665 200H905"/></g><circle cx="785" cy="200" r="20" fill="#B15A2B"/><rect x="845" y="130" width="60" height="70" fill="#666"/><text x="785" y="300" font-size="30">Có thể giống nhau ở nhiều tọa độ</text></g>
</svg>
