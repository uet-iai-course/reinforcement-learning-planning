<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" role="img" aria-labelledby="title desc"><title id="title">Hai nhánh đến đích, một nhánh có hố</title><desc id="desc">Từ S, nhánh trên gặp hố H sau hai bước và kết thúc. Nhánh dưới đi vòng sáu bước đến G. Mỗi đoạn nối hai nút là một bước. H và G không có hành động đi ra.</desc><rect width="620" height="470" fill="#fff"/><g font-family="Arial,sans-serif" fill="#26354a"><text x="310" y="34" text-anchor="middle" font-size="24">Mỗi đoạn nối hai nút = 1 bước</text><path d="M70 125 H550 V335 H70 Z" fill="none" stroke="#ede9e4" stroke-width="54" stroke-linejoin="round"/><path d="M70 125 H310" fill="none" stroke="#b85424" stroke-width="6" stroke-dasharray="12 7"/><path d="M70 125 V335 H550 V125" fill="none" stroke="#334879" stroke-width="6"/>
<circle cx="70" cy="125" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="190" cy="125" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="430" cy="125" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="550" cy="125" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="70" cy="335" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="190" cy="335" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="310" cy="335" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="430" cy="335" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="550" cy="335" r="17" fill="white" stroke="#334879" stroke-width="3"/><circle cx="310" cy="125" r="29" fill="#292e36"/><path d="M297 112 L323 138 M323 112 L297 138" stroke="white" stroke-width="4"/><text x="70" y="85" text-anchor="middle" font-size="27" font-weight="bold">S</text><text x="310" y="77" text-anchor="middle" font-size="26">Hố H</text><rect x="524" y="99" width="52" height="52" rx="5" fill="#334879"/><text x="550" y="136" text-anchor="middle" fill="white" font-size="28">G</text><text x="550" y="78" text-anchor="middle" font-size="26">Đích +10</text><text x="190" y="202" text-anchor="middle" fill="#a0441c" font-size="26">2 bước → H</text><text x="310" y="398" text-anchor="middle" fill="#334879" font-size="26">6 bước → G</text><text x="310" y="447" text-anchor="middle" font-size="22">Đến H hoặc G: kết thúc</text></g></svg>