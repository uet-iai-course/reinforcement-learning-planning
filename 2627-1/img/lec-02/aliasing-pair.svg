<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Hai ô có cùng mã bốn ô kề nhưng cần hai hướng khác nhau</title>
<desc id="desc">Mê cung tám hàng tám cột của Bài 02, bắt đầu tại (0,2), đích G tại (8,6) ngoài lưới bên phải. Hai ô A=(1,1) và B=(5,3) được gạch chéo. Cả hai có mã bốn ô kề (1,0,0,1) theo thứ tự Bắc, Đông, Nam, Tây, với 1 là bước giữ tác tử đứng yên và 0 là bước đưa tác tử sang ô khác. Đường tới đích cần Đông tại A và Nam tại B. Nếu chọn Nam tại A, tác tử về (1,2) rồi bị đưa lại A; nếu chọn Đông tại B, tác tử sang (6,3) rồi bị đưa lại B.</desc>
