<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Phần thưởng trễ trên một quỹ đạo</title><desc id="desc">Hai hành động đầu chưa có phần thưởng; hành động cuối có phần thưởng dương, nên kết quả cuối liên quan tới cả chuỗi.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><path d="M120 155H880" stroke="#2F3E7A" stroke-width="6" marker-end="url(#a)"/><g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"><circle cx="130" cy="155" r="38"/><circle cx="350" cy="155" r="38"/><circle cx="570" cy="155" r="38"/><circle cx="790" cy="155" r="38"/></g><path d="M790 117L812 145L848 100L878 126L790 117" fill="#2E7D32"/><text x="130" y="165" font-size="30">S₀</text><text x="350" y="165" font-size="30">S₁</text><text x="570" y="165" font-size="30">S₂</text><text x="790" y="165" font-size="30">S₃</text><text x="240" y="115" font-size="30">A₀, R₁=0</text><text x="460" y="115" font-size="30">A₁, R₂=0</text><text x="680" y="115" font-size="30">A₂, R₃=+1</text><path d="M680 235Q460 300 240 235" fill="none" stroke="#B15A2B" stroke-width="5"/><text x="460" y="295" font-size="30" fill="#B15A2B">Gán kết quả cho chuỗi hành động</text></g>
</svg>
