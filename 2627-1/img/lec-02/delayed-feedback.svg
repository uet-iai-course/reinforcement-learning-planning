<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Phần thưởng trễ trên một quỹ đạo</title>
  <desc id="desc">Ba mũi tên riêng nối lần lượt S0 tới S1, S1 tới S2 và S2 tới trạng thái kết thúc S3. Hai chuyển tiếp đầu nhận thưởng 0; chuyển tiếp cuối nhận thưởng +1. Kết quả cuối liên quan tới cả chuỗi hành động.</desc>
  <defs>
    <marker id="transition-arrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="18" refX="18" refY="9" orient="auto" viewBox="0 0 20 18">
      <path d="M0 0 L18 9 L0 18 Z" fill="#2F3E7A"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#transition-arrow)">
      <path d="M192 155 H336"/>
      <path d="M422 155 H566"/>
      <path d="M652 155 H796"/>
    </g>
    <g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4">
      <circle cx="150" cy="155" r="38"/>
      <circle cx="380" cy="155" r="38"/>
      <circle cx="610" cy="155" r="38"/>
      <circle cx="840" cy="155" r="38"/>
    </g>
    <circle cx="840" cy="155" r="30" fill="none" stroke="#2F3E7A" stroke-width="2"/>
    <g fill="#202838" font-size="30">
      <text x="150" y="165">S₀</text>
      <text x="380" y="165">S₁</text>
      <text x="610" y="165">S₂</text>
      <text x="840" y="165">S₃</text>
      <text x="265" y="110">A₀, R₁=0</text>
      <text x="495" y="110">A₁, R₂=0</text>
      <text x="725" y="110">A₂, R₃=+1</text>
    </g>
    <text x="840" y="224" font-size="27" fill="#2F3E7A">Kết thúc</text>
    <path d="M210 228 V246 H780 V228" fill="none" stroke="#B15A2B" stroke-width="3"/>
    <text x="495" y="297" font-size="30" fill="#B15A2B">Kết quả cuối liên quan tới cả chuỗi</text>
  </g>
</svg>
