<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
  <title id="title">Ba dạng tín hiệu học</title><desc id="desc">Học có giám sát nhận nhãn trực tiếp; học không giám sát dùng cấu trúc dữ liệu; Học tăng cường nhận phần thưởng từ tương tác theo thời gian.</desc>
  <g font-family="sans-serif" text-anchor="middle"><rect x="30" y="45" width="310" height="260" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="185" y="95" font-size="30" font-weight="bold">Có giám sát</text><text x="185" y="165" font-size="30">mẫu + nhãn</text><path d="M95 210H275" stroke="#2F3E7A" stroke-width="6"/><text x="185" y="265" font-size="30">tín hiệu trực tiếp</text><rect x="370" y="45" width="310" height="260" rx="18" fill="#F3F3F3" stroke="#666" stroke-width="5"/><text x="525" y="95" font-size="30" font-weight="bold">Không giám sát</text><circle cx="460" cy="190" r="14" fill="#2F3E7A"/><circle cx="500" cy="220" r="14" fill="#2F3E7A"/><circle cx="585" cy="175" r="14" fill="#B15A2B"/><circle cx="620" cy="220" r="14" fill="#B15A2B"/><text x="525" y="265" font-size="30">cấu trúc dữ liệu</text><rect x="710" y="45" width="310" height="260" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="865" y="95" font-size="30" font-weight="bold">Học tăng cường</text><path d="M760 195H965" stroke="#B15A2B" stroke-width="6"/><circle cx="775" cy="195" r="14" fill="#2F3E7A"/><circle cx="865" cy="195" r="14" fill="#2F3E7A"/><circle cx="950" cy="195" r="20" fill="#B15A2B"/><text x="865" y="265" font-size="30">tương tác + thưởng trễ</text></g>
</svg>
