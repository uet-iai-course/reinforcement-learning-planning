<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" role="img" aria-labelledby="title desc"><title id="title">Tổng thưởng theo chi phí mỗi bước</title><desc id="desc">Đường đến đích có tổng 10 trừ 6 alpha, đường tới hố có tổng âm 2 alpha. Hai đường giao tại alpha bằng 2,5, tổng thưởng âm 5. Bên trái giao điểm chọn đích, bên phải chọn hố.</desc><rect width="1060" height="470" fill="white"/><g font-family="Arial,sans-serif" fill="#26354a"><rect x="95" y="65" width="512.5" height="336" fill="#eef1f8"/><rect x="607.5" y="65" width="307.5" height="336" fill="#fff1e8"/><path d="M95 389 H915" stroke="#d5dae1"/><text x="82" y="396" text-anchor="end" font-size="22">-15</text><path d="M95 329 H915" stroke="#d5dae1"/><text x="82" y="336" text-anchor="end" font-size="22">-10</text><path d="M95 269 H915" stroke="#d5dae1"/><text x="82" y="276" text-anchor="end" font-size="22">-5</text><path d="M95 209 H915" stroke="#d5dae1"/><text x="82" y="216" text-anchor="end" font-size="22">0</text><path d="M95 149 H915" stroke="#d5dae1"/><text x="82" y="156" text-anchor="end" font-size="22">5</text><path d="M95 89 H915" stroke="#d5dae1"/><text x="82" y="96" text-anchor="end" font-size="22">10</text><path d="M95 401 v7" stroke="#26354a"/><text x="95" y="436" text-anchor="middle" font-size="24">0</text><path d="M300 401 v7" stroke="#26354a"/><text x="300" y="436" text-anchor="middle" font-size="24">1</text><path d="M505 401 v7" stroke="#26354a"/><text x="505" y="436" text-anchor="middle" font-size="24">2</text><path d="M607.5 401 v7" stroke="#26354a"/><text x="607.5" y="436" text-anchor="middle" font-size="24">2,5</text><path d="M710 401 v7" stroke="#26354a"/><text x="710" y="436" text-anchor="middle" font-size="24">3</text><path d="M915 401 v7" stroke="#26354a"/><text x="915" y="436" text-anchor="middle" font-size="24">4</text><path d="M95 55 V401 H930" stroke="#26354a" stroke-width="2" fill="none"/><text x="22" y="32" font-size="24">Tổng thưởng G₀</text><text x="945" y="435" font-size="26">α</text><text x="325" y="37" text-anchor="middle" font-size="24">Chọn đích</text><text x="770" y="37" text-anchor="middle" font-size="24">Chọn hố</text><path d="M95 89 L915 377" stroke="#334879" stroke-width="5" fill="none"/><path d="M95 209 L915 305" stroke="#b85424" stroke-width="5" stroke-dasharray="13 7" fill="none"/><path d="M607.5 269 V401" stroke="#555" stroke-dasharray="4 5"/><circle cx="607.5" cy="269" r="7" fill="#26354a"/><text x="180" y="110" font-size="24" fill="#334879">Đích: 10 − 6α</text><text x="680" y="244" font-size="24" fill="#a0441c">Hố: −2α</text><text x="455" y="300" font-size="23">Ngang nhau</text></g></svg>