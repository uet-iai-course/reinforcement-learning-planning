<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc"><title id="title">Bàn cờ kết thúc với X thắng</title><desc id="desc">Hàng trên X O O, hàng giữa O X X, hàng dưới hai ô trống và X; X chiếm đường chéo chính.</desc><g stroke="#2F3E7A" stroke-width="4"><path d="M140 40V360M250 40V360M30 145H360M30 255H360"/></g><g font-family="Arial,sans-serif" font-size="64" text-anchor="middle" fill="#202838"><text x="85" y="115">X</text><text x="195" y="115">O</text><text x="305" y="115">O</text><text x="85" y="225">O</text><text x="195" y="225">X</text><text x="305" y="225">X</text><text x="305" y="335">X</text></g><path d="M45 50L345 350" stroke="#B15A2B" stroke-width="5" stroke-dasharray="10 8"/><text x="200" y="390" font-family="Arial,sans-serif" font-size="26" text-anchor="middle" fill="#2F3E7A">X thắng theo đường chéo</text></svg>