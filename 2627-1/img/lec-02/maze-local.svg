<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" role="img" aria-labelledby="title desc"><title id="title">Hai vị trí có cùng quan sát cục bộ</title><desc id="desc">Tại (2,1) và (3,1), ô phía Bắc và Nam là tường, ô phía Đông và Tây đi được. Cảm biến bốn ô kề không phân biệt hai vị trí.</desc><g font-family="Arial,sans-serif" text-anchor="middle">
<text x="225" y="30" font-size="28" fill="#2F3E7A">Vị trí (2,1)</text>
<rect x="200" y="58" width="50" height="50" fill="#293247" stroke="#88919e"/>
<rect x="150" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="200" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="250" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="200" y="158" width="50" height="50" fill="#293247" stroke="#88919e"/>
<text x="225" y="143" font-size="30" fill="#B15A2B">●</text>
<text x="225" y="250" font-size="25" fill="#202838">Bắc, Nam: tường</text>
<text x="225" y="284" font-size="25" fill="#202838">Đông, Tây: ô trống</text>
<text x="665" y="30" font-size="28" fill="#2F3E7A">Vị trí (3,1)</text>
<rect x="640" y="58" width="50" height="50" fill="#293247" stroke="#88919e"/>
<rect x="590" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="640" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="690" y="108" width="50" height="50" fill="#fff" stroke="#88919e"/>
<rect x="640" y="158" width="50" height="50" fill="#293247" stroke="#88919e"/>
<text x="665" y="143" font-size="30" fill="#B15A2B">●</text>
<text x="665" y="250" font-size="25" fill="#202838">Bắc, Nam: tường</text>
<text x="665" y="284" font-size="25" fill="#202838">Đông, Tây: ô trống</text>
</g></svg>