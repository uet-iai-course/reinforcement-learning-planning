<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Trạng thái, quan sát và biểu diễn nội bộ</title><desc id="desc">Môi trường có trạng thái S t; cảm biến sinh quan sát O t; tác tử biến quan sát hoặc lịch sử thành biểu diễn X t để chọn hành động.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><rect x="35" y="100" width="240" height="145" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="155" y="155" font-size="30" font-weight="bold">Môi trường</text><text x="155" y="205" font-size="30">trạng thái Sₜ</text><rect x="380" y="100" width="240" height="145" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="500" y="155" font-size="30" font-weight="bold">Cảm biến</text><text x="500" y="205" font-size="30">quan sát Oₜ</text><rect x="725" y="100" width="240" height="145" rx="18" fill="#F3F3F3" stroke="#666" stroke-width="5"/><text x="845" y="155" font-size="30" font-weight="bold">Tác tử</text><text x="845" y="205" font-size="30">biểu diễn Xₜ</text><path d="M275 172H370" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><path d="M620 172H715" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="500" y="305" font-size="30">Sₜ, Oₜ và Xₜ không mặc nhiên đồng nhất</text></g>
</svg>
