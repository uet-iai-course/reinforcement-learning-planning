<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
  <title id="title">Quan sát đầy đủ và quan sát một phần</title><desc id="desc">Bên trái tác tử nhận đủ trạng thái; bên phải tác tử chỉ nhận một cửa sổ quan sát nên hai trạng thái khác nhau có thể cho cùng quan sát.</desc>
  <g font-family="sans-serif" text-anchor="middle"><text x="260" y="45" font-size="30" font-weight="bold">Quan sát đầy đủ</text><rect x="50" y="75" width="420" height="220" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><g fill="#2F3E7A"><circle cx="150" cy="145" r="24"/><circle cx="265" cy="205" r="24"/><circle cx="375" cy="135" r="24"/></g><rect x="85" y="105" width="350" height="150" fill="none" stroke="#B15A2B" stroke-width="6"/><text x="260" y="335" font-size="30">Oₜ xác định được trạng thái Markov</text><text x="785" y="45" font-size="30" font-weight="bold">Quan sát một phần</text><rect x="575" y="75" width="420" height="220" rx="18" fill="#F3F3F3" stroke="#666" stroke-width="5"/><g fill="#2F3E7A"><circle cx="655" cy="145" r="24"/><circle cx="790" cy="205" r="24"/><circle cx="920" cy="135" r="24"/></g><rect x="720" y="145" width="140" height="120" fill="#F7EFE6" fill-opacity=".9" stroke="#B15A2B" stroke-width="6"/><text x="785" y="335" font-size="30">Nhiều Sₜ có thể sinh cùng Oₜ</text></g>
</svg>
