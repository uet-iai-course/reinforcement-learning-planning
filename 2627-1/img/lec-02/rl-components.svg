<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
  <title id="title">Ba vai trò trong một tác tử Học tăng cường</title><desc id="desc">Chính sách chọn hành động; hàm giá trị đánh giá tương lai; mô hình tùy chọn dự báo chuyển tiếp và phần thưởng.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><rect x="55" y="65" width="280" height="220" rx="20" fill="#F7EFE6" stroke="#B15A2B" stroke-width="6"/><text x="195" y="125" font-size="32" font-weight="bold">Chính sách π</text><text x="195" y="185" font-size="30">chọn hành động</text><text x="195" y="230" font-size="30">a hoặc phân phối trên a</text><rect x="385" y="65" width="280" height="220" rx="20" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="6"/><text x="525" y="125" font-size="32" font-weight="bold">Hàm giá trị</text><text x="525" y="185" font-size="30">đánh giá tương lai</text><text x="525" y="230" font-size="30">v<tspan font-size="20" dy="8">π</tspan><tspan dy="-8">(s)</tspan></text><rect x="715" y="65" width="280" height="220" rx="20" fill="#F3F3F3" stroke="#666" stroke-width="6" stroke-dasharray="14 9"/><text x="855" y="125" font-size="32" font-weight="bold">Mô hình</text><text x="855" y="185" font-size="30">dự báo môi trường</text><text x="855" y="230" font-size="30">thành phần tùy chọn</text><path d="M335 175H375" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><path d="M665 175H705" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/></g>
</svg>
