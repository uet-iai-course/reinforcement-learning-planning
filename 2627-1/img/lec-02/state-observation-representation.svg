<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Từ trạng thái đến quan sát đến biểu diễn</title>
  <desc id="svg-desc">Sơ đồ minh họa dòng thông tin: trạng thái là mê cung cố định với tọa độ (2,1); cảm biến chỉ nhìn thấy bốn ô kề; biểu diễn mã hóa tường/ô trống (tường, ô trống, tường, ô trống) để chọn hành động. Biểu diễn này không xác định được tọa độ thật của tác tử.</desc>
