<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Phân biệt dự đoán và điều khiển</title><desc id="desc">Dự đoán giữ chính sách pi cố định để ước lượng giá trị; điều khiển thay đổi chính sách nhằm tăng giá trị.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><rect x="45" y="60" width="410" height="220" rx="20" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="6"/><text x="250" y="115" font-size="34" font-weight="bold">Dự đoán</text><text x="250" y="170" font-size="30">giữ π cố định</text><path d="M145 225H355" stroke="#2F3E7A" stroke-width="6" marker-end="url(#a)"/><text x="250" y="260" font-size="30">π → vᵖⁱ</text><rect x="545" y="60" width="410" height="220" rx="20" fill="#F7EFE6" stroke="#B15A2B" stroke-width="6"/><text x="750" y="115" font-size="34" font-weight="bold">Điều khiển</text><text x="750" y="170" font-size="30">cải thiện π</text><path d="M650 225H850" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="750" y="260" font-size="30">π → π′ tốt hơn</text></g>
</svg>
