<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 18 690 520" role="img" aria-labelledby="title desc">
<title id="title">Hai ô có cùng mã bốn ô kề nhưng cần hai hướng khác nhau (bản cho trang chiếu)</title>
<desc id="desc">Mê cung tám hàng tám cột, bắt đầu tại (0,2), đích G ngoài lưới bên phải ô (7,6). Hai ô A bằng (1,1) và B bằng (5,3) được gạch chéo; cả hai có mã bốn ô kề (1,0,0,1). Mũi tên liền tại A chỉ Đông, tại B chỉ Nam: hướng cần chọn để tới đích. Mũi tên đứt hai chiều giữa A và ô (1,2), giữa B và ô (6,3): vòng lặp nếu chọn hướng kia. Chú giải nằm trên mặt trang chiếu.</desc>
