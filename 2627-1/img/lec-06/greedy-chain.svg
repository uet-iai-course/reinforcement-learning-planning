<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="265" viewBox="0 0 1120 265" role="img" aria-labelledby="title desc">
<title id="title">Chính sách tham lam của bảng I</title><desc id="desc">B chọn hành động 1 tới C; C chọn hành động 0 tới B, cả hai nhận −1. D chọn hành động 1 tới E, nhận 10 và kết thúc. A không được đạt tới từ D dưới chính sách này.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><circle cx="100" cy="130" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><circle cx="100" cy="130" r="27" fill="none" stroke="#2F3E7A" stroke-width="2"/><text x="100" y="141" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">A</text><circle cx="330" cy="130" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="330" y="141" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">B</text><circle cx="560" cy="130" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="560" y="141" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">C</text><circle cx="790" cy="130" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="790" y="141" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">D</text><circle cx="1020" cy="130" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><circle cx="1020" cy="130" r="27" fill="none" stroke="#2F3E7A" stroke-width="2"/><text x="1020" y="141" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">E</text><path d="M 351 101 Q 445 20 537 101" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="445" y="44" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">1 · −1</text><path d="M 539 159 Q 445 241 353 159" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="445" y="240" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">0 · −1</text><path d="M 826 130 L 982 130" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="905" y="107" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">1 · 10</text><text x="790" y="201" text-anchor="middle" font-size="26" fill="#B15A2B" font-weight="normal">bắt đầu tại D</text><text x="100" y="195" text-anchor="middle" font-size="24" fill="#28313D" font-weight="normal">kết thúc</text><text x="1020" y="195" text-anchor="middle" font-size="24" fill="#28313D" font-weight="normal">kết thúc</text></g></svg>