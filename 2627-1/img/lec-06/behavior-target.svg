<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="345" viewBox="0 0 1120 345" role="img" aria-labelledby="title desc">
<title id="title">Hành vi sinh dữ liệu và đích cập nhật</title><desc id="desc">Chính sách hành vi b chọn hành động trong môi trường và tạo mẫu chuyển. Mẫu chuyển cùng bảng Q xác định mục tiêu cực đại; mục tiêu cập nhật Q. Hành vi có thể dựa trên bảng Q nhưng hành động thực hiện vẫn do b chọn. Nét liền là đường dữ liệu; nét đứt là đường tạo mục tiêu và cập nhật bảng.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="25" y="22" width="200" height="75" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="125.0" y="69.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Hành vi b</text><rect x="280" y="22" width="225" height="75" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="392.5" y="69.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Hành động</text><rect x="560" y="22" width="235" height="75" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="677.5" y="69.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Môi trường</text><rect x="850" y="22" width="240" height="75" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="970.0" y="69.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Mẫu chuyển</text><path d="M 227 60 L 272 60" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 507 60 L 552 60" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 797 60 L 842 60" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><rect x="425" y="207" width="210" height="80" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="530.0" y="257.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Bảng Q</text><rect x="840" y="207" width="250" height="80" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="965.0" y="239.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Mục tiêu</text><text x="965.0" y="275.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">cực đại</text><path d="M 970 99 L 970 201" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 837 263 L 642 263" fill="none" stroke="#B15A2B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-o)"/><path d="M 635 227 Q 745 132 880 201" fill="none" stroke="#B15A2B" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow-o)"/><text x="740" y="151" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">đích tham lam</text><path d="M 445 205 L 445 156 L 127 156 L 127 103" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="283" y="135" text-anchor="middle" font-size="25" fill="#28313D" font-weight="normal">hành vi có thể dùng Q</text><text x="554" y="328" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">Nét liền: sinh dữ liệu. Nét đứt: tạo mục tiêu và cập nhật bảng.</text></g></svg>