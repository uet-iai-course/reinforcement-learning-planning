<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="265" viewBox="0 0 1120 265" role="img" aria-labelledby="title desc">
<title id="title">Vòng dữ liệu và chính sách</title><desc id="desc">Tương tác tạo dữ liệu. Dữ liệu cập nhật bảng Q. Bảng Q xác định chính sách. Chính sách chọn hành động cho tương tác tiếp. Không có điểm đích hoặc đường hội tụ được giả định.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><rect x="30" y="52" width="225" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="142.5" y="110.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Tương tác</text><rect x="310" y="52" width="225" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="422.5" y="110.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Dữ liệu</text><rect x="590" y="52" width="225" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="702.5" y="110.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Cập nhật Q</text><rect x="870" y="52" width="225" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="982.5" y="110.0" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Chính sách</text><path d="M 256 100 L 303 100" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 536 100 L 583 100" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 816 100 L 863 100" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><path d="M 982 150 L 982 227 L 142 227 L 142 154" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="560" y="211" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">chọn hành động cho tương tác tiếp</text></g></svg>