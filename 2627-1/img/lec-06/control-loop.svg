<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
  <title id="title">Vòng lặp đánh giá và cải thiện chính sách</title>
  <desc id="desc">Chính sách sinh trải nghiệm, trải nghiệm cập nhật bảng Q, và bảng Q cải thiện lại chính sách.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#B15A2B"/></marker></defs>
  <rect x="55" y="105" width="250" height="115" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/>
  <rect x="375" y="105" width="250" height="115" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
  <rect x="695" y="105" width="250" height="115" rx="18" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/>
  <text x="180" y="155" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#2F3E7A">Chính sách π</text>
  <text x="180" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#263238">chọn hành động</text>
  <text x="500" y="155" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#8A421F">Trải nghiệm</text>
  <text x="500" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#263238">S, A, R, S′</text>
  <text x="820" y="155" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="700" fill="#2E7D32">Bảng Q</text>
  <text x="820" y="195" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#263238">đánh giá hành động</text>
  <path d="M305 162H365" stroke="#B15A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M625 162H685" stroke="#B15A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <path d="M820 230C820 300 180 300 180 230" fill="none" stroke="#B15A2B" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="500" y="322" text-anchor="middle" font-family="sans-serif" font-size="30" fill="#263238">cải thiện chính sách theo Q</text>
</svg>
