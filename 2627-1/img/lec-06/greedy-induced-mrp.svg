<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 310" role="img" aria-labelledby="title desc">
  <title id="title">Quan hệ chuyển tham lam theo bảng Q ban đầu</title>
  <desc id="desc">Theo bảng Q thống nhất, chính sách tham lam đi từ D sang C, từ C sang B, còn từ B sang C. Sơ đồ biểu diễn quan hệ chuyển tham lam khi bỏ bộ đếm giới hạn thời gian của nguồn; lượt dùng trong deck kết thúc ở A sau đúng ba chuyển, còn nguồn ghi môi trường tối đa 3 bước nhưng không nêu quy ước return khi cắt sớm.</desc>
  <defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#B15A2B"/></marker></defs>
  <g font-family="sans-serif" text-anchor="middle"><circle cx="160" cy="150" r="58" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="160" y="162" font-size="40" font-weight="700">A</text><circle cx="395" cy="150" r="58" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="395" y="162" font-size="40" font-weight="700">B</text><circle cx="650" cy="150" r="58" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="650" y="162" font-size="40" font-weight="700">C</text><circle cx="890" cy="150" r="58" fill="#E8F5E9" stroke="#2E7D32" stroke-width="4"/><text x="890" y="162" font-size="40" font-weight="700">D</text><text x="525" y="292" font-size="30">Tham lam: D→C, C→B, B→C</text></g>
  <g stroke="#B15A2B" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M830 150H720"/><path d="M590 130C535 90 490 90 452 125"/><path d="M453 175C510 220 560 220 594 178"/></g>
</svg>
