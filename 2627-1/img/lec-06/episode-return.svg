30 125 L 130 141" fill="none" stroke="#B15A2B" stroke-width="3"/><path d="M 970 125 L 970 141" fill="none" stroke="#B15A2B" stroke-width="3"/><text x="550.0" y="165" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">lợi tức 998</text><path d="M 410 173 L 970 173" fill="none" stroke="#B15A2B" stroke-width="3"/><path d="M 410 165 L 410 181" fill="none" stroke="#B15A2B" stroke-width="3"/><path d="M 970 165 L 970 181" fill="none" stroke="#B15A2B" stroke-width="3"/><text x="690.0" y="205" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">lợi tức 999</text><path d="M 690 213 L 970 213" fill="none" stroke="#B15A2B" stroke-width="3"/><path d="M 690 205 L 690 221" fill="none" stroke="#B15A2B" stroke-width="3"/><path d="M 970 205 L 970 221" fill="none" stroke="#B15A2B" stroke-width="3"/><text x="830.0" y="245" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">lợi tức 1000</text></g></svg>