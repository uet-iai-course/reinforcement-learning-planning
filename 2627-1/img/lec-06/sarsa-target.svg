<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="285" viewBox="0 0 1080 285" role="img" aria-labelledby="title desc">
<title id="title">Giá trị tiếp nối của Sarsa</title><desc id="desc">Từ C, hành động 0 nhận thưởng −1 và tới B. Tại B, hành động 0 đã lấy mẫu có giá trị 0; hành động 1 có giá trị 1 và là cực đại. Sarsa dùng giá trị 0 của hành động đã lấy mẫu; nhánh còn lại dùng nét đứt.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><circle cx="100" cy="125" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="100" y="136" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">C</text><circle cx="420" cy="125" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="420" y="136" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">B</text><path d="M 138 125 L 380 125" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="257" y="90" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">0; thưởng −1</text><rect x="730" y="15" width="320" height="85" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="890.0" y="49.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Hành động 0</text><text x="890.0" y="85.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">giá trị 0</text><rect x="730" y="150" width="320" height="85" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="890.0" y="184.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">Hành động 1</text><text x="890.0" y="220.5" text-anchor="middle" font-size="28" fill="#28313D" font-weight="normal">giá trị 1</text><path d="M 451 107 L 723 60" fill="none" stroke="#2F3E7A" stroke-width="5" marker-end="url(#arrow)"/><path d="M 451 143 L 723 193" fill="none" stroke="#B15A2B" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow-o)"/><text x="590" y="45" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">đã lấy mẫu</text><text x="590" y="222" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">cực đại</text><text x="380" y="269" text-anchor="middle" font-size="27" fill="#28313D" font-weight="normal">Nét liền đậm: giá trị dùng trong mục tiêu</text></g></svg>