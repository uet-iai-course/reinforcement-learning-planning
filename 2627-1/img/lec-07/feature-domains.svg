<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 200" role="img" aria-labelledby="title desc"><title id="title">Đặc trưng trong ba miền</title><desc id="desc">Ba ô ví dụ. CartPole: vị trí, vận tốc của xe; góc, vận tốc góc của cột. Lunar Lander: vị trí, vận tốc, góc của tàu đổ bộ. Cờ vua: quân trên bàn, lượt đi, cấu trúc bàn cờ.</desc><g font-family="serif" fill="#263238"><g transform="translate(10 5)"><rect width="355" height="190" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="177" y="42" text-anchor="middle" font-size="34" font-weight="700" fill="#2F3E7A">CartPole</text><line x1="18" y1="160" x2="130" y2="160" stroke="#263238" stroke-width="5"/><rect x="45" y="135" width="55" height="25" fill="#fff" stroke="#263238" stroke-width="3"/><line x1="72" y1="135" x2="95" y2="70" stroke="#B15A2B" stroke-width="6"/><text x="245" y="96" text-anchor="middle" font-size="30">vị trí, vận</text><text x="245" y="130" text-anchor="middle" font-size="30">tốc xe; góc,</text><text x="245" y="164" text-anchor="middle" font-size="30">vận tốc góc</text></g><g transform="translate(382 5)"><rect width="355" height="190" rx="16" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="177" y="42" text-anchor="middle" font-size="34" font-weight="700" fill="#2F3E7A">Lunar Lander</text><path d="M45 75 L95 75 L110 130 L30 130 Z" fill="#fff" stroke="#263238" stroke-width="3"/><path d="M33 133 L18 165 M107 133 L122 165" stroke="#263238" stroke-width="4"/><text x="245" y="108" text-anchor="middle" font-size="30">vị trí, vận tốc,</text><text x="245" y="142" text-anchor="middle" font-size="30">góc</text></g><g transform="translate(755 5)"><rect width="355" height="190" rx="16" fill="#F4F7F4" stroke="#2E7D32" stroke-width="4"/><text x="177" y="42" text-anchor="middle" font-size="34" font-weight="700" fill="#2F3E7A">Cờ vua</text><g transform="translate(25 65)"><rect width="100" height="100" fill="#fff" stroke="#263238" stroke-width="3"/><path d="M0 25H100M0 50H100M0 75H100M25 0V100M50 0V100M75 0V100" stroke="#999" stroke-width="2"/><circle cx="37" cy="37" r="9" fill="#B15A2B"/><circle cx="63" cy="63" r="9" fill="#2F3E7A"/></g><text x="245" y="108" text-anchor="middle" font-size="30">quân, lượt,</text><text x="245" y="142" text-anchor="middle" font-size="30">cấu trúc bàn</text></g></g></svg>
