<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="title desc"><title id="title">Đặc trưng trong ba miền</title><desc id="desc">Ba sơ đồ biểu diễn CartPole, Lunar Lander và cờ vua bằng các đại lượng trạng thái có ý nghĩa.</desc><g font-size="30" fill="#263238"><g transform="translate(25 40)"><rect width="330" height="300" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="165" y="48" text-anchor="middle" font-weight="700" fill="#2F3E7A">CartPole</text><line x1="70" y1="205" x2="265" y2="205" stroke="#263238" stroke-width="6"/><rect x="125" y="175" width="90" height="40" fill="#fff" stroke="#263238" stroke-width="4"/><line x1="170" y1="175" x2="205" y2="85" stroke="#B15A2B" stroke-width="8"/><text x="165" y="260" text-anchor="middle">x, ẋ, θ, θ̇</text></g><g transform="translate(395 40)"><rect width="330" height="300" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="165" y="48" text-anchor="middle" font-weight="700" fill="#2F3E7A">Lunar Lander</text><path d="M125 100 L205 100 L230 180 L100 180 Z" fill="#fff" stroke="#263238" stroke-width="4"/><path d="M105 185 L75 225 M225 185 L255 225" stroke="#263238" stroke-width="5"/><text x="165" y="260" text-anchor="middle">vị trí, vận tốc, góc</text></g><g transform="translate(765 40)"><rect width="330" height="300" rx="18" fill="#F4F7F4" stroke="#2E7D32" stroke-width="5"/><text x="165" y="48" text-anchor="middle" font-weight="700" fill="#2F3E7A">Cờ vua</text><g transform="translate(95 75)"><rect width="140" height="140" fill="#fff" stroke="#263238" stroke-width="4"/><path d="M0 35H140M0 70H140M0 105H140M35 0V140M70 0V140M105 0V140" stroke="#999" stroke-width="2"/><circle cx="52" cy="52" r="13" fill="#B15A2B"/><circle cx="88" cy="88" r="13" fill="#2F3E7A"/></g><text x="165" y="260" text-anchor="middle">quân, lượt, cấu trúc</text></g></g></svg>
