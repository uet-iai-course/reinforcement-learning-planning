<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="title desc"><title id="title">Đường đi của xấp xỉ tuyến tính</title><desc id="desc">Trạng thái được ánh xạ thành vector đặc trưng, nhân vô hướng với trọng số để tạo dự đoán giá trị.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"><rect x="35" y="90" width="190" height="110" rx="18"/><rect x="330" y="65" width="235" height="160" rx="18"/><rect x="675" y="65" width="210" height="160" rx="18"/><rect x="985" y="90" width="100" height="110" rx="18"/></g><text x="130" y="155" text-anchor="middle" font-size="38" font-weight="700">s</text><text x="447" y="135" text-anchor="middle" font-size="34" font-weight="700">x(s) ∈ ℝᵈ</text><text x="447" y="185" text-anchor="middle" font-size="30">đặc trưng</text><text x="780" y="135" text-anchor="middle" font-size="34" font-weight="700">x(s)ᵀw</text><text x="780" y="185" text-anchor="middle" font-size="30">tích vô hướng</text><text x="1035" y="157" text-anchor="middle" font-size="38" font-weight="700">v̂</text><g stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><path d="M230 145 H315"/><path d="M570 145 H660"/><path d="M890 145 H970"/></g></svg>
