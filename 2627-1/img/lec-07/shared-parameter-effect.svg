<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Hiệu ứng chia sẻ tham số</title><desc id="desc">Một cập nhật tại trạng thái mẫu làm thay đổi dự đoán của các trạng thái có đặc trưng tương tự thông qua vector trọng số dùng chung.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><circle cx="180" cy="180" r="72" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="180" y="173" text-anchor="middle" font-size="32" font-weight="700">mẫu tại sₜ</text><text x="180" y="212" text-anchor="middle" font-size="30">cập nhật</text><path d="M255 180 H450" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><rect x="470" y="105" width="170" height="150" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="555" y="168" text-anchor="middle" font-size="34" font-weight="700">w</text><text x="555" y="212" text-anchor="middle" font-size="30">dùng chung</text><path d="M645 160 C760 110 800 90 900 85" fill="none" stroke="#2F3E7A" stroke-width="5" marker-end="url(#a)"/><path d="M645 180 H900" stroke="#2F3E7A" stroke-width="5" marker-end="url(#a)"/><path d="M645 200 C760 250 800 270 900 275" fill="none" stroke="#2F3E7A" stroke-width="5" marker-end="url(#a)"/><g fill="#fff" stroke="#2F3E7A" stroke-width="4"><circle cx="965" cy="80" r="50"/><circle cx="965" cy="180" r="50"/><circle cx="965" cy="280" r="50"/></g><text x="965" y="91" text-anchor="middle" font-size="30">s₁</text><text x="965" y="191" text-anchor="middle" font-size="30">s₂</text><text x="965" y="291" text-anchor="middle" font-size="30">s₃</text></svg>
