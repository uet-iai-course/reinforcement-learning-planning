<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" role="img" aria-labelledby="title desc"><title id="title">Một cập nhật thay đổi hai dự đoán</title><desc id="desc">Một mẫu tại trạng thái s với sai số e bằng 2 tạo độ đổi tham số Δw bằng αe x(s). Vì w dùng chung, dự đoán tại s tăng 0,4 và dự đoán tại s′ tăng 0,3.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2F3E7A"/></marker></defs><rect x="150" y="8" width="260" height="78" rx="16" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="280" y="60" text-anchor="middle" font-size="36"><tspan font-weight="700">mẫu tại s</tspan>, e = 2</text><path d="M280 92 V160" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="300" y="138" font-size="32" fill="#B15A2B">Δw = αe x(s)</text><rect x="150" y="170" width="260" height="78" rx="16" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="280" y="222" text-anchor="middle" font-size="36"><tspan font-style="italic" font-weight="700">w</tspan> dùng chung</text><path d="M240 253 C200 280 160 290 145 302" fill="none" stroke="#2F3E7A" stroke-width="5" marker-end="url(#b)"/><path d="M320 253 C360 280 400 290 415 302" fill="none" stroke="#2F3E7A" stroke-width="5" marker-end="url(#b)"/><rect x="10" y="312" width="250" height="78" rx="14" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="135" y="364" text-anchor="middle" font-size="34">v̂(s): +0,4</text><rect x="300" y="312" width="250" height="78" rx="14" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="425" y="364" text-anchor="middle" font-size="34">v̂(s′): +0,3</text></svg>
