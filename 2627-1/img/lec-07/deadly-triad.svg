<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 900 520" role="img" aria-labelledby="title desc"><title id="title">Ba thành phần của bộ ba bất ổn</title><desc id="desc">Tam giác có ba đỉnh: xấp xỉ hàm ở trên, bootstrap ở dưới bên trái, học khác chính sách ở dưới bên phải. Ở giữa tam giác ghi: có thể phân kỳ, nghĩa là khi cả ba cùng có mặt, một số thuật toán TD có thể phân kỳ.</desc><g font-family="Arial, Helvetica, sans-serif"><path d="M450 60 L140 340 L760 340 Z" fill="#F7EFE6" stroke="#B15A2B" stroke-width="7"/><g fill="#fff" stroke="#2F3E7A" stroke-width="5"><circle cx="450" cy="60" r="112"/><circle cx="140" cy="340" r="112"/><circle cx="760" cy="340" r="112"/></g><g font-size="38" text-anchor="middle" fill="#263238" font-weight="700"><text x="450" y="52">xấp xỉ</text><text x="450" y="98">hàm</text><text x="140" y="353">bootstrap</text><text x="760" y="332">khác</text><text x="760" y="376">chính sách</text><text x="450" y="268" font-size="44" fill="#A33A1F">có thể</text><text x="450" y="318" font-size="44" fill="#A33A1F">phân kỳ</text></g></g></svg>
