<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc"><title id="title">Ba thành phần của deadly triad</title><desc id="desc">Tam giác gồm xấp xỉ hàm, bootstrap và học khác chính sách; sự kết hợp cả ba có thể làm một số thuật toán TD phân kỳ.</desc><path d="M450 55 L130 410 L770 410 Z" fill="#F7EFE6" stroke="#B15A2B" stroke-width="7"/><g fill="#fff" stroke="#2F3E7A" stroke-width="5"><circle cx="450" cy="90" r="78"/><circle cx="155" cy="385" r="78"/><circle cx="745" cy="385" r="78"/></g><g font-size="30" text-anchor="middle" fill="#263238"><text x="450" y="83" font-weight="700">xấp xỉ</text><text x="450" y="119" font-weight="700">hàm</text><text x="155" y="380" font-weight="700">bootstrap</text><text x="745" y="380" font-weight="700">khác</text><text x="745" y="416" font-weight="700">chính sách</text><text x="450" y="305" font-size="34" fill="#A33A1F" font-weight="700">có thể phân kỳ</text></g></svg>
