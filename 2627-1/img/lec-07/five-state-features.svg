<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" role="img" aria-labelledby="title desc"><title id="title">Chuỗi năm trạng thái và đặc trưng</title><desc id="desc">Chuỗi A đến E, D là điểm đầu, A và E kết thúc; hành động không đi trái, hành động một đi phải; B C D có khoảng cách trái lần lượt một hai ba.</desc><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker><marker id="al" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M10,0 L0,3 L10,6 Z" fill="#2F3E7A"/></marker></defs><g fill="none" stroke-width="5"><path d="M170 125 H290M370 125 H490M570 125 H690M770 125 H890" stroke="#B15A2B" marker-end="url(#ar)"/><path d="M170 165 H290M370 165 H490M570 165 H690M770 165 H890" stroke="#2F3E7A" marker-start="url(#al)"/></g><g font-size="34" text-anchor="middle"><g fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"><rect x="50" y="90" width="120" height="110" rx="16"/><rect x="890" y="90" width="120" height="110" rx="16"/></g><g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"><circle cx="330" cy="145" r="55"/><circle cx="530" cy="145" r="55"/><circle cx="730" cy="145" r="55"/></g><text x="110" y="155">A</text><text x="330" y="155">B</text><text x="530" y="155">C</text><text x="730" y="155">D</text><text x="950" y="155">E</text><text x="110" y="245" font-size="30">kết thúc</text><text x="330" y="245" font-size="30">d = 1</text><text x="530" y="245" font-size="30">d = 2</text><text x="730" y="245" font-size="30">d = 3</text><text x="950" y="245" font-size="30">kết thúc</text><text x="730" y="55" font-size="30" fill="#B15A2B">bắt đầu</text><text x="520" y="55" font-size="30" fill="#B15A2B">1: phải</text><text x="520" y="310" font-size="30" fill="#2F3E7A">0: trái</text></g></svg>
