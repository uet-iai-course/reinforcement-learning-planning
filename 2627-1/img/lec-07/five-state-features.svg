<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 305" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi năm trạng thái và khoảng cách tới tường trái</title><desc id="desc">Chuỗi A–B–C–D–E. D là trạng thái đầu. A và E có viền kép và là trạng thái kết thúc, không có cạnh đi ra. Hành động 0 đi trái, 1 đi phải. Thưởng vào A bằng 1000, vào E bằng 10, các chuyển khác bằng −1. Nhãn cạnh là hành động rồi phần thưởng. Khoảng cách tới tường trái d trái bằng 1, 2, 3 tại B, C, D.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker><marker id="arrow-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif"><circle cx="100" cy="135" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><circle cx="100" cy="135" r="27" fill="none" stroke="#2F3E7A" stroke-width="2"/><text x="100" y="146" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">A</text><circle cx="330" cy="135" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="330" y="146" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">B</text><circle cx="560" cy="135" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="560" y="146" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">C</text><circle cx="790" cy="135" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><text x="790" y="146" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">D</text><circle cx="1020" cy="135" r="34" fill="white" stroke="#2F3E7A" stroke-width="4"/><circle cx="1020" cy="135" r="27" fill="none" stroke="#2F3E7A" stroke-width="2"/><text x="1020" y="146" text-anchor="middle" font-size="34" fill="#28313D" font-weight="bold">E</text><path d="M 310 106 Q 215.0 22 123 106" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="215.0" y="49" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">0 · 1000</text><path d="M 540 106 Q 445.0 22 353 106" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="445.0" y="49" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">0 · −1</text><path d="M 770 106 Q 675.0 22 583 106" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"/><text x="675.0" y="49" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">0 · −1</text><path d="M 350 165 Q 445.0 253 537 166" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="445.0" y="252" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">1 · −1</text><path d="M 580 165 Q 675.0 253 767 166" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="675.0" y="252" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">1 · −1</text><path d="M 810 165 Q 905.0 253 997 166" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arrow-o)"/><text x="905.0" y="252" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">1 · 10</text><text x="100" y="201" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">kết thúc</text><text x="1020" y="85" text-anchor="middle" font-size="34" fill="#28313D" font-weight="normal">kết thúc</text><text x="830" y="70" text-anchor="middle" font-size="34" fill="#B15A2B" font-weight="bold">bắt đầu</text><text x="330" y="292" text-anchor="middle" font-size="34" fill="#2F3E7A" font-weight="bold">d<tspan font-size="24" dy="7">trái</tspan><tspan dy="-7"> = 1</tspan></text><text x="560" y="292" text-anchor="middle" font-size="34" fill="#2F3E7A" font-weight="bold">d<tspan font-size="24" dy="7">trái</tspan><tspan dy="-7"> = 2</tspan></text><text x="790" y="292" text-anchor="middle" font-size="34" fill="#2F3E7A" font-weight="bold">d<tspan font-size="24" dy="7">trái</tspan><tspan dy="-7"> = 3</tspan></text></g></svg>