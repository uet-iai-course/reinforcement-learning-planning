<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 370" role="img" aria-labelledby="title desc"><title id="title">Đích Monte Carlo và TD</title><desc id="desc">Monte Carlo chờ đến cuối lượt và cộng toàn bộ phần thưởng, còn TD dùng một phần thưởng cùng dự đoán ở trạng thái kế tiếp.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2F3E7A"/></marker></defs><g font-size="30"><text x="90" y="75" font-weight="700" fill="#B15A2B">MC</text><text x="90" y="255" font-weight="700" fill="#2F3E7A">TD(0)</text><g fill="#fff" stroke="#263238" stroke-width="4"><circle cx="230" cy="65" r="36"/><circle cx="430" cy="65" r="36"/><circle cx="630" cy="65" r="36"/><rect x="815" y="30" width="150" height="70" rx="10"/><circle cx="230" cy="245" r="36"/><circle cx="430" cy="245" r="36"/></g><g stroke="#2F3E7A" stroke-width="5" marker-end="url(#a)"><path d="M270 65 H385"/><path d="M470 65 H585"/><path d="M670 65 H800"/><path d="M270 245 H385"/></g><text x="230" y="76" text-anchor="middle">Sₜ</text><text x="430" y="76" text-anchor="middle">Sₜ₊₁</text><text x="630" y="76" text-anchor="middle">…</text><text x="890" y="76" text-anchor="middle">kết thúc</text><text x="330" y="50" text-anchor="middle">Rₜ₊₁</text><text x="530" y="50" text-anchor="middle">Rₜ₊₂</text><text x="730" y="50" text-anchor="middle">…</text><text x="230" y="256" text-anchor="middle">Sₜ</text><text x="430" y="256" text-anchor="middle">Sₜ₊₁</text><text x="330" y="230" text-anchor="middle">Rₜ₊₁</text><text x="600" y="256">+ γv̂(Sₜ₊₁,w)</text><text x="560" y="335" text-anchor="middle" fill="#263238">MC dùng Gₜ; TD dùng Rₜ₊₁ và một dự đoán bootstrap</text></g></svg>
