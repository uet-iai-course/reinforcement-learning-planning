<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc"><title id="title">Điểm cố định Bellman chiếu</title><desc id="desc">Giá trị xấp xỉ Phi w nằm trong không gian đặc trưng, toán tử Bellman đưa ra ngoài rồi phép chiếu theo D đưa trở lại không gian đó.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><path d="M120 320 L700 245 L950 330 L360 390 Z" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="520" y="350" text-anchor="middle" font-size="32" fill="#2F3E7A">không gian col(Φ)</text><circle cx="440" cy="275" r="14" fill="#2E7D32"/><text x="390" y="252" font-size="30">Φw</text><circle cx="680" cy="85" r="14" fill="#B15A2B"/><text x="705" y="92" font-size="30">Tπ(Φw)</text><path d="M455 265 C520 185 595 120 665 95" fill="none" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><path d="M680 105 C650 175 565 235 455 270" fill="none" stroke="#2F3E7A" stroke-width="6" stroke-dasharray="14 10" marker-end="url(#a)"/><text x="555" y="215" font-size="30" fill="#2F3E7A">Πᴰ</text></svg>
