<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 15 1100 360" role="img" aria-labelledby="title desc"><title id="title">Ảnh Bellman và phép chiếu lên lớp biểu diễn</title><desc id="desc">Mặt phẳng là lớp biểu diễn gồm các vector Phi w. Từ điểm Phi w trong lớp, toán tử Bellman T pi cho điểm T pi của Phi w nằm phía trên, ngoài lớp. Đường nét đứt vuông góc hạ từ điểm đó xuống lớp, cho hình chiếu Pi T pi của Phi w.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2F3E7A"/></marker></defs><g font-family="serif"><path d="M20 240 L700 165 L1080 265 L400 325 Z" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="550" y="362" text-anchor="middle" font-size="44" fill="#2F3E7A">lớp biểu diễn {Φw}</text><circle cx="330" cy="255" r="14" fill="#2E7D32"/><text x="350" y="302" font-size="44" font-weight="700">Φw</text><circle cx="720" cy="55" r="14" fill="#B15A2B"/><text x="748" y="70" font-size="44" font-weight="700">T<tspan font-size="30" dy="10">π</tspan><tspan dy="-10">(Φw)</tspan></text><path d="M340 243 C430 125 560 75 703 57" fill="none" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="445" y="100" font-size="44" fill="#B15A2B">T<tspan font-size="30" dy="10">π</tspan></text><path d="M720 72 L720 222" fill="none" stroke="#2F3E7A" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#b)"/><path d="M720 214 L738 214 L738 230" fill="none" stroke="#2F3E7A" stroke-width="3"/><circle cx="720" cy="235" r="14" fill="#2F3E7A"/><text x="700" y="274" text-anchor="end" font-size="44" font-weight="700">Π T<tspan font-size="30" dy="10">π</tspan><tspan dy="-10">(Φw)</tspan></text></g></svg>
