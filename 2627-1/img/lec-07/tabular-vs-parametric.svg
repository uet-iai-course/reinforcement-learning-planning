<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" role="img" aria-labelledby="title desc"><title id="title">Bảng tra và mô hình tham số</title><desc id="desc">Bảng tra giữ một ô riêng cho từng trạng thái, còn mô hình tham số biến trạng thái thành đặc trưng rồi dùng chung một vector trọng số.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><rect x="35" y="55" width="430" height="245" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="250" y="100" text-anchor="middle" font-size="34" font-weight="700" fill="#2F3E7A">Bảng tra</text><g fill="#fff" stroke="#2F3E7A" stroke-width="3"><rect x="90" y="130" width="90" height="55"/><rect x="180" y="130" width="90" height="55"/><rect x="270" y="130" width="90" height="55"/><rect x="90" y="185" width="90" height="55"/><rect x="180" y="185" width="90" height="55"/><rect x="270" y="185" width="90" height="55"/></g><text x="225" y="278" text-anchor="middle" font-size="30">một giá trị cho mỗi trạng thái</text><rect x="635" y="55" width="430" height="245" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="850" y="100" text-anchor="middle" font-size="34" font-weight="700" fill="#2F3E7A">Mô hình tham số</text><circle cx="700" cy="175" r="42" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="700" y="186" text-anchor="middle" font-size="32">s</text><path d="M745 175 H815" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="830" y="135" width="100" height="80" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="880" y="184" text-anchor="middle" font-size="30">x(s)</text><path d="M935 175 H995" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><text x="1015" y="184" text-anchor="middle" font-size="32">v̂</text><text x="850" y="272" text-anchor="middle" font-size="30">nhiều trạng thái dùng chung w</text></svg>
