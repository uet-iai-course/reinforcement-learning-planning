<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 280" role="img" aria-labelledby="title desc"><title id="title">Bảng tra và hàm có tham số</title><desc id="desc">Bên trái, bảng tra giữ một ô riêng cho mỗi trạng thái. Bên phải, trạng thái s đi qua đặc trưng x(s), rồi qua vector tham số w để cho dự đoán v̂(s,w); mọi trạng thái dùng chung w.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><rect x="10" y="10" width="440" height="260" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="230" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#2F3E7A">Bảng tra</text><g fill="#fff" stroke="#2F3E7A" stroke-width="3"><rect x="95" y="88" width="90" height="55"/><rect x="185" y="88" width="90" height="55"/><rect x="275" y="88" width="90" height="55"/><rect x="95" y="143" width="90" height="55"/><rect x="185" y="143" width="90" height="55"/><rect x="275" y="143" width="90" height="55"/></g><text x="230" y="245" text-anchor="middle" font-size="34">mỗi trạng thái một ô</text><rect x="480" y="10" width="570" height="260" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="765" y="62" text-anchor="middle" font-size="40" font-weight="700" fill="#2F3E7A">Hàm có tham số</text><circle cx="530" cy="150" r="36" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="530" y="163" text-anchor="middle" font-size="38">s</text><path d="M568 150 H618" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="625" y="102" width="170" height="96" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="710" y="140" text-anchor="middle" font-size="30">đặc trưng</text><text x="710" y="181" text-anchor="middle" font-size="34">x(s)</text><path d="M800 150 H888" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><text x="844" y="122" text-anchor="middle" font-size="36" font-style="italic" font-weight="700" fill="#B15A2B">w</text><text x="965" y="162" text-anchor="middle" font-size="36">v̂(s,w)</text><text x="765" y="245" text-anchor="middle" font-size="32">mọi trạng thái dùng chung w</text></svg>
