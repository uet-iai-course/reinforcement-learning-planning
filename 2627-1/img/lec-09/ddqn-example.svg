<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 222" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Mục tiêu DQN và Double DQN trên một mẫu chuyển</title>
<desc id="d">Bảng hai hàng, hai cột hành động. Hàng trên, mạng mục tiêu: Q theta trừ tại S phẩy bằng 5 và 4. Hàng dưới, mạng trực tuyến: Q theta tại S phẩy bằng 3 và 6. Hình thoi cạnh số 5: DQN lấy cực đại 5 của hàng trên. Khung vuông quanh số 6: Double DQN chọn hành động 2 bằng mạng trực tuyến. Mũi tên ghi đánh giá đi từ số 6 tới số 4, có viền ellip nét đứt: mạng mục tiêu đánh giá hành động 2 bằng 4. Dòng chú giải phía dưới giải thích ba ký hiệu.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker></defs>
<text x="415" y="24" font-size="21" text-anchor="middle" fill="#424954">a = 1</text>
<text x="585" y="24" font-size="21" text-anchor="middle" fill="#424954">a = 2</text>
<text x="314" y="75" font-size="24" text-anchor="end"><tspan font-style="italic">Q</tspan><tspan font-size="16" dy="6" font-style="italic">θ</tspan><tspan font-size="13" dy="-11">−</tspan><tspan dy="5">(</tspan><tspan font-style="italic">S′</tspan>, ·) mạng mục tiêu</text>
<rect x="330" y="34" width="170" height="64" fill="#FFFFFF" stroke="#424954" stroke-width="2"/>
<text x="415" y="76" font-size="30" text-anchor="middle">5</text>
<rect x="500" y="34" width="170" height="64" fill="#FFFFFF" stroke="#424954" stroke-width="2"/>
<text x="585" y="76" font-size="30" text-anchor="middle">4</text>
<text x="314" y="139" font-size="24" text-anchor="end"><tspan font-style="italic">Q</tspan><tspan font-size="16" dy="6" font-style="italic">θ</tspan><tspan dy="-6">(</tspan><tspan font-style="italic">S′</tspan>, ·) mạng trực tuyến</text>
<rect x="330" y="98" width="170" height="64" fill="#FFFFFF" stroke="#424954" stroke-width="2"/>
<text x="415" y="140" font-size="30" text-anchor="middle">3</text>
<rect x="500" y="98" width="170" height="64" fill="#FFFFFF" stroke="#424954" stroke-width="2"/>
<text x="585" y="140" font-size="30" text-anchor="middle">6</text>
<rect x="508" y="105" width="154" height="50" fill="none" stroke="#2F3E7A" stroke-width="5"/>
<ellipse cx="585" cy="66" rx="71" ry="25" fill="none" stroke="#2F3E7A" stroke-width="5" stroke-dasharray="10 6"/>
<path d="M676,130 C746,130 750,66 680,66" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#ar)"/>
<text x="756" y="106" font-size="21" fill="#2F3E7A">đánh giá</text>
<path d="M352,66 L366,52 L380,66 L366,80 Z" fill="#B15A2B"/>
<path d="M23,199 L35,187 L47,199 L35,211 Z" fill="#B15A2B"/>
<text x="60" y="206" font-size="21">DQN: cực đại hàng trên</text>
<rect x="330" y="188" width="30" height="22" fill="none" stroke="#2F3E7A" stroke-width="4"/>
<text x="370" y="206" font-size="21">Double DQN chọn a* = 2</text>
<ellipse cx="655" cy="199" rx="16" ry="11" fill="none" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="6 4"/>
<text x="680" y="206" font-size="21">đánh giá a* = 2</text>
</svg>
