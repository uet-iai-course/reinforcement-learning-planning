<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d"><title id="t">Hai cơ chế ổn định DQN</title><desc id="d">Replay trộn các chuyển tiếp, mạng mục tiêu làm chậm thay đổi của đích, nhưng cả hai không loại bỏ sai lệch cực đại.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#2f3e7a"/></marker></defs><rect x="35" y="75" width="225" height="125" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="147" y="125" text-anchor="middle" font-size="30" font-weight="700">Replay</text><text x="147" y="166" text-anchor="middle" font-size="30">trộn thời điểm</text><rect x="365" y="75" width="225" height="125" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="477" y="125" text-anchor="middle" font-size="30" font-weight="700">Mạng mục tiêu</text><text x="477" y="166" text-anchor="middle" font-size="30">làm chậm đích</text><rect x="700" y="75" width="225" height="125" rx="18" fill="#fff4f0" stroke="#a33a1f" stroke-width="4"/><text x="812" y="125" text-anchor="middle" font-size="30" font-weight="700">max</text><text x="812" y="166" text-anchor="middle" font-size="30">vẫn chọn nhiễu cao</text><path d="M260 138H355M590 138H690" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/><text x="480" y="245" text-anchor="middle" font-size="30">Ổn định hơn không đồng nghĩa không chệch</text></svg>
