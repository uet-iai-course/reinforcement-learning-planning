<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Ước lượng REINFORCE trên một lượt</title>
<desc id="d">Ba nút trên một hàng: S 0, A 0; S 1, A 1; S 2, A 2, nối bằng mũi tên ghi phần thưởng R 1, R 2, R 3; mọi hành động lấy mẫu từ pi theta old. Mũi tên cong màu cam đi ngược từ nút cuối về nút đầu, ghi: tính G t bằng R t cộng 1 cộng gamma G t cộng 1, từ cuối lượt về đầu. Hộp bên phải: g mũ bằng tổng gamma mũ t G t psi t, cập nhật theta một lần.</desc>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="b" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B15A2B"/></marker></defs>
<g fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"><circle cx="100" cy="110" r="50"/><circle cx="290" cy="110" r="50"/><circle cx="480" cy="110" r="50"/></g>
<text x="100" y="118" text-anchor="middle" font-size="24"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="5">0</tspan><tspan dy="-5">, </tspan><tspan font-style="italic">A</tspan><tspan font-size="16" dy="5">0</tspan></text>
<text x="290" y="118" text-anchor="middle" font-size="24"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="5">1</tspan><tspan dy="-5">, </tspan><tspan font-style="italic">A</tspan><tspan font-size="16" dy="5">1</tspan></text>
<text x="480" y="118" text-anchor="middle" font-size="24"><tspan font-style="italic">S</tspan><tspan font-size="16" dy="5">2</tspan><tspan dy="-5">, </tspan><tspan font-style="italic">A</tspan><tspan font-size="16" dy="5">2</tspan></text>
<path d="M150 110H238M340 110H428M530 110H630" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#a)"/>
<text x="195" y="92" text-anchor="middle" font-size="22"><tspan font-style="italic">R</tspan><tspan font-size="15" dy="5">1</tspan></text>
<text x="385" y="92" text-anchor="middle" font-size="22"><tspan font-style="italic">R</tspan><tspan font-size="15" dy="5">2</tspan></text>
<text x="580" y="92" text-anchor="middle" font-size="22"><tspan font-style="italic">R</tspan><tspan font-size="15" dy="5">3</tspan></text>
<text x="290" y="30" text-anchor="middle" font-size="21" fill="#424954"><tspan font-style="italic">A</tspan><tspan font-size="15" dy="5" font-style="italic">t</tspan><tspan dy="-5"> lấy mẫu từ </tspan><tspan font-style="italic">π</tspan><tspan font-size="15" dy="5" font-style="italic">θ</tspan><tspan font-size="12" dy="3">old</tspan><tspan dy="-8">, giữ cố định cả lượt</tspan></text>
<rect x="650" y="62" width="295" height="100" rx="12" fill="#eef8ef" stroke="#2e7d32" stroke-width="3"/>
<text x="797" y="102" text-anchor="middle" font-size="24"><tspan font-style="italic">ĝ</tspan> = Σ<tspan font-size="16" dy="5" font-style="italic">t</tspan><tspan dy="-5"> </tspan><tspan font-style="italic">γ</tspan><tspan font-size="16" dy="-9" font-style="italic">t</tspan><tspan dy="9" font-style="italic"> G</tspan><tspan font-size="16" dy="5" font-style="italic">t</tspan><tspan dy="-5" font-style="italic"> ψ</tspan><tspan font-size="16" dy="5" font-style="italic">t</tspan></text>
<text x="797" y="140" text-anchor="middle" font-size="22">cập nhật <tspan font-style="italic">θ</tspan> một lần</text>
<path d="M480 168C420 250 170 250 106 172" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#b)"/>
<text x="300" y="282" text-anchor="middle" font-size="22" fill="#B15A2B"><tspan font-style="italic">G</tspan><tspan font-size="15" dy="5" font-style="italic">t</tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">R</tspan><tspan font-size="15" dy="5" font-style="italic">t</tspan><tspan font-size="15">+1</tspan><tspan dy="-5"> + </tspan><tspan font-style="italic">γG</tspan><tspan font-size="15" dy="5" font-style="italic">t</tspan><tspan font-size="15">+1</tspan><tspan dy="-5">, tính từ cuối lượt về đầu</tspan></text>
</svg>
