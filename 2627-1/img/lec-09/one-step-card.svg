<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 214" width="520" height="214" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Bài toán một bước, chính sách softmax</title>
<desc id="d">Thẻ dữ kiện, chính sách softmax với logit phi của s, a chuyển vị nhân theta. Bảng hai cột cho hành động a bằng 1 và a bằng 2: đặc trưng phi của s, a bằng (1; 0) và (0; 1); xác suất pi theta của a khi biết s bằng 2/3 và 1/3; phần thưởng r của a bằng 3 và 0. Dòng dưới: tham số theta bằng (log 2; 0), lượt dừng sau hành động A 0.</desc>
<rect x="2" y="2" width="516" height="210" rx="10" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<text x="20" y="32" font-size="23" font-weight="700" fill="#2F3E7A">Bài toán một bước, chính sách softmax</text>
<rect x="20" y="44" width="480" height="32" fill="#F7EFE6"/>
<text x="260" y="68" font-size="23" text-anchor="middle"><tspan font-style="italic">a</tspan> = 1</text>
<text x="420" y="68" font-size="23" text-anchor="middle"><tspan font-style="italic">a</tspan> = 2</text>
<line x1="20" y1="108" x2="500" y2="108" stroke="#c9cdd4" stroke-width="1.5"/>
<line x1="20" y1="140" x2="500" y2="140" stroke="#c9cdd4" stroke-width="1.5"/>
<line x1="20" y1="172" x2="500" y2="172" stroke="#c9cdd4" stroke-width="1.5"/>
<line x1="180" y1="44" x2="180" y2="172" stroke="#c9cdd4" stroke-width="1.5"/>
<text x="30" y="100" font-size="23"><tspan font-style="italic">ϕ</tspan>(<tspan font-style="italic">s</tspan>, <tspan font-style="italic">a</tspan>)</text>
<text x="260" y="100" font-size="23" text-anchor="middle">(1; 0)</text>
<text x="420" y="100" font-size="23" text-anchor="middle">(0; 1)</text>
<text x="30" y="132" font-size="23"><tspan font-style="italic">π</tspan><tspan font-size="16" dy="5" font-style="italic">θ</tspan><tspan dy="-5">(</tspan><tspan font-style="italic">a</tspan> | <tspan font-style="italic">s</tspan>)</text>
<text x="260" y="132" font-size="23" text-anchor="middle">2/3</text>
<text x="420" y="132" font-size="23" text-anchor="middle">1/3</text>
<text x="30" y="164" font-size="23"><tspan font-style="italic">r</tspan>(<tspan font-style="italic">a</tspan>)</text>
<text x="260" y="164" font-size="23" text-anchor="middle">3</text>
<text x="420" y="164" font-size="23" text-anchor="middle">0</text>
<text x="20" y="200" font-size="23"><tspan font-style="italic">θ</tspan> = (log 2; 0); lượt dừng sau <tspan font-style="italic">A</tspan><tspan font-size="16" dy="5">0</tspan></text>
</svg>
