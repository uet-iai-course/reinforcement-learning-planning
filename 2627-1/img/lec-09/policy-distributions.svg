<title id="t">Phân phối phân loại và phân phối Gaussian của hành động</title>
<desc id="d">Bên trái: biểu đồ cột phân phối phân loại trên bốn hành động 1, 2, 3, 4 với xác suất 0,1; 0,2; 0,2; 0,5, mỗi cột ghi số. Bên phải: đường mật độ Gaussian theo hành động thực a, trung bình mu ở giữa có đường nét đứt; hai đường thẳng đứng a min và a max đánh dấu miền hành động bị chặn; hai phần đuôi ngoài miền tô sọc ghi "ngoài miền".</desc>
