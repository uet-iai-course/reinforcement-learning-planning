<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">So sánh DQN và Double DQN</title><desc id="d">DQN dùng mạng mục tiêu để chọn và đánh giá; Double DQN dùng mạng online để chọn rồi mạng mục tiêu để đánh giá.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#2f3e7a"/></marker></defs><text x="205" y="45" text-anchor="middle" font-size="31" font-weight="700">DQN</text><rect x="70" y="75" width="270" height="70" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="205" y="119" text-anchor="middle" font-size="30">mạng mục tiêu: chọn</text><rect x="70" y="210" width="270" height="70" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="205" y="254" text-anchor="middle" font-size="30">mạng mục tiêu: đánh giá</text><path d="M205 145V200" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/><text x="700" y="45" text-anchor="middle" font-size="31" font-weight="700">Double DQN</text><rect x="565" y="75" width="270" height="70" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="700" y="119" text-anchor="middle" font-size="30">mạng online: chọn</text><rect x="565" y="210" width="270" height="70" rx="12" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="700" y="254" text-anchor="middle" font-size="30">mạng mục tiêu: đánh giá</text><path d="M700 145V200" stroke="#2f3e7a" stroke-width="5" marker-end="url(#a)"/></svg>
