<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Lưới gộp trạng thái, chính sách tất định</title>
<desc id="d">Lưới hai hàng năm cột theo bài giảng gốc trang 23. Hàng trên ô 1 đến ô 5, ô 2 và ô 4 màu xám có cùng đặc trưng x bằng g, ba ô trắng có đặc trưng riêng. Hàng dưới: X dưới ô 1, ô đích đô la dưới ô 3, X dưới ô 5. Dòng chú thích: mỗi bước đi một ô, gặp tường thì đứng yên; X là ô kẹt, không bao giờ tới đích; hàng dưới chỉ vào được từ ô 1, 3, 5. Mũi tên: ô 1 sang Đông, ô 3 xuống ô đích, ô 5 sang Tây. Chính sách tất định đi Đông ở cả hai ô xám: ô 2 sang Đông tới ô 3, ô 4 sang Đông tới ô 5; ô 4 và ô 5 nối bằng đường nét đứt ghi kẹt, ô 4 và ô 5 lặp mãi.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#2F3E7A"/></marker><marker id="ar2" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#B15A2B"/></marker></defs>
