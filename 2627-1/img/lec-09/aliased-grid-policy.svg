<text x="191" y="78.0" font-size="21" text-anchor="end">Đông ở cả</text><text x="191" y="104.0" font-size="21" text-anchor="end">hai ô xám</text>
<text x="480" y="216" font-size="18" text-anchor="middle" fill="#424954">ô xám: cùng đặc trưng x = g; ô 1, 3, 5: đặc trưng riêng; mỗi bước đi một ô, gặp tường thì đứng yên</text><text x="480" y="240" font-size="18" text-anchor="middle" fill="#424954">X: ô kẹt, không bao giờ tới đích $; hàng dưới chỉ vào được từ ô 1, 3, 5</text>
