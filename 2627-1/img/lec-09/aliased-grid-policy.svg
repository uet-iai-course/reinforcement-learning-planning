<text x="260.0" y="162" font-size="30" font-weight="700" text-anchor="middle">X</text>
<text x="480.0" y="162" font-size="30" font-weight="700" text-anchor="middle">$</text>
<text x="700.0" y="162" font-size="30" font-weight="700" text-anchor="middle">X</text>
<line x1="235" y1="78.0" x2="297" y2="78.0" stroke="#2F3E7A" stroke-width="4" marker-end="url(#ar)"/>
<line x1="480.0" y1="60" x2="480.0" y2="124" stroke="#2F3E7A" stroke-width="4" marker-end="url(#ar)"/>
<line x1="725" y1="78.0" x2="663" y2="78.0" stroke="#2F3E7A" stroke-width="4" marker-end="url(#ar)"/>
<text x="415" y="50" font-size="15" text-anchor="end" fill="#424954">x = g</text>
<text x="635" y="50" font-size="15" text-anchor="end" fill="#424954">x = g</text>
