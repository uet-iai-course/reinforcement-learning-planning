<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Hai đại lượng ước lượng từ mẫu trong Bài 09</title>
<desc id="d">Hai hàng, mỗi hàng ba khung nối bằng mũi tên từ trái sang phải. Hàng trên, nhãn trái "giá trị trong mục tiêu bootstrap": khung 1 "mục tiêu DQN, max theo a phẩy của Q theta trừ tại S phẩy", Mục 2; khung 2 "cùng ước lượng chọn và đánh giá, kỳ vọng của max lớn hơn hoặc bằng max của kỳ vọng", Mục 2; khung 3 "tách chọn và đánh giá, Double DQN và Double Q-learning", Mục 3. Hàng dưới, nhãn trái "gradient của J theta": khung 1 "chính sách pi theta của a cho s, hành động hữu hạn hoặc liên tục", Mục 4; khung 2 "hàm điểm, gradient của pi theta bằng pi theta nhân gradient của log pi theta", Mục 5; khung 3 "REINFORCE, kỳ vọng của g mũ bằng gradient của J theta", Mục 6.</desc>
<defs>
<marker id="a1" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#B15A2B"/></marker>
<marker id="a2" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#2F3E7A"/></marker>
</defs>
<!-- nhãn hàng -->
<text x="95" y="72" font-size="21" text-anchor="middle" fill="#B15A2B" font-weight="700">giá trị trong</text>
<text x="95" y="98" font-size="21" text-anchor="middle" fill="#B15A2B" font-weight="700">mục tiêu</text>
<text x="95" y="124" font-size="21" text-anchor="middle" fill="#B15A2B" font-weight="700">bootstrap</text>
<text x="95" y="236" font-size="21" text-anchor="middle" fill="#2F3E7A" font-weight="700">gradient</text>
<text x="95" y="262" font-size="21" text-anchor="middle" fill="#2F3E7A" font-weight="700">của <tspan font-style="italic">J</tspan>(<tspan font-style="italic">θ</tspan>)</text>
<!-- hàng trên -->
<rect x="200" y="46" width="240" height="96" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="320" y="82" font-size="21" text-anchor="middle">mục tiêu DQN</text>
<text x="320" y="116" font-size="21" text-anchor="middle">max<tspan font-size="15" dy="6" font-style="italic">a′</tspan><tspan dy="-6"> </tspan><tspan font-style="italic">Q</tspan><tspan font-size="15" dy="6" font-style="italic">θ</tspan><tspan font-size="12" dy="-10">−</tspan><tspan dy="4">(</tspan><tspan font-style="italic">S′</tspan>, <tspan font-style="italic">a′</tspan>)</text>
<line x1="442" y1="94" x2="486" y2="94" stroke="#B15A2B" stroke-width="3" marker-end="url(#a1)"/>
<rect x="490" y="46" width="240" height="96" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="610" y="82" font-size="21" text-anchor="middle">cùng ước lượng chọn</text>
<text x="610" y="106" font-size="21" text-anchor="middle">và đánh giá:</text>
<text x="610" y="132" font-size="21" text-anchor="middle">𝔼[max] ≥ max 𝔼</text>
<line x1="732" y1="94" x2="776" y2="94" stroke="#B15A2B" stroke-width="3" marker-end="url(#a1)"/>
<rect x="780" y="46" width="210" height="96" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/>
<text x="885" y="82" font-size="21" text-anchor="middle">tách chọn, đánh giá</text>
<text x="885" y="108" font-size="19" text-anchor="middle">Double DQN,</text>
<text x="885" y="131" font-size="19" text-anchor="middle">Double Q-learning</text>
<text x="320" y="166" font-size="18" text-anchor="middle" fill="#424954">Mục 2</text>
<text x="610" y="166" font-size="18" text-anchor="middle" fill="#424954">Mục 2</text>
<text x="885" y="166" font-size="18" text-anchor="middle" fill="#424954">Mục 3</text>
<!-- hàng dưới -->
<rect x="200" y="196" width="240" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="320" y="228" font-size="21" text-anchor="middle">chính sách <tspan font-style="italic">π</tspan><tspan font-size="15" dy="6" font-style="italic">θ</tspan><tspan dy="-6">(</tspan><tspan font-style="italic">a</tspan> | <tspan font-style="italic">s</tspan>)</text>
<text x="320" y="260" font-size="18" text-anchor="middle">hành động hữu hạn</text>
<text x="320" y="282" font-size="18" text-anchor="middle">hoặc liên tục</text>
<line x1="442" y1="244" x2="486" y2="244" stroke="#2F3E7A" stroke-width="3" marker-end="url(#a2)"/>
<rect x="490" y="196" width="240" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="610" y="232" font-size="21" text-anchor="middle">hàm điểm</text>
<text x="610" y="266" font-size="19" text-anchor="middle">∇<tspan font-style="italic">π</tspan><tspan font-size="14" dy="5" font-style="italic">θ</tspan><tspan dy="-5"> = </tspan><tspan font-style="italic">π</tspan><tspan font-size="14" dy="5" font-style="italic">θ</tspan><tspan dy="-5"> ∇ log </tspan><tspan font-style="italic">π</tspan><tspan font-size="14" dy="5" font-style="italic">θ</tspan></text>
<line x1="732" y1="244" x2="776" y2="244" stroke="#2F3E7A" stroke-width="3" marker-end="url(#a2)"/>
<rect x="780" y="196" width="210" height="96" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="10 6"/>
<text x="885" y="232" font-size="21" text-anchor="middle">REINFORCE</text>
<text x="885" y="266" font-size="19" text-anchor="middle">𝔼[<tspan font-style="italic">ĝ</tspan>] = ∇<tspan font-style="italic">J</tspan>(<tspan font-style="italic">θ</tspan>)</text>
<text x="320" y="316" font-size="18" text-anchor="middle" fill="#424954">Mục 4</text>
<text x="610" y="316" font-size="18" text-anchor="middle" fill="#424954">Mục 5</text>
<text x="885" y="316" font-size="18" text-anchor="middle" fill="#424954">Mục 6</text>
</svg>
