<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 430" width="400" height="390.9" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Mê cung hai phòng</title>
<desc id="d">Lưới hai hàng bốn cột: hàng trên A, B, C, D; hàng dưới E, F, K, Z. Tường giữa B và C; cạnh F–K là cửa giữa phòng trái và phòng phải; Z là đích, phần thưởng cộng 1. Đường ngắn nhất từ A qua B, F, cửa, K tới Z vẽ nét chấm. Đi đúng 0,8; trượt, ở yên 0,2; gamma 0,9.</desc>
