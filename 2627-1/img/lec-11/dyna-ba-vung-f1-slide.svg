<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 362" width="1000" height="362" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Bước thật 5: (f) lần 1</title>
<desc id="d">Lớp thêm: lấy thẻ (F, phải) cho (0, K) từ mô hình, viền cam; mũi tên nét đứt sang hàng Q(F, phải). Mũi tên nét đứt từ 0,5 của hàng Q(K, phải) lên hàng Q(F, phải), nhãn đọc 0,5; Q(F, phải) từ 0 lên 0,225. Chú thích: thứ tự chọn trong lần chạy đã chọn; tác tử vẫn ở Z.</desc>
