<title id="t">Một cập nhật trên mô hình, F sang K</title>
<desc id="d">Lớp thêm, nét cam: mũi tên nét đứt từ F sang K là mẫu từ mô hình; ô F ghi Q(F, phải) bằng 0,225. Mốc thứ ba của dải: lập kế hoạch, chọn (F, phải), mục tiêu 0,45.</desc>
