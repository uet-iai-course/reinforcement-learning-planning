<text x="231.0" y="342" font-size="22" text-anchor="middle" font-weight="bold" fill="#B5541B">Q(F,→) = 0,225</text>
<rect x="502" y="374" width="196" height="96" rx="8" fill="#F7EFE6" stroke="#B5541B" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="600.0" y="402" font-size="22" text-anchor="middle" font-weight="bold" fill="#B5541B">lập kế hoạch:</text>
<text x="600.0" y="430" font-size="22" text-anchor="middle" font-weight="normal" fill="#1d2433">chọn (F,→)</text>
