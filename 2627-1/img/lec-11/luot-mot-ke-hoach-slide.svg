<title id="t">Một cập nhật trên mô hình, F sang K</title>
<desc id="d">Lớp thêm, nét cam: mũi tên nét đứt từ F sang K là mẫu từ mô hình; ô F ghi mục tiêu 0,45. Cột thứ ba của bảng, lập kế hoạch: Bảng Q, Q(F, phải) bằng 0,225; Mô hình, đọc (F, phải) được (K, 0).</desc>
