<title id="t">Cập nhật kỳ vọng và cập nhật mẫu</title>
<desc id="d">Trục hoành: số lần đánh giá chia cho b, từ 0 đến 2. Trục tung: sai số căn bình phương trung bình, từ 0 đến 1. Ba đường cong của cập nhật mẫu theo căn của (b trừ 1) chia (b nhân k), với b bằng 2 (liền), 10 (nét đứt), 100 (chấm), vẽ từ một lần đánh giá. Đường bậc thang của cập nhật kỳ vọng: sai số giữ mức chuẩn hóa 1 tới hoành độ 1 rồi rơi về 0. Điểm k bằng 0 là mức chuẩn hóa 1.</desc>
