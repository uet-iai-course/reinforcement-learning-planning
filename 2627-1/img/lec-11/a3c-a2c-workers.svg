<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="t d"><title id="t">A3C bất đồng bộ và A2C đồng bộ</title><desc id="d">A3C cho worker gửi gradient vào tham số chung ở thời điểm khác nhau; A2C gom rollout rồi cập nhật cùng nhịp.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><text x="240" y="45">A3C</text><text x="720" y="45">A2C</text><circle cx="240" cy="180" r="70" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="240" y="190">shared θ</text><circle cx="80" cy="100" r="42" fill="#f7efe6"/><circle cx="90" cy="270" r="42" fill="#f7efe6"/><circle cx="390" cy="120" r="42" fill="#f7efe6"/><line x1="115" y1="120" x2="180" y2="155" stroke="#b15a2b" stroke-width="5"/><line x1="125" y1="255" x2="180" y2="210" stroke="#b15a2b" stroke-width="5"/><line x1="350" y1="140" x2="300" y2="165" stroke="#b15a2b" stroke-width="5"/><rect x="620" y="145" width="200" height="75" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="720" y="192">batch chung</text><circle cx="570" cy="80" r="38" fill="#f7efe6"/><circle cx="720" cy="80" r="38" fill="#f7efe6"/><circle cx="870" cy="80" r="38" fill="#f7efe6"/><line x1="570" y1="118" x2="650" y2="145" stroke="#b15a2b" stroke-width="5"/><line x1="720" y1="118" x2="720" y2="145" stroke="#b15a2b" stroke-width="5"/><line x1="870" y1="118" x2="790" y2="145" stroke="#b15a2b" stroke-width="5"/><text x="720" y="300">một cập nhật đồng bộ</text></g></svg>
