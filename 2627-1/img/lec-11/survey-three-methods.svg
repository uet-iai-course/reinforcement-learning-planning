<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="t d"><title id="t">Ba hướng khảo sát SVPG, IMPALA và PPG</title><desc id="d">SVPG duy trì quần thể có lực đẩy, IMPALA hiệu chỉnh policy lag bằng V-trace, PPG tách pha policy và pha phụ trợ có cloning KL.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="25" y="75" width="310" height="205" rx="17" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="180" y="120">SVPG</text><text x="180" y="170">gradient return</text><text x="180" y="215">+ lực đẩy kernel</text><rect x="385" y="75" width="310" height="205" rx="17" fill="#f7efe6" stroke="#b15a2b" stroke-width="5"/><text x="540" y="120">IMPALA</text><text x="540" y="170">actor lệch nhịp</text><text x="540" y="215">+ V-trace</text><rect x="745" y="75" width="310" height="205" rx="17" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="900" y="120">PPG</text><text x="900" y="170">pha policy / phụ trợ</text><text x="900" y="215">+ cloning KL</text></g></svg>
