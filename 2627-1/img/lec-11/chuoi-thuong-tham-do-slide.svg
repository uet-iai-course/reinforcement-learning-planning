<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 100" width="1170" height="100" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Từ thưởng thăm dò tới lần thử thật</title>
<desc id="d">Chuỗi: Q(B, phải) bằng 0,64 lớn hơn 0,6; lần tới ở B, chính sách tham lam chọn phải; thử phải ở B rẽ hai nhánh: sang C với xác suất 0,8, ở lại B với xác suất 0,2; cả hai nhánh tới bước (e) ghi kết cục quan sát và đặt ell(B, phải) về 0, kể cả khi trượt (nhánh 0,2 ghi lại (0, B)); thưởng thăm dò chỉ cộng trong bước (f).</desc>
