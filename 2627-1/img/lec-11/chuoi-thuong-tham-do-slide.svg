<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 208" width="1140" height="208" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Từ thưởng thăm dò tới lần thử thật</title>
<desc id="d">Dòng thời gian bốn mốc: lần thử thật cuối của (B, phải), bị tường chặn, mô hình ghi (0, B); tường B–C mở; lập kế hoạch (f) trên cặp đã lưu, cộng thưởng 0,2; lần tới ở B, tham lam chọn phải nếu 0,64 vẫn dẫn đầu. Ngoặc dưới từ mốc đầu tới mốc lập kế hoạch: 400 bước thật. Dưới đó: thang Q(B, ·) với ba vạch, 0,54 là Q(B, phải) trước, 0,6 là hành động dẫn đầu, 0,64 là Q(B, phải) sau. Dưới mốc cuối: sang C với xác suất 0,8 hay ở lại B với xác suất 0,2, đều ghi kết cục và đặt bộ đếm ℓ về 0.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ars" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="aos" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ags" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ax" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="axs" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><marker id="aks" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><pattern id="van" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#2F3E7A" stroke-width="3.5"/></pattern><pattern id="vano" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B5541B" stroke-width="3.5"/></pattern><pattern id="vanx" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3.5"/></pattern></defs>
<rect x="4" y="4" width="262" height="60" rx="8" fill="#EEF1F8" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="135.0" y="29.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">lần thử thật cuối (B,→):</text>
<text x="135.0" y="55.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">bị chặn, ghi (0, B)</text>
<line x1="268.0" y1="34.0" x2="288.0" y2="34.0" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="290" y="4" width="170" height="60" rx="8" fill="#EEF1F8" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="375.0" y="29.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">tường B–C</text>
<text x="375.0" y="55.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">mở</text>
<line x1="462.0" y1="34.0" x2="482.0" y2="34.0" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="484" y="4" width="330" height="60" rx="8" fill="#F7EFE6" stroke="#B5541B" stroke-width="2.5"/>
<text x="649.0" y="29.0" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">lập kế hoạch (f), cặp đã lưu:</text>
<text x="649.0" y="55.0" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">cộng thưởng 0,2</text>
<line x1="816.0" y1="34.0" x2="836.0" y2="34.0" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="838" y="4" width="298" height="60" rx="8" fill="#EEF1F8" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="987.0" y="29.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">lần tới ở B: chọn →</text>
<text x="987.0" y="55.0" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">nếu 0,64 vẫn dẫn đầu</text>
<path d="M 135 76 L 135 86 L 649 86 L 649 76" stroke="#1d2433" stroke-width="2" fill="none"/>
<text x="392.0" y="110" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">400 bước thật</text>
<line x1="330" y1="154" x2="800" y2="154" stroke="#1d2433" stroke-width="2"/>
<line x1="424.0000000000001" y1="138" x2="424.0000000000001" y2="170" stroke="#6B7280" stroke-width="4"/>
<line x1="565.0" y1="138" x2="565.0" y2="170" stroke="#2F3E7A" stroke-width="4"/>
<line x1="659.0" y1="138" x2="659.0" y2="170" stroke="#B5541B" stroke-width="4"/>
<text x="418.0000000000001" y="194" font-size="21" text-anchor="end" font-weight="bold" fill="#6B7280">0,54 trước</text>
<text x="565.0" y="132" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">0,6 dẫn đầu</text>
<text x="665.0" y="194" font-size="21" text-anchor="start" font-weight="bold" fill="#B5541B">0,64 sau</text>
<text x="322" y="162" font-size="21" text-anchor="end" font-weight="bold" fill="#1d2433">Q(B,·)</text>
<text x="987" y="104" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">sang C (0,8) hay</text>
<text x="987" y="130" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">ở lại B (0,2):</text>
<text x="987" y="160" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d2433">ghi kết cục; ℓ ← 0</text>
</svg>
