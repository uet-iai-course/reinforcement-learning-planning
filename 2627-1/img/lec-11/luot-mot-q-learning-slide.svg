<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Lượt thứ nhất trên mê cung hai phòng</title>
<desc id="d">Mê cung hai phòng: hàng trên A, B, C, D; hàng dưới E, F, K, Z; tường giữa B và C; cửa F–K; Z là đích. Năm bước thật của lượt thứ nhất, nét xanh, đánh số 1 đến 5: bước 1 là vòng nhỏ tại A, trượt và ở yên; bước 2 A sang B; bước 3 B xuống F; bước 4 F qua cửa sang K; bước 5 K vào Z, phần thưởng cộng 1. Dưới lưới: mục tiêu Q-learning của năm bước theo thứ tự 0, 0, 0, 0, 1; tổng số bước thật: 5.</desc>
