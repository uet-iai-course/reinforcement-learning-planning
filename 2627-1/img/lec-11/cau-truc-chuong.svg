<text x="797.5" y="434" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d2433">lặp giá trị</text>
<text x="797.5" y="462" font-size="18" text-anchor="middle" font-weight="normal" fill="#1d2433">với tùy chọn</text>
