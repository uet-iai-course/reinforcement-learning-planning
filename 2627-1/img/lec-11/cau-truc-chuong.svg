<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Cấu trúc chương: các cách dùng mô hình</title>
<desc id="d">Dòng chính: mô hình, kinh nghiệm mô phỏng, cập nhật, giá trị, chính sách. Vòng phía trên: chính sách cho hành động trong môi trường; kinh nghiệm thật đi vào học mô hình và, qua học trực tiếp, vào giá trị. Bốn khối phía dưới: lập kế hoạch tại thời điểm quyết định với hành động liên tục (hạ gradient qua mô hình, entropy chéo, điều khiển dự báo), nối thẳng từ kinh nghiệm mô phỏng, không qua giá trị; với hành động rời rạc (rollout, tìm kiếm theo cây Monte Carlo); lập kế hoạch nền (Q-planning, Dyna-Q); trừu tượng thời gian (tùy chọn, lặp giá trị với tùy chọn). Ba khối sau nối từ khối cập nhật.</desc>
