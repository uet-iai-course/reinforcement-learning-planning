<rect x="302" y="440" width="198" height="34" rx="0" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<text x="401.0" y="465" font-size="22" text-anchor="middle" font-weight="normal" fill="#1d2433">ghi (K,→) ↦ (Z, +1)</text>
