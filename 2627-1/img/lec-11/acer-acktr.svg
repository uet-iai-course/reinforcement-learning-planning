<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">ACER và ACKTR kiểm soát gradient theo hai cách</title><desc id="d">ACER cắt tỷ số importance và thêm hiệu chỉnh phần dư; ACKTR xấp xỉ độ cong bằng K-FAC cho actor và critic.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="45" y="65" width="405" height="220" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="248" y="115">ACER</text><text x="248" y="165">c=min(c̄,ρ)</text><text x="248" y="210">+ hiệu chỉnh phần dư</text><text x="248" y="255">+ replay</text><rect x="550" y="65" width="405" height="220" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="5"/><text x="752" y="115">ACKTR</text><text x="752" y="165">Fisher cho actor</text><text x="752" y="210">Gauss–Newton cho critic</text><text x="752" y="255">xấp xỉ K-FAC</text></g></svg>
