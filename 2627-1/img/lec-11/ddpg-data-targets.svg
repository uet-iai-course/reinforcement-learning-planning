<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 350" role="img" aria-labelledby="t d"><title id="t">Đường dữ liệu và mạng mục tiêu của DDPG</title><desc id="d">Actor hành vi thêm noise thu chuyển tiếp vào replay; critic online học từ target actor và target critic; actor online học qua critic.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="25" y="55" width="200" height="80" rx="13" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="125" y="103">μ_θ + noise</text><rect x="300" y="55" width="200" height="80" rx="13" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="400" y="103">Replay</text><rect x="575" y="55" width="200" height="80" rx="13" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="675" y="103">Q_φ online</text><rect x="850" y="55" width="200" height="80" rx="13" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="950" y="103">μ̄,Q̄ target</text><line x1="225" y1="95" x2="290" y2="95" stroke="#2f3e7a" stroke-width="6"/><line x1="500" y1="95" x2="565" y2="95" stroke="#2f3e7a" stroke-width="6"/><line x1="850" y1="125" x2="775" y2="125" stroke="#b15a2b" stroke-width="6"/><rect x="360" y="235" width="360" height="70" rx="13" fill="#fff" stroke="#2e7d32" stroke-width="4"/><text x="540" y="278">soft update: θ̄←τθ+(1−τ)θ̄</text></g></svg>
