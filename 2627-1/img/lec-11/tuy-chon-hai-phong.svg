<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hai tùy chọn trên mê cung hai phòng</title>
<desc id="d">Mê cung hai hàng bốn cột. Phòng trái A, B, E, F tô nền, ghi tùy chọn omega 1, đi tới cửa; mũi tên trong ô: A sang phải, B xuống, E sang phải, F sang phải tới K; hệ số p của K ghi trong ô: F 0,8780; B và E 0,7710; A 0,6769. Phòng phải C, D, K viền nét đứt, ghi tùy chọn omega 2, đi tới đích; mũi tên: C sang phải, D xuống, K sang phải tới Z; r ghi trong ô: K và D 0,9756; C 0,8566.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker></defs>
<text x="245" y="40" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">ω₁: đi tới cửa (kết thúc tại K)</text>
<text x="615" y="40" font-size="21" text-anchor="middle" font-weight="bold" fill="#B5541B">ω₂: đi tới đích</text>
<rect x="60" y="60" width="185" height="130" rx="0" fill="#EEF1F8" stroke="#8A94AD" stroke-width="1.5"/>
<text x="100" y="110" font-size="30" text-anchor="middle" font-weight="bold" fill="#2F3E7A">A</text>
<text x="180" y="114" font-size="40" text-anchor="middle" font-weight="bold" fill="#2F3E7A">→</text>
<text x="152.5" y="160" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">p = 0,6769</text>
<rect x="245" y="60" width="185" height="130" rx="0" fill="#EEF1F8" stroke="#8A94AD" stroke-width="1.5"/>
<text x="285" y="110" font-size="30" text-anchor="middle" font-weight="bold" fill="#2F3E7A">B</text>
<text x="365" y="114" font-size="40" text-anchor="middle" font-weight="bold" fill="#2F3E7A">↓</text>
<text x="337.5" y="160" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">p = 0,7710</text>
<rect x="433" y="63" width="179" height="124" rx="0" fill="#FFFFFF" stroke="#B5541B" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="470" y="110" font-size="30" text-anchor="middle" font-weight="bold" fill="#B5541B">C</text>
<text x="550" y="114" font-size="40" text-anchor="middle" font-weight="bold" fill="#B5541B">→</text>
<text x="522.5" y="160" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">r = 0,8566</text>
<rect x="618" y="63" width="179" height="124" rx="0" fill="#FFFFFF" stroke="#B5541B" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="655" y="110" font-size="30" text-anchor="middle" font-weight="bold" fill="#B5541B">D</text>
<text x="735" y="114" font-size="40" text-anchor="middle" font-weight="bold" fill="#B5541B">↓</text>
<text x="707.5" y="160" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">r = 0,9756</text>
<rect x="60" y="190" width="185" height="130" rx="0" fill="#EEF1F8" stroke="#8A94AD" stroke-width="1.5"/>
<text x="100" y="240" font-size="30" text-anchor="middle" font-weight="bold" fill="#2F3E7A">E</text>
<text x="180" y="244" font-size="40" text-anchor="middle" font-weight="bold" fill="#2F3E7A">→</text>
<text x="152.5" y="290" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">p = 0,7710</text>
<rect x="245" y="190" width="185" height="130" rx="0" fill="#EEF1F8" stroke="#8A94AD" stroke-width="1.5"/>
<text x="285" y="240" font-size="30" text-anchor="middle" font-weight="bold" fill="#2F3E7A">F</text>
<text x="365" y="244" font-size="40" text-anchor="middle" font-weight="bold" fill="#2F3E7A">→</text>
<text x="337.5" y="290" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">p = 0,8780</text>
<rect x="433" y="193" width="179" height="124" rx="0" fill="#FFFFFF" stroke="#B5541B" stroke-width="2.5" stroke-dasharray="8 5"/>
<text x="470" y="240" font-size="30" text-anchor="middle" font-weight="bold" fill="#B5541B">K</text>
<text x="550" y="244" font-size="40" text-anchor="middle" font-weight="bold" fill="#B5541B">→</text>
<text x="522.5" y="290" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">r = 0,9756</text>
<rect x="615" y="190" width="185" height="130" rx="0" fill="#DCE3F3" stroke="#8A94AD" stroke-width="1.5"/>
<text x="707.5" y="250" font-size="32" text-anchor="middle" font-weight="bold" fill="#1d2433">Z</text>
<text x="707.5" y="286" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">đích</text>
<rect x="60" y="60" width="740" height="260" fill="none" stroke="#1d2433" stroke-width="4"/>
<line x1="430" y1="60" x2="430" y2="190" stroke="#1d2433" stroke-width="9"/>
<text x="430" y="380" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">p: hệ số chiết khấu kỳ vọng khi tới K; r: phần thưởng kỳ vọng khi đi tới đích</text>
</svg>
