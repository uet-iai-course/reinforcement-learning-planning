<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Hai trường gradient tỷ số của SPO</title><desc id="d">Hai parabol lõm riêng: lợi thế dương đạt cực đại tại một cộng epsilon, lợi thế âm đạt cực đại tại một trừ epsilon; cả hai có trục tỷ số w không âm.</desc><g font-family="Arial,sans-serif" font-size="27"><line x1="55" y1="275" x2="445" y2="275" stroke="#222" stroke-width="3"/><line x1="80" y1="295" x2="80" y2="45" stroke="#222" stroke-width="3"/><path d="M85 260 Q280 30 435 250" fill="none" stroke="#2f3e7a" stroke-width="7"/><circle cx="280" cy="72" r="9" fill="#b15a2b"/><text x="280" y="35" text-anchor="middle">A &gt; 0</text><text x="280" y="110" text-anchor="middle">w*=1+ε</text><text x="260" y="320" text-anchor="middle">w ≥ 0</text><line x1="515" y1="275" x2="905" y2="275" stroke="#222" stroke-width="3"/><line x1="540" y1="295" x2="540" y2="45" stroke="#222" stroke-width="3"/><path d="M545 250 Q690 30 900 260" fill="none" stroke="#2e7d32" stroke-width="7"/><circle cx="690" cy="72" r="9" fill="#b15a2b"/><text x="690" y="35" text-anchor="middle">A &lt; 0</text><text x="690" y="110" text-anchor="middle">w*=1−ε</text><text x="720" y="320" text-anchor="middle">w ≥ 0</text></g></svg>
