<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Mê cung hai phòng</title>
<desc id="d">Lưới hai hàng bốn cột. Hàng trên A, B, C, D; hàng dưới E, F, K, Z. Tường giữa B và C; cạnh F–K là cửa giữa hai phòng; Z là đích, phần thưởng cộng 1. Giá trị tối ưu trong ô: K và D 0,9756; F và C 0,8566; B và E 0,7522; A 0,6604. Đi đúng hướng với xác suất 0,8, trượt và ở yên với xác suất 0,2, gamma 0,9.</desc>
