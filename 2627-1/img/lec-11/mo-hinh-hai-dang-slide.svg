<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 362" width="560" height="362" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hai dạng mô hình với cùng một đầu vào</title>
<desc id="d">Bên trái: hai ô K và Z cạnh nhau, Z là đích và trạng thái kết thúc, giá trị tiếp nối bằng 0. Ô đầu vào (K, phải) có hai mũi tên sang hai khung. Khung trên, mô hình phân phối: trả cả bảng, (Z, +1) với xác suất 0,8 và (K, 0) với xác suất 0,2. Khung dưới, mô hình mẫu: mỗi lần gọi rút một kết cục theo phân phối của mô hình, kết quả ví dụ (K, 0). Chú thích trên hai khung: ví dụ dùng mô hình khớp luật mê cung, đi đúng 0,8, trượt ở yên 0,2.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ars" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="aos" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ags" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ax" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="axs" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><marker id="aks" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><pattern id="van" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#2F3E7A" stroke-width="3.5"/></pattern><pattern id="vano" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B5541B" stroke-width="3.5"/></pattern><pattern id="vanx" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3.5"/></pattern></defs>
<g transform="translate(0,30)">
<rect x="10" y="20" width="86" height="80" rx="0" fill="#FFFFFF" stroke="#8A94AD" stroke-width="1.5"/>
<rect x="96" y="20" width="86" height="80" rx="0" fill="#DCE3F3" stroke="#8A94AD" stroke-width="1.5"/>
<rect x="10" y="20" width="172" height="80" fill="none" stroke="#1d2433" stroke-width="3"/>
<text x="53" y="70" font-size="26" text-anchor="middle" font-weight="bold" fill="#2F3E7A">K</text>
<text x="139" y="70" font-size="26" text-anchor="middle" font-weight="bold" fill="#2F3E7A">Z</text>
<text x="96" y="128" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">Z kết thúc:</text>
<text x="96" y="154" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">giá trị tiếp nối 0</text>
<rect x="10" y="196" width="172" height="64" rx="8" fill="#EEF1F8" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="96" y="224" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">đầu vào</text>
<text x="96" y="250" font-size="22" text-anchor="middle" font-weight="bold" fill="#1d2433">(K, →)</text>
<line x1="184.0" y1="214.0" x2="262.0" y2="96.0" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>
<line x1="184.0" y1="244.0" x2="262.0" y2="262.0" stroke="#1d2433" stroke-width="2.5" marker-end="url(#ak)"/>
<rect x="268" y="10" width="282" height="160" rx="8" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="409" y="40" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">mô hình phân phối</text>
<text x="409" y="66" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">trả cả bảng:</text>
<text x="300" y="104" font-size="21" text-anchor="start" font-weight="normal" fill="#1d2433">(Z, +1)</text>
<text x="518" y="104" font-size="21" text-anchor="end" font-weight="bold" fill="#1d2433">0,8</text>
<text x="300" y="140" font-size="21" text-anchor="start" font-weight="normal" fill="#1d2433">(K, 0)</text>
<text x="518" y="140" font-size="21" text-anchor="end" font-weight="bold" fill="#1d2433">0,2</text>
<rect x="268" y="190" width="282" height="136" rx="8" fill="#FFFFFF" stroke="#B5541B" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="409" y="218" font-size="21" text-anchor="middle" font-weight="bold" fill="#B5541B">mô hình mẫu</text>
<text x="409" y="245" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">mỗi lần gọi rút một kết cục</text>
<text x="409" y="270" font-size="20" text-anchor="middle" font-weight="normal" fill="#1d2433">theo phân phối của mô hình</text>
<text x="409" y="306" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">kết quả ví dụ: (K, 0)</text>
</g>
<rect x="262" y="2" width="294" height="30" rx="4" fill="#F7EFE6" stroke="#B5541B" stroke-width="2"/>
<text x="409" y="24" font-size="20" text-anchor="middle" font-weight="bold" fill="#B5541B">ví dụ: mô hình khớp luật mê cung</text>
</svg>
