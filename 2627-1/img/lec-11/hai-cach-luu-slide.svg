<text x="30" y="75.1" font-size="26" text-anchor="middle" font-weight="bold" fill="#2F3E7A">1</text>
<text x="56" y="75" font-size="26" text-anchor="start" font-weight="normal" fill="#1d2433">(0, A): 1 → 1/2</text>
<circle cx="252" cy="66" r="18.2" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="252" y="75.1" font-size="26" text-anchor="middle" font-weight="bold" fill="#2F3E7A">2</text>
<text x="278" y="75" font-size="26" text-anchor="start" font-weight="normal" fill="#1d2433">(0, B): 1 → 1/2</text>
