<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" role="img" aria-labelledby="t d"><title id="t">Phạm vi suy luận từ độ phẳng tham số</title><desc id="d">Độ phẳng theo tham số nối trực tiếp tới nhiễu tham số; liên hệ với hành động, chuyển tiếp và reward cần điều kiện hoặc bằng chứng thêm.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="30" y="110" width="210" height="90" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="135" y="150">Nhiễu tham số</text><text x="135" y="185">‖ξ‖≤ρ</text><rect x="385" y="110" width="210" height="90" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="490" y="150">Đổi hành động</text><text x="490" y="185">cần Jacobian/rank</text><rect x="740" y="110" width="210" height="90" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="845" y="150">Đổi môi trường</text><text x="845" y="185">cần mô hình/bằng chứng</text><line x1="240" y1="155" x2="375" y2="155" stroke="#888" stroke-width="6" stroke-dasharray="12 8"/><line x1="595" y1="155" x2="730" y2="155" stroke="#888" stroke-width="6" stroke-dasharray="12 8"/></g></svg>
