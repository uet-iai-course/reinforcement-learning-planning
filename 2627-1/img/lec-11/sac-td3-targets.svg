<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 350" role="img" aria-labelledby="t d"><title id="t">Đích critic của SAC và TD3</title><desc id="d">SAC lấy mẫu từ policy và trừ alpha log probability; TD3 làm mượt target actor và lấy min hai target critic.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="30" y="65" width="470" height="220" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="265" y="110">SAC</text><text x="265" y="160">a'∼π(·|s')</text><text x="265" y="205">min Q̄_j(s',a')</text><text x="265" y="250">− α log π(a'|s')</text><rect x="540" y="65" width="470" height="220" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="5"/><text x="775" y="110">TD3</text><text x="775" y="160">a'=clip(μ̄(s')+ε)</text><text x="775" y="205">min Q̄_j(s',a')</text><text x="775" y="250">actor cập nhật trễ</text></g></svg>
