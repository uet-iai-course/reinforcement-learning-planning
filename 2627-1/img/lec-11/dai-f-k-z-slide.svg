<title id="t">Dải F, K, Z sau lượt thứ nhất</title>
<desc id="d">Ba ô F, K, Z nối bằng hai mũi tên. Mũi tên F sang K, phần thưởng 0; dưới mũi tên: lúc đọc K, giá trị còn 0. Mũi tên K sang Z, phần thưởng cộng 1; dưới mũi tên: sau bước này, Q(K, phải) bằng 0,5.</desc>
