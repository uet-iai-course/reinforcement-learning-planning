<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">D4PG và MADDPG mở rộng DDPG theo hai trục</title><desc id="d">D4PG học phân phối return và thu dữ liệu phân tán; MADDPG dùng critic tập trung với actor quan sát cục bộ.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="40" y="70" width="410" height="210" rx="18" fill="#edf4ff" stroke="#2f3e7a" stroke-width="5"/><text x="245" y="115">D4PG</text><text x="245" y="165">Z(s,a): phân phối return</text><text x="245" y="210">n-step + replay ưu tiên</text><text x="245" y="255">nhiều actor thu dữ liệu</text><rect x="550" y="70" width="410" height="210" rx="18" fill="#f7efe6" stroke="#b15a2b" stroke-width="5"/><text x="755" y="115">MADDPG</text><text x="755" y="165">Q_i(x,a_1,…,a_n)</text><text x="755" y="210">actor μ_i(o_i)</text><text x="755" y="255">huấn luyện tập trung</text></g></svg>
