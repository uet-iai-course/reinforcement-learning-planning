<text x="337.5" y="222" font-size="34" text-anchor="middle" font-weight="bold" fill="#2F3E7A">F</text>
<text x="337.5" y="265" font-size="22" text-anchor="middle" font-weight="normal" fill="#1d2433">v* = 0,8566</text>
