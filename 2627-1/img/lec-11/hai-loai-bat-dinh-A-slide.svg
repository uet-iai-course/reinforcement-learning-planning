<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 532" width="620" height="532" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hai loại bất định tại (A, phải), biến cố sang B</title>
<desc id="d">Đồ thị cho biến cố đi sang B khi chọn phải ở A, p bằng 0,8. Trục hoành: số lần thử thật của cặp (A, phải), C, thang log từ 1 đến 50. Trục tung: độ lệch chuẩn từ 0 đến 0,45. Đường ngang liền tại 0,4: một lần thử, căn của p(1 − p), bất định ngẫu nhiên, không đổi theo C. Đường cong nét đứt 0,4 chia căn C: ước lượng p mũ qua C lần thử, bất định nhận thức. Hai mốc: C bằng 2, 0,2828; C bằng 50, 0,0566. Dưới trục: mỗi nhóm 2 lần thử, p mũ bằng 0, 0,5, 1 với xác suất 0,04; 0,32; 0,64, độ lệch chuẩn 0,2828; C bằng 50, 0,0566.</desc>
