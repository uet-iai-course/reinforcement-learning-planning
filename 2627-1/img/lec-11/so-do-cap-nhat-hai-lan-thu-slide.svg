<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 384" width="660" height="384" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Sơ đồ cập nhật kỳ vọng và cập nhật mẫu tại (A, phải)</title>
<desc id="d">Hai sơ đồ tại cặp (A, phải) theo mô hình đếm. Mỗi sơ đồ có nút gốc (A, phải) và hai cạnh, mỗi cạnh xác suất 1/2 từ một lần quan sát, phần thưởng R bằng 0: cạnh tới B ứng với lần thử 2, giả sử max Q bằng 0,6; cạnh tới A ứng với lần thử 1, trượt, giả sử max Q bằng 0,4. Trái, cập nhật kỳ vọng: hai cạnh đậm, 2 lần đánh giá, mục tiêu 0,45. Phải, cập nhật mẫu: một cạnh đậm tới B, cạnh tới A mờ nét đứt, 1 lần đánh giá, mục tiêu 0,54 khi rút B, 0,36 khi rút A.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ars" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="aos" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ags" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ax" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="axs" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><marker id="aks" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><pattern id="van" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#2F3E7A" stroke-width="3.5"/></pattern><pattern id="vano" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B5541B" stroke-width="3.5"/></pattern><pattern id="vanx" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3.5"/></pattern></defs>
<text x="160" y="28" font-size="22" text-anchor="middle" font-weight="bold" fill="#2F3E7A">cập nhật kỳ vọng</text>
<circle cx="160.0" cy="72.0" r="13" fill="#1d2433"/>
<text x="182" y="79" font-size="21" text-anchor="start" font-weight="normal" fill="#1d2433">(A,→)</text>
<line x1="160" y1="85" x2="76" y2="190" stroke="#1d2433" stroke-width="5"/>
<text x="102.0" y="128" font-size="21" text-anchor="end" font-weight="bold" fill="#1d2433">1/2</text>
<text x="102.0" y="154" font-size="21" text-anchor="end" font-weight="normal" fill="#1d2433">R = 0</text>
<circle cx="76" cy="208" r="19" fill="#FFFFFF" stroke="#1d2433" stroke-width="3"/>
<text x="76" y="215" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">B</text>
<circle cx="41" cy="208" r="14.7" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="41" y="215.35" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">2</text>
<text x="76" y="256" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">max Q = 0,6</text>
<line x1="160" y1="85" x2="244" y2="190" stroke="#1d2433" stroke-width="5"/>
<text x="218.0" y="128" font-size="21" text-anchor="start" font-weight="bold" fill="#1d2433">1/2</text>
<text x="218.0" y="154" font-size="21" text-anchor="start" font-weight="normal" fill="#1d2433">R = 0</text>
<circle cx="244" cy="208" r="19" fill="#FFFFFF" stroke="#1d2433" stroke-width="3"/>
<text x="244" y="215" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">A</text>
<circle cx="279" cy="208" r="14.7" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="279" y="215.35" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">1</text>
<text x="244" y="256" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">max Q = 0,4</text>
<text x="160" y="310" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">2 lần đánh giá</text>
<text x="160" y="342" font-size="22" text-anchor="middle" font-weight="bold" fill="#2F3E7A">mục tiêu 0,45</text>
<text x="490" y="28" font-size="22" text-anchor="middle" font-weight="bold" fill="#B5541B">cập nhật mẫu</text>
<circle cx="490.0" cy="72.0" r="13" fill="#1d2433"/>
<text x="512" y="79" font-size="21" text-anchor="start" font-weight="normal" fill="#1d2433">(A,→)</text>
<line x1="490" y1="85" x2="406" y2="190" stroke="#1d2433" stroke-width="5"/>
<text x="432.0" y="128" font-size="21" text-anchor="end" font-weight="bold" fill="#1d2433">1/2</text>
<text x="432.0" y="154" font-size="21" text-anchor="end" font-weight="normal" fill="#1d2433">R = 0</text>
<circle cx="406" cy="208" r="19" fill="#FFFFFF" stroke="#1d2433" stroke-width="3"/>
<text x="406" y="215" font-size="21" text-anchor="middle" font-weight="bold" fill="#1d2433">B</text>
<circle cx="371" cy="208" r="14.7" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="371" y="215.35" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">2</text>
<text x="406" y="256" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">max Q = 0,6</text>
<line x1="490" y1="85" x2="574" y2="190" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
<text x="548.0" y="128" font-size="21" text-anchor="start" font-weight="bold" fill="#6B7280">1/2</text>
<text x="548.0" y="154" font-size="21" text-anchor="start" font-weight="normal" fill="#6B7280">R = 0</text>
<circle cx="574" cy="208" r="19" fill="#FFFFFF" stroke="#6B7280" stroke-width="2" stroke-dasharray="5 4"/>
<text x="574" y="215" font-size="21" text-anchor="middle" font-weight="bold" fill="#6B7280">A</text>
<circle cx="609" cy="208" r="14.7" fill="#FFFFFF" stroke="#6B7280" stroke-width="2.5"/>
<text x="609" y="215.35" font-size="21" text-anchor="middle" font-weight="bold" fill="#6B7280">1</text>
<text x="574" y="256" font-size="21" text-anchor="middle" font-weight="normal" fill="#6B7280">max Q = 0,4</text>
<text x="490" y="310" font-size="21" text-anchor="middle" font-weight="normal" fill="#1d2433">1 lần đánh giá</text>
<text x="490" y="342" font-size="22" text-anchor="middle" font-weight="bold" fill="#B5541B">mục tiêu 0,54 hoặc 0,36</text>
<line x1="330" y1="14" x2="330" y2="350" stroke="#8A94AD" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="330" y="378" font-size="21" text-anchor="middle" font-weight="bold" fill="#2F3E7A">mô hình đếm của (A,→); các giá trị max Q là giả sử</text>
</svg>
