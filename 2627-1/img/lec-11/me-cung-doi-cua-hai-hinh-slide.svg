<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Mê cung trước và sau khi đổi cửa</title>
<desc id="d">Hai mê cung cùng vị trí ô. Trái, trước khi đổi: tường giữa B và C, cửa F–K mở, đường cũ A, B, F, K, Z màu xanh, dài 4. Phải, sau 3 000 bước thật: cạnh F–K thành tường dày có dấu chéo, cạnh B–C mở nét chấm, đường mới A, B, C, D, Z màu xanh lá nét chấm, dài 4. Hai cạnh đổi được đánh dấu cam.</desc>
