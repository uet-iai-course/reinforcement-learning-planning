<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="t d"><title id="t">Đỉnh sắc và vùng phẳng trong lân cận tham số</title><desc id="d">Hai điểm có giá trị danh nghĩa gần nhau nhưng điểm sắc giảm mạnh hơn điểm phẳng khi xét giá trị xấu nhất trong cùng bán kính rho.</desc><g font-family="Arial,sans-serif" font-size="28"><line x1="70" y1="285" x2="900" y2="285" stroke="#222" stroke-width="4"/><line x1="90" y1="300" x2="90" y2="35" stroke="#222" stroke-width="4"/><text x="865" y="325">tham số</text><text x="30" y="55" transform="rotate(-90 30 55)">J</text><path d="M130 270 C250 260 285 55 350 55 C415 55 450 260 540 270" fill="none" stroke="#b15a2b" stroke-width="8"/><path d="M500 265 C590 235 625 95 710 90 C795 95 830 235 900 265" fill="none" stroke="#2f3e7a" stroke-width="8"/><circle cx="350" cy="55" r="10" fill="#b15a2b"/><circle cx="710" cy="90" r="10" fill="#2f3e7a"/><line x1="300" y1="120" x2="400" y2="120" stroke="#b15a2b" stroke-width="4" stroke-dasharray="10 8"/><line x1="620" y1="140" x2="800" y2="140" stroke="#2f3e7a" stroke-width="4" stroke-dasharray="10 8"/><text x="350" y="150" text-anchor="middle">cùng bán kính ρ</text><text x="710" y="170" text-anchor="middle">cùng bán kính ρ</text><text x="350" y="315" text-anchor="middle">đỉnh sắc</text><text x="710" y="315" text-anchor="middle">vùng phẳng</text></g></svg>
