<text x="397" y="78" font-size="28" text-anchor="middle" font-weight="bold" fill="#B5541B">↓</text>
<text x="377.5" y="114" font-size="19" text-anchor="middle" font-weight="normal" fill="#1d2433">0,9756</text>
