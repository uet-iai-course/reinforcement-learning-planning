<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 330" width="440" height="330" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Hai tùy chọn trên mê cung hai phòng</title>
<desc id="d">Mê cung hai hàng bốn cột. Phòng trái A, B, E, F tô nền, tùy chọn omega 1 đi tới cửa, kết thúc tại K; mũi tên: A sang phải, B xuống, E sang phải, F sang phải; hệ số p tới K: F 0,8780; B và E 0,7710; A 0,6769. Phòng phải C, D, K viền nét đứt, tùy chọn omega 2 đi tới đích; mũi tên: C sang phải, D xuống, K sang phải; phần thưởng kỳ vọng r: K và D 0,9756; C 0,8566.</desc>
