<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 452" width="790" height="452" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Sai số của cập nhật mẫu so với mục tiêu kỳ vọng</title>
<desc id="d">Trục hoành: k/b, số lần đánh giá chia cho b, từ 0 đến 2. Trục tung: sai số căn bình phương trung bình so với mục tiêu kỳ vọng của mô hình, từ 0 đến 1. Ba đường cập nhật mẫu căn của (b − 1) chia (b nhân k) với b bằng 2 (liền), 10 (nét đứt), 100 (chấm). Bậc thang xám của cập nhật kỳ vọng: sai số 1 tới k bằng b, rồi về 0. Chấm xám tại (1; 0): 100 trên 100 lượt, tính đúng mục tiêu kỳ vọng. Chấm xanh lá tại (0,1; 0,3146): b bằng 100, k bằng 10, 10 trên 100 lượt đánh giá. Dải xám từ 0 tới 1: chưa hoàn tất cập nhật kỳ vọng; đường xám ở mức 0 từ k/b bằng 1.</desc>
