<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 304" width="450" height="207.3" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Bảng đếm sau lượt thứ nhất</title>
<desc id="d">Mô hình đếm sau lượt thứ nhất: 5 bước thật, 4 cặp đã thử. Cặp (A, phải), C bằng 2, giữ hai thẻ quan sát: thẻ 1, thưởng 0, ở lại A, xác suất 1/2; thẻ 2, thưởng 0, sang B, xác suất 1/2. Cặp (B, xuống), (F, phải), (K, phải) mỗi cặp một thẻ: thưởng 0 sang F; thưởng 0 sang K; thưởng cộng 1 vào Z; xác suất 1. Chú thích: mỗi lần thử ghi một thẻ (R, S phẩy); p mũ đếm thẻ theo ô tới, r mũ lấy trung bình R. Cặp khác: C bằng 0, chưa xác định.</desc>
<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="ao" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ars" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2F3E7A"/></marker><marker id="aos" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#B5541B"/></marker><marker id="ag" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ags" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#2E7D4F"/></marker><marker id="ax" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="axs" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#6B7280"/></marker><marker id="ak" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><marker id="aks" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="14" refY="8" orient="auto-start-reverse"><path d="M0,0 L16,8 L0,16 Z" fill="#1d2433"/></marker><pattern id="van" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#2F3E7A" stroke-width="3.5"/></pattern><pattern id="vano" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B5541B" stroke-width="3.5"/></pattern><pattern id="vanx" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)"><rect width="10" height="10" fill="#FFFFFF"/><line x1="0" y1="0" x2="0" y2="10" stroke="#6B7280" stroke-width="3.5"/></pattern></defs>
<g transform="translate(0,4)">
<text x="4" y="24" font-size="25" text-anchor="start" font-weight="bold" fill="#2F3E7A">mô hình đếm: 5 bước thật,</text>
<text x="4" y="50" font-size="25" text-anchor="start" font-weight="bold" fill="#2F3E7A">4 cặp đã thử</text>
<text x="4" y="100" font-size="25" text-anchor="start" font-weight="bold" fill="#1d2433">(A,→), C = 2</text>
<rect x="4" y="110" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<circle cx="24" cy="128.0" r="17.5" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="24" y="136.75" font-size="25" text-anchor="middle" font-weight="bold" fill="#2F3E7A">1</text>
<text x="44" y="136.75" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">thưởng 0, ở lại A</text>
<text x="310" y="136.75" font-size="25" text-anchor="end" font-weight="bold" fill="#2F3E7A">1/2</text>
<rect x="4" y="152" width="316" height="36" rx="6" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<circle cx="24" cy="170.0" r="17.5" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="24" y="178.75" font-size="25" text-anchor="middle" font-weight="bold" fill="#2F3E7A">2</text>
<text x="44" y="178.75" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">thưởng 0, sang B</text>
<text x="310" y="178.75" font-size="25" text-anchor="end" font-weight="bold" fill="#2F3E7A">1/2</text>
<text x="336" y="24" font-size="25" text-anchor="start" font-weight="bold" fill="#1d2433">(B,↓), C = 1</text>
<rect x="336" y="34" width="320" height="36" rx="6" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<circle cx="356" cy="52.0" r="17.5" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="356" y="60.75" font-size="25" text-anchor="middle" font-weight="bold" fill="#2F3E7A">3</text>
<text x="376" y="60.75" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">thưởng 0, sang F</text>
<text x="646" y="60.75" font-size="25" text-anchor="end" font-weight="bold" fill="#2F3E7A">1</text>
<text x="336" y="100" font-size="25" text-anchor="start" font-weight="bold" fill="#1d2433">(F,→), C = 1</text>
<rect x="336" y="110" width="320" height="36" rx="6" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<circle cx="356" cy="128.0" r="17.5" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="356" y="136.75" font-size="25" text-anchor="middle" font-weight="bold" fill="#2F3E7A">4</text>
<text x="376" y="136.75" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">thưởng 0, sang K</text>
<text x="646" y="136.75" font-size="25" text-anchor="end" font-weight="bold" fill="#2F3E7A">1</text>
<text x="336" y="176" font-size="25" text-anchor="start" font-weight="bold" fill="#1d2433">(K,→), C = 1</text>
<rect x="336" y="186" width="320" height="36" rx="6" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"/>
<circle cx="356" cy="204.0" r="17.5" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2.5"/>
<text x="356" y="212.75" font-size="25" text-anchor="middle" font-weight="bold" fill="#2F3E7A">5</text>
<text x="376" y="212.75" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">thưởng +1, vào Z</text>
<text x="646" y="212.75" font-size="25" text-anchor="end" font-weight="bold" fill="#2F3E7A">1</text>
<text x="4" y="256" font-size="25" text-anchor="start" font-weight="normal" fill="#1d2433">mỗi lần thử ghi một thẻ (R, S′): p̂ đếm thẻ theo ô tới,</text>
<text x="4" y="288" font-size="25" text-anchor="start" font-weight="normal" fill="#6B7280">r̂ lấy trung bình R; cặp khác: C = 0, chưa xác định</text>
</g>
</svg>
