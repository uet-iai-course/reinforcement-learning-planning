<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif" fill="#1d2433">
<title id="t">Một cập nhật Q-planning: ô được đọc và ô được ghi</title>
<desc id="d">Mê cung hai phòng. Ô K viền xanh, nhãn đọc: Q(K, phải) bằng 0,5; mũi tên liền từ K sang Z là mẫu thật. Mũi tên nét đứt màu cam từ F sang K là mẫu từ mô hình, phần thưởng 0, trạng thái kế K. Ô F viền cam, nhãn ghi: Q(F, phải) đổi từ 0 thành 0,225.</desc>
