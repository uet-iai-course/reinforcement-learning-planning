<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Ba mức hiệu chỉnh khác chính sách</title><desc id="d">Tỷ số hành động sửa kỳ vọng tại trạng thái cố định, tích tỷ số sửa quỹ đạo, còn replay cần xử lý sai khác phân bố trạng thái.</desc><g font-family="Arial,sans-serif" font-size="30" text-anchor="middle"><rect x="25" y="95" width="270" height="125" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="160" y="140">Một trạng thái</text><text x="160" y="178">π(a|s)/β(a|s)</text><rect x="365" y="95" width="270" height="125" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="500" y="140">Một quỹ đạo</text><text x="500" y="178">tích các tỷ số</text><rect x="705" y="95" width="270" height="125" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="840" y="140">Replay</text><text x="840" y="178">lệch occupancy</text><text x="500" y="300">support của π phải nằm trong support của β</text></g></svg>
