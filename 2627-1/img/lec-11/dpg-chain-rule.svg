<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Quy tắc dây chuyền của DPG</title><desc id="d">Trạng thái đi qua actor tạo hành động; critic cho gradient hành động; chuyển vị Jacobian actor cho gradient tham số.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#2f3e7a"/></marker></defs><g font-family="Arial,sans-serif" font-size="29" text-anchor="middle"><rect x="35" y="105" width="190" height="95" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="130" y="162">S ∼ d_(ρ₀,γ)^μ</text><rect x="365" y="105" width="230" height="95" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="480" y="145">Actor μ_θ</text><text x="480" y="181">D_θμ ∈ R^(d_a×d_θ)</text><rect x="735" y="105" width="190" height="95" rx="14" fill="#edf4ff" stroke="#2f3e7a" stroke-width="4"/><text x="830" y="145">Critic Q</text><text x="830" y="181">∇_aQ ∈ R^d_a</text><path d="M225 153H355M595 153H725" stroke="#2f3e7a" stroke-width="6" marker-end="url(#m)"/><text x="480" y="280">gradient tham số: D_θμ(S)^T ∇_aQ(S,a)|a=μ(S) ∈ R^d_θ</text></g></svg>
