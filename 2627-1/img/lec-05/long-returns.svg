<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="320" viewBox="0 0 1030 320" role="img" aria-labelledby="title desc">
<title id="title">Hai đường đi có số chuyển khác nhau</title><desc id="desc">Đường thứ nhất S, x3, x4, x5, G có bốn chuyển với thưởng 0, 0, 0, 1. Đường thứ hai S, x1, L có hai chuyển với thưởng 0, âm 1. Nhãn thời gian xác định thưởng cuối là R4 và R2.</desc>
