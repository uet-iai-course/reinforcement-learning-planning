<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="395" viewBox="0 0 1110 395" role="img" aria-labelledby="title desc">
<title id="title">Hai cách hoàn thành mục tiêu cập nhật</title><desc id="desc">Monte Carlo dùng thưởng quan sát trong toàn phần đuôi đến thời điểm kết thúc T. TD dùng thưởng sau một chuyển và bảng ước lượng tại trạng thái kế tiếp. Phần đuôi TD không được mô tả như dữ liệu đã quan sát.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="35" y="55" text-anchor="start" font-size="31" fill="#2F3E7A" font-weight="600">Monte Carlo</text><circle cx="95" cy="120" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="95" y="130" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ</text><circle cx="355" cy="120" r="48" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="355" y="130" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ₊₁</text><rect x="936" y="81" width="78" height="78" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="942" y="87" width="66" height="66" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="975" y="130" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">S<tspan baseline-shift="sub" font-size="22">T</tspan></text><path d="M135 120 L303 120" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M405 120 L662 120" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M716 120 L933 120" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="216" y="87" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">Rₜ₊₁</text><text x="690" y="129" text-anchor="middle" font-size="38" fill="#263238" font-weight="400">…</text><text x="639" y="176" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">Phần đuôi được quan sát đầy đủ</text><text x="35" y="237" text-anchor="start" font-size="31" fill="#2F3E7A" font-weight="600">TD(0)</text><circle cx="95" cy="302" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="95" y="312" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ</text><circle cx="355" cy="302" r="48" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="355" y="312" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ₊₁</text><path d="M135 302 L303 302" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="216" y="269" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">Rₜ₊₁</text><path d="M405 302 L552 302" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="565" y="263" width="460" height="80" rx="10" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="2"/><text x="795.0" y="311.75" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Giá trị ước lượng ở trạng thái sau</text><text x="355" y="370" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">Sau một chuyển</text><text x="975" y="61" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">kết thúc</text></g></svg>