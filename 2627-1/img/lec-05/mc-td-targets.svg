<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="360" viewBox="0 0 1110 360" role="img" aria-labelledby="title desc">
<title id="title">Hai cách hoàn thành mục tiêu cập nhật</title><desc id="desc">Monte Carlo dùng thưởng quan sát trong toàn phần đuôi đến thời điểm kết thúc T. TD dùng thưởng sau một chuyển và bảng ước lượng tại trạng thái kế tiếp. Phần đuôi TD không được mô tả như dữ liệu đã quan sát.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif">
<text x="10" y="36" text-anchor="start" font-size="36" fill="#2F3E7A" font-weight="600">Monte Carlo</text>
<circle cx="95" cy="95" r="40" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="95" y="107" text-anchor="middle" font-size="36" fill="#2F3E7A" font-weight="600">Sₜ</text>
<path d="M139 95 L295 95" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="217" y="78" text-anchor="middle" font-size="34" fill="#263238">Rₜ₊₁</text>
<circle cx="355" cy="95" r="54" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="355" y="107" text-anchor="middle" font-size="36" fill="#2F3E7A" font-weight="600">Sₜ₊₁</text>
<path d="M413 95 L640 95" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="672" y="104" text-anchor="middle" font-size="40" fill="#263238">…</text>
<path d="M705 95 L918 95" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="922" y="52" width="86" height="86" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="929" y="59" width="72" height="72" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="965" y="108" text-anchor="middle" font-size="36" fill="#2F3E7A" font-weight="600">S<tspan baseline-shift="sub" font-size="26">T</tspan></text>
<text x="965" y="36" text-anchor="middle" font-size="32" fill="#263238">kết thúc</text>
<text x="665" y="160" text-anchor="middle" font-size="32" fill="#263238">Phần đuôi được quan sát đầy đủ</text>
<text x="10" y="206" text-anchor="start" font-size="36" fill="#2F3E7A" font-weight="600">TD(0)</text>
<circle cx="95" cy="262" r="40" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="95" y="274" text-anchor="middle" font-size="36" fill="#2F3E7A" font-weight="600">Sₜ</text>
<path d="M139 262 L295 262" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="217" y="245" text-anchor="middle" font-size="34" fill="#263238">Rₜ₊₁</text>
<circle cx="355" cy="262" r="54" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="355" y="274" text-anchor="middle" font-size="36" fill="#2F3E7A" font-weight="600">Sₜ₊₁</text>
<path d="M413 262 L548 262" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/>
<rect x="552" y="212" width="456" height="100" rx="10" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="2"/><text x="780" y="254" text-anchor="middle" font-size="32" fill="#263238">Giá trị ước lượng</text><text x="780" y="294" text-anchor="middle" font-size="32" fill="#263238">ở trạng thái sau</text>
<text x="355" y="352" text-anchor="middle" font-size="30" fill="#263238">Sau một chuyển</text>
</g></svg>
