-width="2"/><text x="980.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">L</text><text x="980.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 3</text><text x="980.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">0</text><text x="4" y="214" text-anchor="start" font-size="32" fill="#263238" font-style="italic">G<tspan baseline-shift="sub" font-size="22">t</tspan></text></g></svg>
