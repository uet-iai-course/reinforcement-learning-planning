<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="222" viewBox="0 0 1080 222" role="img" aria-labelledby="title desc">
<title id="title">Quỹ đạo e₂ và lợi tức tại từng thời điểm</title><desc id="desc">Các nút lần lượt là S, X, S, L tại t = 0 đến 3. Phần thưởng từng chuyển là 0, 0, −1. Hàng G_t ghi lợi tức với gamma bằng 1: −1, −1, −1 và 0 tại trạng thái kết thúc L.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
