<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="270" viewBox="0 0 1110 270" role="img" aria-labelledby="title desc">
<title id="title">Ngẫu nhiên ở chuyển đầu và phần đuôi</title><desc id="desc">Chuyển đầu từ trạng thái hiện tại có phần thưởng và trạng thái sau ngẫu nhiên. Từ trạng thái sau còn nhiều phần đuôi khả dĩ. Monte Carlo dùng phần đuôi đã xảy ra; mục tiêu lý tưởng lấy kỳ vọng phần còn lại. Cây chỉ biểu diễn quan hệ, không gán xác suất hay số liệu thực nghiệm.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><circle cx="75" cy="105" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="75" y="115" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ</text><circle cx="355" cy="105" r="48" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="355" y="115" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">Sₜ₊₁</text><path d="M114 105 L302 105" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="212" y="67" text-anchor="middle" font-size="30" fill="#263238" font-weight="400">Rₜ₊₁</text><path d="M404 105 L585 105 M585 105 L719 36 M585 105 L719 105 M585 105 L719 174" fill="none" stroke="#2F3E7A" stroke-width="3"/><rect x="730" y="12" width="325" height="48" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="892.5" y="44.75" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Phần đuôi thứ nhất</text><rect x="730" y="81" width="325" height="48" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="892.5" y="113.75" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Phần đuôi thứ hai</text><rect x="730" y="150" width="325" height="48" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="892.5" y="182.75" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Các phần đuôi khác</text><text x="215" y="223" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">Chuyển đầu vẫn ngẫu nhiên</text><text x="824" y="242" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">MC dùng đuôi đã xảy ra</text></g></svg>