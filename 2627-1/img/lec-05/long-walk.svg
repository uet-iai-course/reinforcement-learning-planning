<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="266" viewBox="0 0 1160 266" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi dài của bài giảng</title><desc id="desc">Bảy trạng thái L, x1, S, x3, x4, x5, G. Bắt đầu ở S. Từ mỗi trạng thái không kết thúc, xác suất đi phải là 0.8 và trái 0.2. Vào L thưởng âm 1, vào G thưởng dương 1, các chuyển khác thưởng 0. L và G kết thúc với giá trị 0.</desc>
