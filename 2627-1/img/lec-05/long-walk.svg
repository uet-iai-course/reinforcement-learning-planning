<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">Hai quỹ đạo dài có chỉ số thời gian</title><desc id="d">Từ thời điểm t, một quỹ đạo nhận thưởng dương một ở chuyển thứ tư nên return là gamma mũ ba; quỹ đạo kia nhận thưởng âm một ở chuyển thứ hai nên return là âm gamma.</desc><g font-family="Arial" font-size="32"><text x="40" y="55">Tới G:</text><text x="180" y="55">Sₜ</text><text x="360" y="55">Sₜ₊₁</text><text x="540" y="55">Sₜ₊₂</text><text x="720" y="55">Sₜ₊₃</text><text x="900" y="55">G</text><text x="245" y="105">Rₜ₊₁=0</text><text x="425" y="105">Rₜ₊₂=0</text><text x="605" y="105">Rₜ₊₃=0</text><text x="795" y="105">Rₜ₊₄=+1</text><text x="350" y="160" fill="#2E7D32">Gₜ=γ³=0,970299</text><text x="40" y="245">Tới L:</text><text x="180" y="245">Sₜ</text><text x="500" y="245">Sₜ₊₁</text><text x="820" y="245">L</text><text x="310" y="295">Rₜ₊₁=0</text><text x="650" y="295">Rₜ₊₂=−1</text><text x="350" y="350" fill="#A33A1F">Gₜ=−γ=−0,99</text></g><g stroke="#333" stroke-width="5"><path d="M220 65H325"/><path d="M400 65H505"/><path d="M580 65H685"/><path d="M760 65H865"/><path d="M220 255H465"/><path d="M540 255H785"/></g></svg>
