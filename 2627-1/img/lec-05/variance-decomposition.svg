<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Phân rã phương sai của lợi tức tại S trên hai dãy</title>
<desc id="desc">Hai thanh ngang cùng một thang từ 0 đến 0,8. Thanh trên, dãy bốn ô với gamma bằng 1: phương sai của lợi tức bằng 0,726, gồm 0,580 là phương sai của mục tiêu lý tưởng Y sao (tô đặc) và 0,145 là phần do đuôi sau chuyển đầu (gạch chéo), tức 20 phần trăm. Thanh dưới, dãy bảy ô với gamma bằng 0,99: phương sai của lợi tức bằng 0,217, gồm 0,036 là phương sai của Y sao và 0,182 là phần do đuôi, tức 84 phần trăm.</desc>
<defs>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="10" height="10" fill="#FCE3D6"/><line x1="0" y1="0" x2="0" y2="10" stroke="#B8461B" stroke-width="4"/>
</pattern>
</defs>
<rect width="1000" height="330" fill="#FFFFFF"/>
<g font-family="Arial, sans-serif" fill="#263238">
<line x1="250" y1="55" x2="250" y2="235" stroke="#52514E" stroke-width="2"/>
<g stroke="#D9D8D4" stroke-width="1">
<line x1="425" y1="55" x2="425" y2="235"/><line x1="600" y1="55" x2="600" y2="235"/><line x1="775" y1="55" x2="775" y2="235"/><line x1="950" y1="55" x2="950" y2="235"/>
</g>
<g font-size="18" text-anchor="middle" fill="#52514E">
<text x="250" y="258">0</text><text x="425" y="258">0,2</text><text x="600" y="258">0,4</text><text x="775" y="258">0,6</text><text x="950" y="258">0,8</text>
</g>
<text x="600" y="285" font-size="18" text-anchor="middle" fill="#52514E">Phương sai có điều kiện Sₜ = S</text>
<text x="20" y="98" font-size="20" font-weight="600">Dãy bốn ô</text>
<text x="20" y="122" font-size="18" fill="#52514E">γ = 1</text>
<rect x="250" y="75" width="508" height="52" rx="4" fill="#2A78D6"/>
<rect x="760" y="75" width="127" height="52" rx="4" fill="url(#hatch)" stroke="#B8461B" stroke-width="2"/>
<text x="504" y="108" font-size="19" text-anchor="middle" fill="#FFFFFF" font-weight="600">Var(Y*) = 0,580</text>
<text x="897" y="98" font-size="17">0,145</text>
<text x="897" y="120" font-size="17">(20%)</text>
<text x="20" y="188" font-size="20" font-weight="600">Dãy bảy ô</text>
<text x="20" y="212" font-size="18" fill="#52514E">γ = 0,99</text>
<rect x="250" y="165" width="31" height="52" rx="4" fill="#2A78D6"/>
<rect x="283" y="165" width="159" height="52" rx="4" fill="url(#hatch)" stroke="#B8461B" stroke-width="2"/>
<text x="452" y="188" font-size="17">Var(Y*) = 0,036; đuôi 0,182 (84%)</text>
<text x="452" y="210" font-size="17" fill="#52514E">tổng Var(Gₜ) = 0,217</text>
<text x="250" y="40" font-size="17" fill="#52514E">Tổng Var(Gₜ) của dãy bốn ô = 0,726</text>
<rect x="250" y="300" width="22" height="18" rx="3" fill="#2A78D6"/>
<text x="280" y="315" font-size="17">tô đặc: phương sai của mục tiêu lý tưởng Y*</text>
<rect x="640" y="300" width="22" height="18" rx="3" fill="url(#hatch)" stroke="#B8461B" stroke-width="2"/>
<text x="670" y="315" font-size="17">gạch chéo: phần do đuôi sau chuyển đầu</text>
</g>
</svg>
