<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">Hai trục thiết kế Monte Carlo</title><desc id="d">Ma trận hai nhân hai độc lập: hàng là lần ghé đầu tiên hoặc mọi lần ghé; cột là trung bình mẫu hoặc bước học hằng số.</desc><g font-family="Arial" text-anchor="middle"><text x="600" y="48" font-size="34">Quy tắc bước học</text><text x="105" y="250" font-size="34" transform="rotate(-90 105 250)">Quy tắc lần ghé</text><rect x="220" y="80" width="350" height="140" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><rect x="570" y="80" width="350" height="140" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><rect x="220" y="220" width="350" height="140" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><rect x="570" y="220" width="350" height="140" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="395" y="118" font-size="31">lần ghé đầu tiên</text><text x="395" y="162" font-size="31">trung bình mẫu</text><text x="745" y="118" font-size="31">lần ghé đầu tiên</text><text x="745" y="162" font-size="31">α hằng số</text><text x="395" y="258" font-size="31">mọi lần ghé</text><text x="395" y="302" font-size="31">trung bình mẫu</text><text x="745" y="258" font-size="31">mọi lần ghé</text><text x="745" y="302" font-size="31">α hằng số</text><text x="570" y="415" font-size="32">Hai lựa chọn độc lập, không phải ba thuật toán rời nhau</text></g></svg>
