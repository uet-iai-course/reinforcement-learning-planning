<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="245" viewBox="0 0 1060 245" role="img" aria-labelledby="title desc">
<title id="title">Chuỗi ngắn theo chính sách sang phải</title><desc id="desc">Bốn trạng thái theo thứ tự L, S, X, G. Từ S hoặc X, xác suất đi phải 0.8 và trái 0.2. Thưởng khi vào L là âm 1, vào G là dương 1; các chuyển khác thưởng 0. L và G kết thúc, giá trị tiếp nối bằng 0.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><path d="M355 128 L145 128" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="250" y="174" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">0.2; thưởng −1</text><path d="M425 88 L635 88" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="530" y="58" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">0.8; thưởng 0</text><path d="M635 128 L425 128" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="530" y="174" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">0.2; thưởng 0</text><path d="M705 88 L915 88" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="810" y="58" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">0.8; thưởng +1</text><rect x="71" y="69" width="78" height="78" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="77" y="75" width="66" height="66" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="110" y="118" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">L</text><circle cx="390" cy="108" r="39" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="390" y="118" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">S</text><circle cx="670" cy="108" r="39" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="670" y="118" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">X</text><rect x="911" y="69" width="78" height="78" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="917" y="75" width="66" height="66" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="950" y="118" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">G</text><text x="110" y="215" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Kết thúc; V = 0</text><text x="950" y="215" text-anchor="middle" font-size="25" fill="#263238" font-weight="400">Kết thúc; V = 0</text></g></svg>