<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">Môi trường đi bộ ngắn</title><desc id="d">Bốn trạng thái kề nhau L, S, x và G. Từ mỗi trạng thái không kết thúc, chuyển thực tế sang ô phải có xác suất 0,8 và sang ô trái có xác suất 0,2. L và G kết thúc với thưởng âm một và dương một khi đi vào.</desc><defs><marker id="ar" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#B15A2B"/></marker><marker id="al" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2F3E7A"/></marker></defs><g font-family="Arial" font-size="36" text-anchor="middle"><rect x="80" y="105" width="190" height="120" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><rect x="270" y="105" width="190" height="120" fill="#fff" stroke="#333" stroke-width="4"/><rect x="460" y="105" width="190" height="120" fill="#fff" stroke="#333" stroke-width="4"/><rect x="650" y="105" width="190" height="120" rx="14" fill="#EEF7EE" stroke="#2E7D32" stroke-width="5"/><text x="175" y="155">L</text><text x="175" y="198">−1</text><text x="365" y="178">S</text><text x="555" y="178">x</text><text x="745" y="155">G</text><text x="745" y="198">+1</text><text x="500" y="48">từ mỗi trạng thái không kết thúc</text><text x="500" y="286" fill="#B15A2B">thực tế sang phải: 0,8</text><text x="500" y="330" fill="#2F3E7A">thực tế sang trái: 0,2</text></g><g fill="none" stroke-width="6"><path d="M335 92H235" stroke="#2F3E7A" marker-end="url(#al)"/><path d="M395 92H495" stroke="#B15A2B" marker-end="url(#ar)"/><path d="M525 238H425" stroke="#2F3E7A" marker-end="url(#al)"/><path d="M585 92H685" stroke="#B15A2B" marker-end="url(#ar)"/></g></svg>
