<svg xmlns="http://www.w3.org/2000/svg" width="1227" height="170" viewBox="0 0 1227 170" role="img" aria-labelledby="title desc">
<title id="title">Từ dữ liệu đến lựa chọn phương pháp</title><desc id="desc">Sáu khối nối tiếp từ trái sang phải, dưới mỗi khối ghi phần tương ứng của chương: dữ liệu (Mục 1), lợi tức Monte Carlo (Mục 2), cập nhật TD một bước (Mục 3), giả thiết về độ chệch, phương sai và hội tụ (Mục 4), dữ liệu cố định với cập nhật theo lô (Mục 5) và lựa chọn phương pháp dự đoán (tình huống áp dụng).</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><rect x="15" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="101.0" y="86" text-anchor="middle" font-size="25" fill="#263238">Dữ liệu</text><text x="101.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Mục 1</text><path d="M187 77 L213 77" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="220" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="306.0" y="71" text-anchor="middle" font-size="25" fill="#263238">Lợi tức</text><text x="306.0" y="102" text-anchor="middle" font-size="25" fill="#263238">Monte Carlo</text><text x="306.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Mục 2</text><path d="M392 77 L418 77" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="425" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="511.0" y="86" text-anchor="middle" font-size="25" fill="#263238">Một bước TD</text><text x="511.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Mục 3</text><path d="M597 77 L623 77" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="630" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="716.0" y="86" text-anchor="middle" font-size="25" fill="#263238">Giả thiết</text><text x="716.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Mục 4</text><path d="M802 77 L828 77" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="835" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="921.0" y="71" text-anchor="middle" font-size="25" fill="#263238">Dữ liệu</text><text x="921.0" y="102" text-anchor="middle" font-size="25" fill="#263238">cố định</text><text x="921.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Mục 5</text><path d="M1007 77 L1033 77" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1040" y="34" width="172" height="86" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="2"/><text x="1126.0" y="86" text-anchor="middle" font-size="25" fill="#263238">Lựa chọn</text><text x="1126.0" y="154" text-anchor="middle" font-size="22" fill="#455A64">Tình huống</text></g>
