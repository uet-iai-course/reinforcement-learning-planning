<svg xmlns="http://www.w3.org/2000/svg" width="1185" height="155" viewBox="0 0 1185 155" role="img" aria-labelledby="title desc">
<title id="title">Từ dữ liệu đến lựa chọn phương pháp</title><desc id="desc">Năm bước nối tiếp: mô tả dữ liệu, tính lợi tức Monte Carlo, cập nhật TD một bước, kiểm giả thiết và lựa chọn phương pháp dự đoán.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
