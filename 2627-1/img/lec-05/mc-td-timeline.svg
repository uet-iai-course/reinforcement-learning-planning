<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="t d"><title id="t">Thời điểm cập nhật Monte Carlo và TD</title><desc id="d">Cùng một quỹ đạo S đến x đến S đến x đến G. TD cập nhật sau từng chuyển; Monte Carlo chờ kết thúc rồi cập nhật các lần ghé đã chọn.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#333"/></marker></defs><g font-family="Arial" font-size="34" text-anchor="middle"><text x="80" y="105">S₀=S</text><text x="310" y="105">S₁=x</text><text x="540" y="105">S₂=S</text><text x="770" y="105">S₃=x</text><text x="1010" y="105">S₄=G</text><g stroke="#333" stroke-width="5" marker-end="url(#a)"><path d="M140 90H245"/><path d="M370 90H475"/><path d="M600 90H705"/><path d="M830 90H945"/></g><text x="195" y="63">R₁=0</text><text x="425" y="63">R₂=0</text><text x="655" y="63">R₃=0</text><text x="890" y="63">R₄=+1</text><text x="80" y="205" fill="#2F3E7A">TD</text><text x="510" y="205">cập nhật tại t=0,1,2,3</text><text x="80" y="310" fill="#B15A2B">MC</text><text x="510" y="310">sau khi thấy G và tính Gₜ</text></g><g stroke-width="7"><path d="M160 190H940" stroke="#2F3E7A"/><path d="M160 295H940" stroke="#B15A2B"/></g></svg>
