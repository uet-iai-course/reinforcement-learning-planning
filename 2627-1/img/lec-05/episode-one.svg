<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="222" viewBox="0 0 1080 222" role="img" aria-labelledby="title desc">
<title id="title">Quỹ đạo e₁ và lợi tức tại từng thời điểm</title><desc id="desc">Các nút lần lượt là S, X, S, X, G tại t = 0 đến 4. Phần thưởng từng chuyển là 0, 0, 0, 1. Hàng G_t ghi lợi tức với gamma bằng 1: 1, 1, 1, 1 và 0 tại trạng thái kết thúc G. Ngoặc nét đứt phía trên đánh dấu phần đuôi sau t = 1, gồm ba chuyển từ X đến G với tổng thưởng 0 + 0 + 1 = 1.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="4" y="30" text-anchor="start" font-size="32" fill="#263238" font-weight="600">e₁</text><path d="M320.0 50 L320.0 38 L1012.0 38 L1012.0 50" stroke="#263238" stroke-width="2.5" stroke-dasharray="9 6" fill="none"/><text x="666.0" y="28" text-anchor="middle" font-size="32" fill="#263238">phần đuôi sau t = 1</text><path d="M133.0 106 L285.0 106" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="210.0" y="92" text-anchor="middle" font-size="32" fill="#263238">0</text><path d="M353.0 106 L505.0 106" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="430.0" y="92" text-anchor="middle" font-size="32" fill="#263238">0</text><path d="M573.0 106 L725.0 106" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="650.0" y="92" text-anchor="middle" font-size="32" fill="#263238">0</text><path d="M793.0 106 L945.0 106" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="870.0" y="92" text-anchor="middle" font-size="32" fill="#263238">1</text><circle cx="100.0" cy="106" r="32" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="100.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">S</text><text x="100.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 0</text><text x="100.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">1</text><circle cx="320.0" cy="106" r="32" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="320.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">X</text><text x="320.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 1</text><text x="320.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">1</text><circle cx="540.0" cy="106" r="32" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="540.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">S</text><text x="540.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 2</text><text x="540.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">1</text><circle cx="760.0" cy="106" r="32" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="760.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">X</text><text x="760.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 3</text><text x="760.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">1</text><rect x="948.0" y="74" width="64" height="64" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="954.0" y="80" width="52" height="52" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="980.0" y="117" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">G</text><text x="980.0" y="172" text-anchor="middle" font-size="32" fill="#263238">t = 4</text><text x="980.0" y="214" text-anchor="middle" font-size="32" fill="#263238" font-weight="600">0</text><text x="4" y="214" text-anchor="start" font-size="32" fill="#263238" font-style="italic">G<tspan baseline-shift="sub" font-size="22">t</tspan></text></g></svg>
