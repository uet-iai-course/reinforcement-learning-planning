<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="275" viewBox="0 0 1080 275" role="img" aria-labelledby="title desc">
<title id="title">Tiền tố của một lượt chưa kết thúc</title><desc id="desc">Chuyển S đến X có thưởng 0 đã xảy ra. Từ X, phần đuôi chưa quan sát được biểu thị bằng đường nét đứt dẫn về G hoặc L; các đường này không mang xác suất đã biết.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><circle cx="135" cy="100" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="135" y="110" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">S</text><circle cx="425" cy="100" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="425" y="110" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">X</text><path d="M173 100 L386 100" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="280" y="67" text-anchor="middle" font-size="29" fill="#263238" font-weight="400">thưởng 0</text><path d="M463 100 L650 100 L835 45 M650 100 L835 170" stroke="#2F3E7A" stroke-width="3" stroke-dasharray="9 7" fill="none"/><rect x="849" y="9" width="72" height="72" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="855" y="15" width="60" height="60" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="885" y="55" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">G</text><rect x="849" y="134" width="72" height="72" rx="7" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><rect x="855" y="140" width="60" height="60" rx="3" fill="none" stroke="#B15A2B" stroke-width="2"/><text x="885" y="180" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">L</text><text x="653" y="231" text-anchor="middle" font-size="30" fill="#263238" font-weight="400">Phần đuôi chưa quan sát</text><text x="280" y="164" text-anchor="middle" font-size="29" fill="#B15A2B" font-weight="400">Đã quan sát</text></g></svg>