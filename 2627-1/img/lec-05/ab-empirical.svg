<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="256" viewBox="0 0 1160 256" role="img" aria-labelledby="title desc">
<title id="title">Quan hệ Markov ước lượng từ tám lượt</title><desc id="desc">Mô hình thực nghiệm, không phải mô hình thật đã biết: A luôn chuyển đến B với thưởng 0; B kết thúc với thưởng 1 trong sáu trên tám lần và thưởng 0 trong hai trên tám lần. Giá trị ở trạng thái kết thúc bằng 0.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#2F3E7A"/></marker></defs>
<g font-family="Arial, sans-serif"><text x="580" y="32" text-anchor="middle" font-size="29" fill="#263238" font-weight="600">Ước lượng từ tám lượt dữ liệu</text><circle cx="90" cy="120" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="90" y="130" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">A</text><circle cx="430" cy="120" r="36" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="430" y="130" text-anchor="middle" font-size="32" fill="#2F3E7A" font-weight="600">B</text><rect x="952" y="81" width="192" height="78" rx="10" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="2"/><text x="1048.0" y="130.15" text-anchor="middle" font-size="29" fill="#263238" font-weight="400">Kết thúc</text><path d="M130 120 L390 120" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="260" y="85" text-anchor="middle" font-size="28" fill="#263238" font-weight="400">p = 1; thưởng 0</text><path d="M466 105 Q725 -3 949 105" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><path d="M466 138 Q725 246 949 138" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#arr)"/><text x="731" y="116" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">p = 6/8; thưởng 1</text><text x="731" y="224" text-anchor="middle" font-size="27" fill="#263238" font-weight="400">p = 2/8; thưởng 0</text><text x="1048" y="198" text-anchor="middle" font-size="26" fill="#263238" font-weight="400">V = 0</text></g></svg>