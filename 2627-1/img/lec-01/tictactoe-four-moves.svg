<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" role="img" aria-labelledby="t d"><title id="t">Bốn nước hợp lệ của X và giá trị một bước</title><desc id="d">Bên trái là thế cờ s: X ở ô 1 và 5, O ở ô 2, 4 và 8, các ô 3, 6, 7, 9 trống, đến phiên X. Bốn mũi tên dẫn tới bốn thế cờ sau nước của X, trước nước trả lời của O. Nước a bằng 3: kỳ vọng của R cộng v pi bằng 1/3. Nước a bằng 6: bằng 0. Nước a bằng 7: bằng 2/3. Nước a bằng 9: X thắng ngay, phần thưởng cộng 1, giá trị sau kết thúc bằng 0, tổng bằng 1. Kỳ vọng tính khi O chọn đều trên ô trống và X chọn đều ở các phiên sau.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto"><path d="M0 0L20 8L0 16Z" fill="#B15A2B"/></marker></defs><g stroke="#2F3E7A" stroke-width="3"><path d="M120 200V440M200 200V440M40 280H280M40 360H280"/></g><text x="80.0" y="260.16" text-anchor="middle" font-size="56" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="160.0" y="260.16" text-anchor="middle" font-size="56" font-family="Arial, sans-serif" fill="#2E7D32">O</text><text x="240.0" y="249.0" text-anchor="middle" font-size="25" font-family="Arial, sans-serif" fill="#555">3</text><text x="80.0" y="340.16" text-anchor="middle" font-size="56" font-family="Arial, sans-serif" fill="#2E7D32">O</text><text x="160.0" y="340.16" text-anchor="middle" font-size="56" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="240.0" y="329.0" text-anchor="middle" font-size="25" font-family="Arial, sans-serif" fill="#555">6</text><text x="80.0" y="409.0" text-anchor="middle" font-size="25" font-family="Arial, sans-serif" fill="#555">7</text><text x="160.0" y="420.16" text-anchor="middle" font-size="56" font-family="Arial, sans-serif" fill="#2E7D32">O</text><text x="240.0" y="409.0" text-anchor="middle" font-size="25" font-family="Arial, sans-serif" fill="#555">9</text><text x="160" y="470" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">thế cờ s, đến phiên X</text><text x="160" y="500" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">ô trống: 3, 6, 7, 9</text><path d="M290 320 L545 90" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><text x="490" y="75" text-anchor="end" font-size="22" font-family="Arial, sans-serif" fill="#111">a = 3</text><g stroke="#2F3E7A" stroke-width="3"><path d="M600 30V150M640 30V150M560 70H680M560 110H680"/></g><text x="580.0" y="60.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="620.0" y="60.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#2E7D32">O</text><rect x="644" y="34" width="32" height="32" fill="#EADBC8" stroke="#B15A2B" stroke-width="3" stroke-dasharray="6 4"/><text x="660.0" y="60.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="580.0" y="100.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#2E7D32">O</text><text x="620.0" y="100.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="660.0" y="99.0" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#555">6</text><text x="580.0" y="139.0" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#555">7</text><text x="620.0" y="140.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#2E7D32">O</text><text x="660.0" y="139.0" text-anchor="middle" font-size="12" font-family="Arial, sans-serif" fill="#555">9</text><text x="700" y="85" font-size="22" font-family="Arial, sans-serif" fill="#111">kỳ vọng R + vπ = 1/3</text><path d="M290 320 L545 240" stroke="#B15A2B" stroke-width="4" marker-end="url(#a)"/><text x="490" y="225" text-anchor="end" font-size="22" font-family="Arial, sans-serif" fill="#111">a = 6</text><g stroke="#2F3E7A" stroke-width="3"><path d="M600 180V300M640 180V300M56