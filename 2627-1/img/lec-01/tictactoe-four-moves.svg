nchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#2E7D32">O</text><rect x="644" y="564" width="32" height="32" fill="#EADBC8" stroke="#B15A2B" stroke-width="3" stroke-dasharray="6 4"/><text x="660.0" y="590.8" text-anchor="middle" font-size="30" font-family="Arial, sans-serif" fill="#B15A2B">X</text><text x="700" y="535" font-size="22" font-family="Arial, sans-serif" fill="#111">kỳ vọng R + vπ = 1 (thắng ngay)</text><text x="550" y="630" text-anchor="middle" font-size="20" font-family="Arial, sans-serif" fill="#111">O chọn đều trên ô trống; X chọn đều ở các phiên sau; giá trị sau khi kết thúc bằng 0</text></svg>