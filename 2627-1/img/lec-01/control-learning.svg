<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">So sánh điều khiển dựa trên mô hình và học từ tương tác</title><desc id="d">Nhánh trái dùng mô hình cố định để lập kế hoạch; nhánh phải cập nhật quyết định từ dữ liệu tương tác.</desc><g font-family="Arial, sans-serif"><rect x="15" y="20" width="350" height="265" rx="16" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><rect x="395" y="20" width="350" height="265" rx="16" fill="#F7EFE6" stroke="#2E7D32" stroke-width="4"/><text x="190" y="68" text-anchor="middle" font-size="34">Mô hình cố định</text><text x="570" y="68" text-anchor="middle" font-size="34">Học từ tương tác</text><path d="M80 110H300M190 110V160" stroke="#B15A2B" stroke-width="5"/><circle cx="190" cy="176" r="20" fill="#2F3E7A"/><path d="M450 120C495 85 645 85 690 120M690 120C645 160 495 160 450 120" fill="none" stroke="#B15A2B" stroke-width="5"/><circle cx="450" cy="120" r="18" fill="#2F3E7A"/><circle cx="690" cy="120" r="18" fill="#2E7D32"/><text x="190" y="246" text-anchor="middle" font-size="34">suy ra hành động</text><text x="570" y="212" text-anchor="middle" font-size="34">dữ liệu cập nhật</text><text x="570" y="256" text-anchor="middle" font-size="34">quyết định</text></g></svg>
