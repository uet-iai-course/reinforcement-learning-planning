<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">So sánh điều khiển dựa trên mô hình và học từ tương tác</title><desc id="d">Nhánh trái dùng mô hình cố định để lập kế hoạch; nhánh phải cập nhật quyết định từ dữ liệu tương tác.</desc><rect x="30" y="30" width="325" height="240" rx="16" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><rect x="405" y="30" width="325" height="240" rx="16" fill="#F7EFE6" stroke="#2E7D32" stroke-width="4"/><text x="193" y="72" text-anchor="middle" font-size="30">Mô hình cố định</text><text x="567" y="72" text-anchor="middle" font-size="30">Học từ tương tác</text><path d="M90 125H295M193 125V195" stroke="#B15A2B" stroke-width="5"/><circle cx="193" cy="210" r="24" fill="#2F3E7A"/><path d="M455 125C500 80 635 80 680 125M680 125C635 195 500 195 455 125" fill="none" stroke="#B15A2B" stroke-width="5"/><circle cx="455" cy="125" r="22" fill="#2F3E7A"/><circle cx="680" cy="125" r="22" fill="#2E7D32"/><text x="193" y="255" text-anchor="middle" font-size="30">suy ra hành động</text><text x="567" y="242" text-anchor="middle" font-size="30">dữ liệu cập nhật quyết định</text></svg>
