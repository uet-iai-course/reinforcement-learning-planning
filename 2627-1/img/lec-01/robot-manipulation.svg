<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d"><title id="t">Hai dạng thao tác robot</title><desc id="d">Bên trái, cánh tay robot đưa bộ kẹp đến các khối trên bàn để gắp và sắp xếp. Bên phải, ba ngón robot giữ một khối lập phương để đổi tư thế của nó.</desc><g font-family="Arial, sans-serif"><text x="250" y="48" text-anchor="middle" font-size="50">Gắp và sắp xếp</text><text x="750" y="48" text-anchor="middle" font-size="50">Đổi tư thế vật</text><g transform="translate(0 30)"><rect x="35" y="165" width="430" height="24" rx="8" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="5"/><rect x="60" y="117" width="54" height="48" fill="#B15A2B"/><rect x="130" y="131" width="50" height="34" fill="#2E7D32"/><circle cx="350" cy="147" r="35" fill="#2F3E7A"/><path d="M350 113L300 70L245 117" fill="none" stroke="#2F3E7A" stroke-width="20" stroke-linecap="round"/><path d="M245 117L205 147M245 117L265 161" stroke="#B15A2B" stroke-width="10"/></g><g transform="translate(500 30)"><rect x="205" y="81" width="90" height="90" rx="8" fill="#F7EFE6" stroke="#B15A2B" stroke-width="7" transform="rotate(12 250 126)"/><path d="M100 57C150 60 175 85 205 103M400 57C350 60 325 85 295 103M125 183C170 175 190 155 210 143" fill="none" stroke="#2F3E7A" stroke-width="22" stroke-linecap="round"/></g></g></svg>
