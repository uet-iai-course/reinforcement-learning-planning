<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" role="img" aria-labelledby="t d"><title id="t">Học giá trị thế cờ từ một ván Tic-tac-toe</title><desc id="d">Dãy thế cờ của một ván vẽ từ trái sang phải: thế cờ ban đầu a, rồi b, c, d, e, f, g. Các bước xen kẽ nước của đối thủ O (a sang b, c sang d, e sang f) và nước của X (b sang c, d sang e, f sang g). Đường liền là các nước đã đi; đường chấm là các nước khác được xét nhưng không đi. Dấu sao đánh dấu nước đang được đánh giá cao nhất: c trùng c sao, g trùng g sao; ở thế cờ d, nước dẫn tới e sao được đánh giá cao nhất nhưng X chọn e, một nước thăm dò. Hai mũi tên cong là cập nhật giá trị: từ c về a và từ g về e; không có cập nhật ngược sau nước thăm dò e.</desc><defs><marker id="r" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto"><path d="M0 0L20 8L0 16Z" fill="#C62828"/></marker></defs><g font-family="Arial, sans-serif"><g font-size="32" text-anchor="middle"><text x="155" y="38">O đi</text><text x="305" y="38">X đi</text><text x="455" y="38">O đi</text><text x="605" y="38">X đi</text><text x="755" y="38">O đi</text><text x="905" y="38">X đi</text></g><g stroke="#666" stroke-width="3" stroke-dasharray="7 6" fill="none"><path d="M230 250L380 110M230 250L380 160M230 250L380 200"/><path d="M830 250L980 110M830 250L980 160M830 250L980 200"/><path d="M530 250L680 330M530 250L600 380M530 250L680 400"/></g><path d="M80 250H980" stroke="#222" stroke-width="5"/><g fill="#222"><circle cx="80" cy="250" r="11"/><circle cx="230" cy="250" r="11"/><circle cx="380" cy="250" r="11"/><circle cx="530" cy="250" r="11"/><circle cx="680" cy="250" r="11"/><circle cx="830" cy="250" r="11"/><circle cx="980" cy="250" r="11"/></g><circle cx="600" cy="380" r="12" fill="#fff" stroke="#222" stroke-width="4"/><g font-size="36"><text x="72" y="292">a</text><text x="222" y="292">b</text><text x="360" y="292">c, c*</text><text x="522" y="292">d</text><text x="692" y="240">e</text><text x="556" y="422">e*</text><text x="822" y="292">f</text><text x="985" y="236">g, g*</text></g><text x="30" y="332" font-size="30">ban đầu</text><path d="M380 238C350 70 110 70 84 234" fill="none" stroke="#C62828" stroke-width="5" marker-end="url(#r)"/><path d="M980 264C960 440 720 440 684 266" fill="none" stroke="#C62828" stroke-width="5" marker-end="url(#r)"/></g></svg>
