<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d"><title id="t">Các thành phần của tác tử học tăng cường</title><desc id="d">Chính sách và hàm giá trị là hai thành phần trung tâm; mô hình môi trường là tùy chọn.</desc><g font-size="31" text-anchor="middle" font-family="Arial, sans-serif"><rect x="25" y="70" width="300" height="165" rx="18" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="5"/><rect x="350" y="70" width="300" height="165" rx="18" fill="#F7EFE6" stroke="#2E7D32" stroke-width="5"/><rect x="675" y="70" width="300" height="165" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5" stroke-dasharray="12 8"/><text x="175" y="140">Chính sách</text><text x="175" y="190">chọn hành động</text><text x="500" y="140">Hàm giá trị</text><text x="500" y="190">đánh giá tương lai</text><text x="825" y="140">Mô hình</text><text x="825" y="190">tùy chọn</text></g></svg>
