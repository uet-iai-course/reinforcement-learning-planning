<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Cây tìm kiếm Tic-tac-toe cụ thể</title><desc id="d">Thế cờ gốc của X phân nhánh theo ba nước hợp lệ 3, 7 và 9; nước 9 tạo trạng thái thắng.</desc><defs><g id="mini" fill="none" stroke="#2F3E7A" stroke-width="3"><path d="M32 0V96M64 0V96M0 32H96M0 64H96"/></g><g id="rootmarks" font-size="30" text-anchor="middle"><text x="16" y="25" fill="#B15A2B">X</text><text x="48" y="25" fill="#2E7D32">O</text><text x="16" y="57" fill="#2E7D32">O</text><text x="48" y="57" fill="#B15A2B">X</text><text x="48" y="89" fill="#2F3E7A">O</text></g></defs><g stroke="#B15A2B" stroke-width="5"><path d="M480 146L175 225M480 146V225M480 146L785 225"/></g><g font-family="Arial, sans-serif"><text x="480" y="30" text-anchor="middle" font-size="31">Sₜ</text><g transform="translate(432 42)"><use href="#mini"/><use href="#rootmarks"/></g><g transform="translate(127 240)"><use href="#mini"/><use href="#rootmarks"/><text x="80" y="25" fill="#B15A2B" font-size="30" text-anchor="middle">X</text></g><g transform="translate(432 240)"><use href="#mini"/><use href="#rootmarks"/><text x="16" y="89" fill="#B15A2B" font-size="30" text-anchor="middle">X</text></g><g transform="translate(737 240)"><use href="#mini"/><use href="#rootmarks"/><text x="80" y="89" fill="#B15A2B" font-size="30" text-anchor="middle">X</text><path d="M5 5L91 91" stroke="#B15A2B" stroke-width="5"/></g><g font-size="31" text-anchor="middle"><text x="175" y="220">a = 3</text><text x="480" y="220">a = 7</text><text x="785" y="220">a = 9 · thắng</text></g></g></svg>
