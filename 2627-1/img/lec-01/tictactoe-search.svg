<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" role="img" aria-labelledby="t d"><title id="t">Cây trò chơi Tic-tac-toe từ thế cờ bốn ô trống</title><desc id="d">Gốc là thế cờ s: X ở ô 1 và 5, O ở ô 2, 4 và 8, các ô 3, 6, 7, 9 trống, đến phiên X. Bốn cạnh ứng với bốn nước hợp lệ a bằng 3, 6, 7, 9, dẫn tới bốn thế cờ sau nước của X, ô vừa đánh được đóng khung đứt nét. Nước 9 tạo đường chéo 1, 5, 9: X thắng và lượt kết thúc. Mỗi nước 3, 6, 7 có ba nhánh con là ba nước trả lời của O: sau nước 3, O đánh 6, 7 hoặc 9; sau nước 6, O đánh 3, 7 hoặc 9; sau nước 7, O đánh 3, 6 hoặc 9.</desc><g font-family="Arial, sans-serif"><g stroke="#2F3E7A" stroke-width="3"><path d="M485.0 46V136M515.0 46V136M455.0 76H545.0M455.0 106H545.0"/></g><text x="470.0" y="70.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="500.0" y="70.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="470.0" y="100.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="500.0" y="100.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="500.0" y="130.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="500.0" y="38" text-anchor="middle" font-size="30">thế cờ s, đến phiên X</text><path d="M500.0 140L140 164" stroke="#B15A2B" stroke-width="4"/><text x="83.0" y="225.0" text-anchor="end" font-size="30">a = 3</text><g stroke="#2F3E7A" stroke-width="3"><path d="M125.0 170V260M155.0 170V260M95.0 200H185.0M95.0 230H185.0"/></g><text x="110.0" y="194.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="140.0" y="194.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><rect x="158.0" y="173" width="24" height="24" fill="#EADBC8" stroke="#B15A2B" stroke-width="2.5" stroke-dasharray="5 3"/><text x="170.0" y="194.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="110.0" y="224.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="140.0" y="224.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="140.0" y="254.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><path d="M140 264L74 298" stroke="#2E7D32" stroke-width="3"/><circle cx="74" cy="312" r="21" fill="#F7EFE6" stroke="#2E7D32" stroke-width="3"/><text x="74" y="321" text-anchor="middle" font-size="26">6</text><path d="M140 264L140 298" stroke="#2E7D32" stroke-width="3"/><circle cx="140" cy="312" r="21" fill="#F7EFE6" stroke="#2E7D32" stroke-width="3"/><text x="140" y="321" text-anchor="middle" font-size="26">7</text><path d="M140 264L206 298" stroke="#2E7D32" stroke-width="3"/><circle cx="206" cy="312" r="21" fill="#F7EFE6" stroke="#2E7D32" stroke-width="3"/><text x="206" y="321" text-anchor="middle" font-size="26">9</text><text x="140" y="360" text-anchor="middle" font-size="26">nước của O</text><path d="M500.0 140L380 164" stroke="#B15A2B" stroke-width="4"/><text x="323.0" y="225.0" text-anchor="end" font-size="30">a = 6</text><g stroke="#2F3E7A" stroke-width="3"><path d="M365.0 170V260M395.0 170V260M335.0 200H425.0M335.0 230H425.0"/></g><text x="350.0" y="194.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="380.0" y="194.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="350.0" y="224.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><text x="380.0" y="224.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><rect x="398.0" y="203" width="24" height="24" fill="#EADBC8" stroke="#B15A2B" stroke-width="2.5" stroke-dasharray="5 3"/><text x="410.0" y="224.0" text-anchor="middle" font-size="25" fill="#B15A2B">X</text><text x="380.0" y="254.0" text-anchor="middle" font-size="25" fill="#2E7D32">O</text><path d="M380 264L314 298" stroke="#2E7D32" stroke-width="3"/><circle cx="314" cy="312" r="21" fill="#F7EFE6" stroke="#2E7D32" stroke-width="3"/><text x="314" y="321" text-anchor="middle" font-size="26">3</text><path d="M380 264L380 298" stroke="#2E7D32" stroke-width="3"/><circle