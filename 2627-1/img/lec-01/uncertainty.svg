<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d"><title id="t">Quyết định dưới bất định</title><desc id="d">Một trạng thái sau một hành động có thể dẫn đến ba kết quả với xác suất p một, p hai, p ba có tổng bằng một.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g font-family="Arial, sans-serif"><circle cx="130" cy="170" r="105" fill="#2F3E7A"/><text x="130" y="182" fill="white" text-anchor="middle" font-size="36">trạng thái</text><path d="M236 150L662 62" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><path d="M236 170L662 170" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><path d="M236 190L662 278" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><g fill="#F7EFE6" stroke="#2E7D32" stroke-width="5"><circle cx="730" cy="50" r="46"/><circle cx="730" cy="170" r="46"/><circle cx="730" cy="290" r="46"/></g><g font-size="44"><text x="430" y="84">p₁</text><text x="430" y="156">p₂</text><text x="430" y="280">p₃</text></g><text x="450" y="352" text-anchor="middle" font-size="40">p₁ + p₂ + p₃ = 1</text></g></svg>
