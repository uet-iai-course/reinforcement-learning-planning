<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d"><title id="t">Quyết định dưới bất định</title><desc id="d">Một trạng thái sau một hành động có thể dẫn đến ba kết quả với xác suất p một, p hai, p ba có tổng bằng một.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><circle cx="150" cy="165" r="62" fill="#2F3E7A"/><text x="150" y="176" fill="white" text-anchor="middle" font-size="32">trạng thái</text><path d="M212 150L655 62M212 165L655 165M212 180L655 268" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><g fill="#F7EFE6" stroke="#2E7D32" stroke-width="5"><circle cx="720" cy="50" r="46"/><circle cx="720" cy="165" r="46"/><circle cx="720" cy="280" r="46"/></g><g font-size="32"><text x="440" y="80">p₁</text><text x="440" y="154">p₂</text><text x="440" y="270">p₃</text><text x="450" y="320" text-anchor="middle">p₁ + p₂ + p₃ = 1</text></g></svg>
