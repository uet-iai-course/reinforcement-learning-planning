<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Ba dạng tín hiệu học</title><desc id="d">Học có giám sát dùng nhãn trực tiếp, học không giám sát dùng cấu trúc dữ liệu, học tăng cường dùng phần thưởng trễ từ tương tác.</desc><g font-size="31" text-anchor="middle" font-family="Arial, sans-serif"><g fill="#F7EFE6" stroke-width="4"><rect x="20" y="55" width="300" height="215" rx="16" stroke="#2F3E7A"/><rect x="350" y="55" width="300" height="215" rx="16" stroke="#2E7D32"/><rect x="680" y="55" width="300" height="215" rx="16" stroke="#B15A2B"/></g><text x="170" y="110">Có giám sát</text><text x="170" y="175">nhãn trực tiếp</text><text x="500" y="110">Không giám sát</text><text x="500" y="175">cấu trúc dữ liệu</text><text x="830" y="110">Tăng cường</text><text x="830" y="165">tương tác</text><text x="830" y="210">thưởng trễ</text></g></svg>
