<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="t d"><title id="t">Ba trạng thái kế tiếp của cùng một thế cờ</title><desc id="d">Ba bàn cờ sau các nước X vào ô 3, 7 và 9. Nước 9 tạo đường chéo thắng. Cả ba được đánh giá bằng hàm V pi dưới cùng chính sách pi.</desc><defs><g id="grid" fill="none" stroke="#2F3E7A" stroke-width="5"><path d="M70 0V210M140 0V210M0 70H210M0 140H210"/></g></defs><g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(45 70)"><use href="#grid"/><g font-size="45"><text x="35" y="52" fill="#B15A2B">X</text><text x="105" y="52" fill="#2E7D32">O</text><text x="175" y="52" fill="#B15A2B">X</text><text x="35" y="122" fill="#2E7D32">O</text><text x="105" y="122" fill="#B15A2B">X</text><text x="105" y="192" fill="#2F3E7A">O</text></g></g><g transform="translate(375 70)"><use href="#grid"/><g font-size="45"><text x="35" y="52" fill="#B15A2B">X</text><text x="105" y="52" fill="#2E7D32">O</text><text x="35" y="122" fill="#2E7D32">O</text><text x="105" y="122" fill="#B15A2B">X</text><text x="35" y="192" fill="#B15A2B">X</text><text x="105" y="192" fill="#2F3E7A">O</text></g></g><g transform="translate(705 70)"><use href="#grid"/><g font-size="45"><text x="35" y="52" fill="#B15A2B">X</text><text x="105" y="52" fill="#2E7D32">O</text><text x="35" y="122" fill="#2E7D32">O</text><text x="105" y="122" fill="#B15A2B">X</text><text x="105" y="192" fill="#2F3E7A">O</text><text x="175" y="192" fill="#B15A2B">X</text></g><path d="M15 15L195 195" stroke="#B15A2B" stroke-width="8"/></g><g font-size="32"><text x="150" y="42">a = 3</text><text x="480" y="42">a = 7</text><text x="810" y="42">a = 9 · thắng</text><text x="150" y="335">R = 0 · Vπ(S′₃)</text><text x="480" y="335">R = 0 · Vπ(S′₇)</text><text x="810" y="335">R = +1 · kết thúc</text></g></g></svg>
