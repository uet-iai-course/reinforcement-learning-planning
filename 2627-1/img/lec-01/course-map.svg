<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d"><title id="t">Bản đồ học phần trong nguồn</title><desc id="d">Lộ trình trong bản nguồn từ nhập môn qua học tăng cường, thi giữa kỳ và dự án, rồi các chủ đề nâng cao.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"><rect x="20" y="90" width="230" height="140" rx="14"/><rect x="325" y="90" width="230" height="140" rx="14"/><rect x="630" y="90" width="230" height="140" rx="14"/><rect x="935" y="55" width="245" height="210" rx="14"/></g><g stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><path d="M250 160H312"/><path d="M555 160H617"/><path d="M860 160H922"/></g><g font-size="30" text-anchor="middle" font-family="Arial, sans-serif"><text x="135" y="145">Nhập môn</text><text x="135" y="190">Tuần 1</text><text x="440" y="140">Học tăng cường</text><text x="440" y="188">Tuần 2–9</text><text x="745" y="140">Thi giữa kỳ</text><text x="745" y="188">và dự án</text><text x="1057" y="105">Học tăng cường sâu</text><text x="1057" y="155">Lý thuyết trò chơi</text><text x="1057" y="205">Lập kế hoạch</text></g></svg>
