<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="t d"><title id="t">Các lĩnh vực liên quan đến học tăng cường</title><desc id="d">Học tăng cường liên hệ với khoa học máy tính, kỹ thuật, toán học, kinh tế học, tâm lý học và thần kinh học.</desc><g font-size="31" text-anchor="middle" font-family="Arial, sans-serif"><circle cx="500" cy="195" r="92" fill="#2F3E7A"/><text x="500" y="187" fill="white">Học</text><text x="500" y="226" fill="white">tăng cường</text><g fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"><rect x="25" y="40" width="270" height="72" rx="15"/><rect x="365" y="20" width="270" height="72" rx="15"/><rect x="705" y="40" width="270" height="72" rx="15"/><rect x="25" y="278" width="270" height="72" rx="15"/><rect x="365" y="298" width="270" height="72" rx="15"/><rect x="705" y="278" width="270" height="72" rx="15"/></g><text x="160" y="86">Khoa học máy tính</text><text x="500" y="67">Thần kinh học</text><text x="840" y="86">Tâm lý học</text><text x="160" y="325">Kỹ thuật</text><text x="500" y="345">Toán học</text><text x="840" y="325">Kinh tế học</text></g></svg>
