<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 420" role="img" aria-labelledby="t d"><title id="t">Bàn cờ Tic-tac-toe và các hành động hợp lệ</title><desc id="d">Bàn cờ có hai quân X, ba quân O và bốn ô trống. Chỉ các ô trống 3, 6, 7 và 9 mang số hành động.</desc><g stroke="#2F3E7A" stroke-width="7"><path d="M180 40V380M340 40V380M20 150H500M20 270H500"/></g><g font-size="88" text-anchor="middle" font-family="Arial, sans-serif"><text x="100" y="125" fill="#B15A2B">X</text><text x="260" y="125" fill="#2E7D32">O</text><text x="100" y="245" fill="#2E7D32">O</text><text x="260" y="245" fill="#B15A2B">X</text><text x="260" y="365" fill="#2F3E7A">O</text></g><g font-size="42" text-anchor="middle" fill="#555" font-family="Arial, sans-serif"><text x="420" y="112">3</text><text x="420" y="232">6</text><text x="100" y="352">7</text><text x="420" y="352">9</text></g></svg>
