<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-labelledby="t d"><title id="t">Robot dọn dãy bốn ô</title><desc id="d">Bốn ô sàn xếp thành một hàng, đánh số 1 đến 4 từ trái sang phải. Robot đứng ở ô 1. Chỉ ô 4 có rác. Hành động trái và phải dịch robot một ô, hút làm sạch ô đang đứng. Hút ở ô 4 khi còn rác cho phần thưởng cộng 1 và kết thúc lượt; mọi bước khác cho phần thưởng 0. Cảm biến chỉ báo ô đang đứng sạch hay bẩn.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto"><path d="M0 0L20 8L0 16Z" fill="#B15A2B"/></marker></defs><rect x="60" y="95" width="210" height="130" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="165.0" y="265" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#111">ô 1</text><rect x="270" y="95" width="210" height="130" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="375.0" y="265" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#111">ô 2</text><rect x="480" y="95" width="210" height="130" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="585.0" y="265" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#111">ô 3</text><rect x="690" y="95" width="210" height="130" fill="#EADBC8" stroke="#2F3E7A" stroke-width="4"/><text x="795.0" y="265" text-anchor="middle" font-size="28" font-family="Arial, sans-serif" fill="#111">ô 4</text><rect x="105" y="125" width="120" height="70" rx="16" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/><text x="165" y="170" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#111">robot</text><circle cx="750" cy="130" r="6" fill="#B15A2B"/><circle cx="785" cy="150" r="6" fill="#B15A2B"/><circle cx="820" cy="125" r="6" fill="#B15A2B"/><circle cx="845" cy="155" r="6" fill="#B15A2B"/><circle cx="765" cy="165" r="6" fill="#B15A2B"/><circle cx="810" cy="173" r="6" fill="#B15A2B"/><text x="795.0" y="211" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#111">rác</text><path d="M80 32 H190" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><text x="210" y="40" font-size="24" font-family="Arial, sans-serif" fill="#111">phải: sang ô bên phải (ở ô 4 thì đứng yên)</text><text x="210" y="74" font-size="24" font-family="Arial, sans-serif" fill="#111">trái: sang ô bên trái (ở ô 1 thì đứng yên) · hút: hút tại ô đang đứng</text><text x="480" y="316" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">Hút ở ô 4 khi còn rác: phần thưởng +1, lượt kết thúc · bước khác: 0 · cảm biến: sạch hoặc bẩn</text></svg>