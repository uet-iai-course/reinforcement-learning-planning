<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" role="img" aria-labelledby="t d"><title id="t">Phần thưởng trễ trên một quỹ đạo hữu hạn</title><desc id="d">Năm trạng thái S không đến S bốn. Hành động A t tại S t dẫn đến S t cộng một và phần thưởng R t cộng một; ba thưởng đầu bằng không, thưởng cuối bằng một.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g text-anchor="middle" font-family="Arial, sans-serif"><g fill="#F7EFE6" stroke="#2F3E7A" stroke-width="5"><circle cx="80" cy="135" r="42"/><circle cx="290" cy="135" r="42"/><circle cx="500" cy="135" r="42"/><circle cx="710" cy="135" r="42"/><circle cx="920" cy="135" r="42"/></g><g font-size="34" fill="#111"><text x="80" y="146">S₀</text><text x="290" y="146">S₁</text><text x="500" y="146">S₂</text><text x="710" y="146">S₃</text><text x="920" y="146">S₄</text></g><g stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><path d="M122 135H238"/><path d="M332 135H448"/><path d="M542 135H658"/><path d="M752 135H868"/></g><g font-size="31"><text x="185" y="88">A₀</text><text x="395" y="88">A₁</text><text x="605" y="88">A₂</text><text x="815" y="88">A₃</text><text x="185" y="225">R₁ = 0</text><text x="395" y="225">R₂ = 0</text><text x="605" y="225">R₃ = 0</text><text x="815" y="225">R₄ = +1</text></g></g></svg>
