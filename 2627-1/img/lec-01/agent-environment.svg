<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d"><title id="t">Vòng tương tác tác tử và môi trường</title><desc id="d">Tác tử gửi hành động sang môi trường; môi trường trả về quan sát và phần thưởng.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g font-family="Arial, sans-serif"><rect x="55" y="85" width="220" height="120" rx="18" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="5"/><rect x="485" y="85" width="220" height="120" rx="18" fill="#F7EFE6" stroke="#2E7D32" stroke-width="5"/><text x="165" y="155" text-anchor="middle" font-size="30">Tác tử</text><text x="595" y="155" text-anchor="middle" font-size="30">Môi trường</text><path d="M275 115H475" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="380" y="70" text-anchor="middle" font-size="28">hành động</text><path d="M485 175H285" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><text x="380" y="255" text-anchor="middle" font-size="28">quan sát, phần thưởng</text></g></svg>
