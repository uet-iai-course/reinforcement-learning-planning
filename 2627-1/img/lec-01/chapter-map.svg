<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" role="img" aria-labelledby="t d"><title id="t">Cấu trúc của chương</title><desc id="d">Năm khối nối nhau bằng mũi tên từ trái sang phải. Mục 1, tương tác: S t, O t, A t, H t. Mục 2, tín hiệu học: phần thưởng R t+1 không phải nhãn. Mục 3, lợi tức: G t bằng R t+1 cộng G t+1. Mục 4: chính sách pi, giá trị v pi, mô hình, thăm dò và khai thác. Mục 5, Tic-tac-toe: nước khai thác một bước a sao. Dòng trên ghi bài toán trung tâm: chọn hành động khi đánh giá chỉ đến sau cả chuỗi hành động. Dòng dưới ghi: Bài 02 thêm tính Markov và hệ số chiết khấu gamma.</desc><defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto"><path d="M0 0L20 8L0 16Z" fill="#B15A2B"/></marker></defs><text x="550" y="40" text-anchor="middle" font-size="26" font-family="Arial, sans-serif" fill="#111">Bài toán: chọn hành động khi đánh giá chỉ đến sau cả chuỗi hành động</text><rect x="30" y="90" width="180" height="170" rx="14" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="120.0" y="130" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="#2F3E7A">Mục 1</text><text x="120.0" y="175" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">Tương tác</text><text x="120.0" y="215" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" fill="#111">Sₜ, Oₜ, Aₜ, Hₜ</text><path d="M213 175.0 H245" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="250" y="90" width="180" height="170" rx="14" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="340.0" y="130" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="#2F3E7A">Mục 2</text><text x="340.0" y="175" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">Tín hiệu học</text><text x="340.0" y="215" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" fill="#111">Rₜ₊₁ không là nhãn</text><path d="M433 175.0 H465" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="470" y="90" width="180" height="170" rx="14" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="560.0" y="130" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="#2F3E7A">Mục 3</text><text x="560.0" y="175" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">Lợi tức</text><text x="560.0" y="215" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" fill="#111">Gₜ = Rₜ₊₁ + Gₜ₊₁</text><path d="M653 175.0 H685" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="690" y="90" width="180" height="170" rx="14" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="780.0" y="130" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="#2F3E7A">Mục 4</text><text x="780.0" y="175" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">π, vπ, mô hình</text><text x="780.0" y="215" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" fill="#111">thăm dò, khai thác</text><path d="M873 175.0 H905" stroke="#B15A2B" stroke-width="5" marker-end="url(#a)"/><rect x="910" y="90" width="180" height="170" rx="14" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="4"/><text x="1000.0" y="130" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial, sans-serif" fill="#2F3E7A">Mục 5</text><text x="1000.0" y="175" text-anchor="middle" font-size="22" font-family="Arial, sans-serif" fill="#111">Tic-tac-toe</text><text x="1000.0" y="215" text-anchor="middle" font-size="19" font-family="Arial, sans-serif" fill="#111">nước khai thác a*</text><text x="550" y="330" text-anchor="middle" font-size="24" font-family="Arial, sans-serif" fill="#111">Bài 02: tính Markov và hệ số chiết khấu γ</text></svg>