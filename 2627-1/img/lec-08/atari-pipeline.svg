<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" role="img" aria-labelledby="t d"><title id="t">Đường xử lý DQN cho Atari</title><desc id="d">Bốn khung quan sát liên tiếp được tiền xử lý và xếp chồng, đi qua CNN và tạo một giá trị Q cho mỗi hành động rời rạc.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"><rect x="35" y="95" width="155" height="155"/><rect x="55" y="75" width="155" height="155"/><rect x="75" y="55" width="155" height="155"/><rect x="95" y="35" width="155" height="155"/></g><g font-size="34" text-anchor="middle"><text x="142" y="295">4 khung quan sát</text><rect x="340" y="100" width="190" height="90" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="435" y="155">tiền xử lý</text><rect x="625" y="100" width="170" height="90" rx="14" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="710" y="155">CNN</text><rect x="890" y="65" width="200" height="160" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="990" y="110">Q(a₁)</text><text x="990" y="155">Q(a₂)</text><text x="990" y="200">Q(a₃)</text></g><g stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><line x1="250" y1="145" x2="340" y2="145"/><line x1="530" y1="145" x2="625" y2="145"/><line x1="795" y1="145" x2="890" y2="145"/></g><text x="560" y="325" font-size="34" text-anchor="middle">lịch sử ngắn giúp suy ra chuyển động nhưng không bảo đảm Markov</text></svg>
