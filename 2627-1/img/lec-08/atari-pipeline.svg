<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 300" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Đường xử lý đầu vào của DQN cho Atari</title>
<desc id="d">Từ trái sang phải: bốn khung ảnh thô gần nhất; mỗi khung qua bước tiền xử lý; bốn khung đã xử lý xếp chồng thành quan sát O t có kích thước 4 nhân H nhân W; mạng tích chập rồi tầng kết nối đầy đủ; đầu ra là một giá trị Q theta của O t cho mỗi hành động, từ a 1 tới a có chỉ số bằng số hành động.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 Z" fill="#B15A2B"/></marker></defs>
<rect x="52" y="58" width="100" height="100" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="38" y="72" width="100" height="100" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="24" y="86" width="100" height="100" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="10" y="100" width="100" height="100" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/>
<text x="100" y="262" font-size="30" text-anchor="middle">4 khung thô</text>
<line x1="160" y1="150" x2="222" y2="150" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="228" y="105" width="170" height="90" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
<text x="313" y="160" font-size="30" text-anchor="middle">tiền xử lý</text>
<line x1="400" y1="150" x2="462" y2="150" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="512" y="58" width="100" height="100" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><rect x="498" y="72" width="100" height="100" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><rect x="484" y="86" width="100" height="100" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><rect x="470" y="100" width="100" height="100" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/>
<text x="560" y="262" font-size="30" text-anchor="middle"><tspan font-style="italic">O</tspan><tspan font-style="italic" font-size="22" dy="7">t</tspan><tspan dy="-7">: 4 × </tspan><tspan font-style="italic">H</tspan> × <tspan font-style="italic">W</tspan></text>
<line x1="620" y1="150" x2="682" y2="150" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="686" y="95" width="226" height="110" rx="14" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/>
<text x="799" y="143" font-size="30" text-anchor="middle">tích chập,</text>
<text x="799" y="180" font-size="30" text-anchor="middle">kết nối đầy đủ</text>
<line x1="914" y1="150" x2="966" y2="150" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="972" y="60" width="180" height="180" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
<text x="1062" y="108" font-size="28" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="20" dy="6">θ</tspan><tspan dy="-6">(</tspan><tspan font-style="italic">O</tspan><tspan font-style="italic" font-size="20" dy="6">t</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">a</tspan><tspan font-size="20" dy="6">1</tspan><tspan dy="-6">)</tspan></text>
<text x="1062" y="158" font-size="30" text-anchor="middle">⋮</text>
<text x="1062" y="212" font-size="28" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="20" dy="6">θ</tspan><tspan dy="-6">(</tspan><tspan font-style="italic">O</tspan><tspan font-style="italic" font-size="20" dy="6">t</tspan><tspan dy="-6">, </tspan><tspan font-style="italic">a</tspan><tspan font-size="20" dy="6">|𝒜|</tspan><tspan dy="-6">)</tspan></text>
<text x="1062" y="276" font-size="30" text-anchor="middle">|𝒜| giá trị</text>
</svg>
