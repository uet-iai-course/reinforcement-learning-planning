<line x1="460" y1="166" x2="460" y2="178" stroke="#333" stroke-width="2"/><text x="460" y="204" font-size="28" text-anchor="middle" font-style="italic">C</text>
<line x1="760" y1="166" x2="760" y2="178" stroke="#333" stroke-width="2"/><text x="760" y="204" font-size="28" text-anchor="middle" font-style="italic">2C</text>
