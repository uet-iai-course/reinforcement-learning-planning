<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 6 1110 190" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Tham số mạng trực tuyến và mạng mục tiêu theo bước tối ưu</title>
<desc id="d">Trục ngang là bộ đếm bước tối ưu k opt với các mốc 0, C, 2C, 3C. Đường gấp khúc có chấm nhỏ là tham số theta của mạng trực tuyến, đổi sau mỗi bước tối ưu. Đường bậc thang đậm là theta trừ của mạng mục tiêu: tại mốc 0, C và 2C nó nhận đúng giá trị của theta tại mốc đó (vòng tròn rỗng) rồi giữ nằm ngang trong C bước. Chú giải ở góc trên ghi: vòng tròn rỗng là mốc đồng bộ, theta trừ gán bằng theta.</desc>
