<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 214" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Tham số mạng trực tuyến và mạng mục tiêu theo bước tối ưu</title>
<desc id="d">Trục ngang là bộ đếm bước tối ưu k opt với các mốc 0, C, 2C, 3C. Hàng trên: tham số theta của mạng trực tuyến đổi sau mỗi bước tối ưu, vẽ bằng đường gấp khúc. Hàng dưới: tham số theta trừ của mạng mục tiêu là hàm bậc thang, nằm ngang giữa hai mốc và nhảy tại C và 2C. Tại mỗi mốc, mũi tên nét đứt đi từ hàng trên xuống hàng dưới, ghi theta trừ gán bằng theta: sao chép.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#59606B"/></marker></defs>
<text x="20" y="60" font-size="34" font-style="italic" fill="#B15A2B">θ</text>
<text x="20" y="140" font-size="34" font-style="italic" fill="#2F3E7A">θ<tspan font-style="normal" font-size="26" dy="-14">−</tspan></text>
<polyline points="160,66.0 190,73.0 220,62.2 250,55.9 280,66.4 310,67.9 340,55.0 370,54.8 400,65.7 430,61.1 460,49.3 490,54.9 520,63.2 550,53.4 580,45.6 610,55.4 640,58.6 670,46.0 700,44.0 730,55.1 760,52.2 790,39.8 820,43.8 850,53.2 880,44.7 910,35.5 940,44.3 970,49.2 1000,37.1 1030,33.3 1060,44.4" fill="none" stroke="#B15A2B" stroke-width="4"/>
<line x1="160" y1="148" x2="460" y2="148" stroke="#2F3E7A" stroke-width="6"/>
<line x1="460" y1="128" x2="760" y2="128" stroke="#2F3E7A" stroke-width="6"/>
<line x1="760" y1="112" x2="1060" y2="112" stroke="#2F3E7A" stroke-width="6"/>
<line x1="460" y1="148" x2="460" y2="128" stroke="#2F3E7A" stroke-width="6"/>
<line x1="760" y1="128" x2="760" y2="112" stroke="#2F3E7A" stroke-width="6"/>
