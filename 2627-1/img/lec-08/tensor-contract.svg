<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 350" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Kích thước các mảng của một mini-batch Atari</title>
<desc id="d">Hai hàng. Hàng trên: quan sát O kích thước b, 4, H, W vào mạng trực tuyến Q theta, ra mảng b nhân số hành động; phép chọn theo hành động nhận A kích thước b từ ô bên dưới, lấy một phần tử mỗi hàng và cho q kích thước b. Hàng dưới: quan sát kế tiếp O phẩy kích thước b, 4, H, W vào mạng mục tiêu Q theta trừ, ra mảng b nhân số hành động; phép cực đại theo chiều hành động cho mảng kích thước b; cùng R và Z kích thước b từ ô bên trên tạo đích y kích thước b. q và y cùng vào ô hàm mất mát L B, một số vô hướng. Ghi chú dưới cùng: U kích thước b không vào L B.</desc>
