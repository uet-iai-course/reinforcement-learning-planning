<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" role="img" aria-labelledby="t d"><title id="t">Hợp đồng tensor đầy đủ của DQN cho Atari</title><desc id="d">Batch quan sát và quan sát kế tiếp đi qua mạng online và mạng mục tiêu. Gather theo batch hành động tạo q; max theo hành động tạo bootstrap; R và Z tạo y. U chỉ điều khiển reset.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g font-size="34" text-anchor="middle"><rect x="20" y="45" width="190" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="115" y="82">O</text><text x="115" y="118">[b,4,h,w]</text><rect x="250" y="45" width="215" height="88" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="358" y="82">Q online</text><text x="358" y="118">[b,|A|]</text><rect x="505" y="45" width="180" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="595" y="82">gather A</text><text x="595" y="118">q: [b]</text><rect x="20" y="205" width="190" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="115" y="242">O′</text><text x="115" y="278">[b,4,h,w]</text><rect x="250" y="205" width="215" height="88" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="358" y="242">Q mục tiêu</text><text x="358" y="278">[b,|A|]</text><rect x="505" y="205" width="180" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="595" y="242">max theo a′</text><text x="595" y="278">[b]</text><rect x="760" y="125" width="180" height="88" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="850" y="162">R, Z</text><text x="850" y="198">y: [b]</text><rect x="970" y="125" width="130" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="1035" y="162">MSE</text><text x="1035" y="198">scalar</text><rect x="760" y="275" width="340" height="76" rx="12" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="930" y="323">U: bool [b], chỉ reset</text></g><g fill="none" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><line x1="210" y1="89" x2="250" y2="89"/><line x1="465" y1="89" x2="505" y2="89"/><line x1="210" y1="249" x2="250" y2="249"/><line x1="465" y1="249" x2="505" y2="249"/><line x1="685" y1="249" x2="780" y2="213"/><line x1="940" y1="169" x2="970" y2="169"/><line x1="685" y1="89" x2="970" y2="145"/></g><text x="350" y="370" font-size="34" text-anchor="middle">float32 cùng thiết bị; A int64; Z,U bool</text></svg>
