<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Bảng giá trị hành động và mạng có tham số dùng chung</title>
<desc id="d">Bên trái: bảng minh họa 4 hàng, 5 cột; 4 trong 20 ô có mẫu (đánh dấu chấm), 16 ô chưa có mẫu; mỗi ô được lưu độc lập. Bên phải: quan sát o đi vào mạng Q theta, mạng trả về Q theta của o với các hành động a1 đến a4; tham số theta dùng chung cho mọi giá trị.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" refX="20" refY="11" orient="auto"><path d="M0,0 L22,11 L0,22 Z" fill="#B15A2B"/></marker></defs>
<text x="185" y="40" font-size="34" text-anchor="middle" font-weight="700" fill="#2F3E7A">Bảng: mỗi ô độc lập</text>
<rect x="60" y="62" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="110" y="62" width="50" height="50" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><circle cx="135.0" cy="87.0" r="9" fill="#B15A2B"/><rect x="160" y="62" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="210" y="62" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="260" y="62" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="60" y="112" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="110" y="112" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="160" y="112" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="210" y="112" width="50" height="50" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><circle cx="235.0" cy="137.0" r="9" fill="#B15A2B"/><rect x="260" y="112" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="60" y="162" width="50" height="50" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><circle cx="85.0" cy="187.0" r="9" fill="#B15A2B"/><rect x="110" y="162" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="160" y="162" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="210" y="162" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="260" y="162" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="60" y="212" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="110" y="212" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="160" y="212" width="50" height="50" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><circle cx="185.0" cy="237.0" r="9" fill="#B15A2B"/><rect x="210" y="212" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><rect x="260" y="212" width="50" height="50" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/>
<circle cx="18" cy="290" r="10" fill="#B15A2B"/><text x="36" y="301" font-size="32">có mẫu</text>
<rect x="178" y="272" width="34" height="34" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="3"/><text x="220" y="301" font-size="32">chưa có mẫu</text>
<rect x="430" y="125" width="90" height="90" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
<text x="475" y="183" font-size="42" text-anchor="middle" font-style="italic">o</text>
<line x1="522" y1="170" x2="612" y2="170" stroke="#B15A2B" stroke-width="5" marker-end="url(#arr)"/>
<rect x="625" y="18" width="360" height="245" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/>
<text x="805" y="62" font-size="34" text-anchor="middle" font-weight="700" fill="#2F3E7A">Mạng <tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="24" dy="7">θ</tspan></text>
<text x="805" y="118" font-size="34" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="24" dy="7">θ</tspan><tspan dy="-7">(</tspan><tspan font-style="italic">o</tspan>, <tspan font-style="italic">a</tspan><tspan font-size="24" dy="7">1</tspan><tspan dy="-7">)</tspan></text><text x="805" y="160" font-size="34" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="24" dy="7">θ</tspan><tspan dy="-7">(</tspan><tspan font-style="italic">o</tspan>, <tspan font-style="italic">a</tspan><tspan font-size="24" dy="7">2</tspan><tspan dy="-7">)</tspan></text><text x="805" y="202" font-size="34" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="24" dy="7">θ</tspan><tspan dy="-7">(</tspan><tspan font-style="italic">o</tspan>, <tspan font-style="italic">a</tspan><tspan font-size="24" dy="7">3</tspan><tspan dy="-7">)</tspan></text><text x="805" y="244" font-size="34" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-style="italic" font-size="24" dy="7">θ</tspan><tspan dy="-7">(</tspan><tspan font-style="italic">o</tspan>, <tspan font-style="italic">a</tspan><tspan font-size="24" dy="7">4</tspan><tspan dy="-7">)</tspan></text>
<text x="805" y="301" font-size="32" text-anchor="middle">tham số <tspan font-style="italic">θ</tspan> dùng chung</text>
</svg>
