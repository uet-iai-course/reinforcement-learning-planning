<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d"><title id="t">Bảng Q và mạng DQN</title><desc id="d">Bảng Q lưu từng ô riêng, còn DQN nhận một quan sát và xuất một giá trị cho mỗi hành động rời rạc.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#B15A2B"/></marker></defs><rect x="35" y="45" width="330" height="230" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="200" y="85" font-size="36" text-anchor="middle" font-weight="700">Bảng Q</text><path d="M75 110H325M75 160H325M75 210H325M145 110V260M235 110V260" stroke="#2F3E7A" stroke-width="4"/><text x="110" y="145" font-size="34" text-anchor="middle">q₁₁</text><text x="190" y="145" font-size="34" text-anchor="middle">q₁₂</text><text x="280" y="145" font-size="34" text-anchor="middle">q₁₃</text><text x="200" y="300" font-size="34" text-anchor="middle">mỗi ô độc lập</text><rect x="505" y="105" width="150" height="92" rx="14" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="580" y="160" font-size="36" text-anchor="middle">o hoặc s</text><line x1="655" y1="151" x2="735" y2="151" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"/><rect x="745" y="45" width="220" height="230" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="855" y="85" font-size="36" text-anchor="middle" font-weight="700">DQN</text><text x="855" y="130" font-size="34" text-anchor="middle">Q(s,a₁)</text><text x="855" y="175" font-size="34" text-anchor="middle">Q(s,a₂)</text><text x="855" y="220" font-size="34" text-anchor="middle">Q(s,a₃)</text><text x="735" y="300" font-size="34" text-anchor="middle">tham số dùng chung</text></svg>
