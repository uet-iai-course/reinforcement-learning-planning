<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 300" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Đồ thị tính của hàm mất mát DQN trên mini-batch</title>
<desc id="d">Hai hàng. Hàng trên, đường tạo đích, không nhận gradient: O phẩy i vào mạng mục tiêu Q theta trừ, rồi lấy max theo a phẩy; cùng R i và Z i từ ô bên dưới tạo đích y i; y i đi qua ô sg viền nét đứt. Hàng dưới, đường dự đoán, nhận gradient: O i vào mạng trực tuyến Q theta, cho một vector giá trị; phép chọn theo hành động gather nhận A i từ ô bên trên và lấy một phần tử, được q i. Hai mũi tên từ sg của y i và từ q i cùng đi vào ô MSE bên phải.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#B15A2B"/></marker></defs>
<text x="10" y="30" font-size="28" font-weight="700" fill="#2F3E7A">đường tạo đích</text>
<text x="820" y="30" font-size="28" text-anchor="middle" fill="#7A2E12">không gradient</text>
<text x="10" y="290" font-size="28" font-weight="700" fill="#2F3E7A">đường dự đoán</text>
<text x="820" y="290" font-size="28" text-anchor="middle" fill="#7A2E12">nhận gradient</text>

<rect x="10" y="45" width="90" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="55.0" y="85.0" font-size="30" text-anchor="middle"><tspan font-style="italic">O</tspan>′<tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8"> </tspan></text>
<line x1="100" y1="75" x2="128" y2="75" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="130" y="45" width="160" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="210.0" y="85.0" font-size="30" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-size="21" dy="8"><tspan font-style="italic">θ</tspan>−</tspan><tspan dy="-8"> </tspan></text>
<line x1="290" y1="75" x2="328" y2="75" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="330" y="45" width="140" height="60" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="400.0" y="85.0" font-size="30" text-anchor="middle">max<tspan font-size="21" dy="8" font-style="italic">a′</tspan><tspan dy="-8"> </tspan></text>
<line x1="470" y1="75" x2="558" y2="75" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="560" y="45" width="100" height="60" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="610.0" y="85.0" font-size="30" text-anchor="middle"><tspan font-style="italic">y</tspan><tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8"> </tspan></text>
<line x1="660" y1="75" x2="758" y2="75" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="760" y="45" width="120" height="60" rx="10" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="10 7"/><text x="820.0" y="85.0" font-size="30" text-anchor="middle">sg</text>
<rect x="545" y="123" width="130" height="54" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="610.0" y="160.0" font-size="30" text-anchor="middle"><tspan font-style="italic">R</tspan><tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8">,</tspan> <tspan font-style="italic">Z</tspan><tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8"> </tspan></text>
<line x1="610" y1="123" x2="610" y2="107" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="345" y="123" width="110" height="54" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="400.0" y="160.0" font-size="30" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8"> </tspan></text>
<line x1="400" y1="177" x2="400" y2="193" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
