<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-labelledby="t d"><title id="t">Đồ thị tính toán loss DQN theo mini-batch</title><desc id="d">Quan sát kế tiếp đi qua mạng mục tiêu rồi cực đại theo hành động. Phần thưởng và cờ kết thúc kết hợp với giá trị bootstrap để tạo y rồi dừng gradient. Quan sát hiện tại đi qua mạng online; batch hành động A i đi vào gather để chọn một giá trị mỗi hàng trước MSE.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#B15A2B"/></marker></defs><g font-size="34" text-anchor="middle"><rect x="20" y="25" width="155" height="72" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="98" y="71">O′</text><rect x="215" y="25" width="210" height="72" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="320" y="71">Q mục tiêu θ⁻</text><rect x="465" y="25" width="190" height="72" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="560" y="71">max theo a′</text><rect x="710" y="25" width="170" height="72" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="795" y="71">y, dừng</text><rect x="710" y="125" width="170" height="64" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="795" y="167">R, Z</text><rect x="20" y="255" width="155" height="72" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="98" y="301">O</text><rect x="215" y="255" width="210" height="72" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="320" y="301">Q online θ</text><rect x="465" y="255" width="190" height="72" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="560" y="301">gather Aᵢ</text><rect x="710" y="255" width="170" height="72" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="795" y="301">qᵢ</text><rect x="950" y="140" width="150" height="88" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"/><text x="1025" y="195">MSE</text><rect x="445" y="350" width="230" height="50" rx="10" fill="#fff" stroke="#2F3E7A" stroke-width="4"/><text x="560" y="386">A₁:ᵇ, int64 [b]</text></g><g fill="none" stroke="#B15A2B" stroke-width="6" marker-end="url(#a)"><line x1="175" y1="61" x2="215" y2="61"/><line x1="425" y1="61" x2="465" y2="61"/><line x1="655" y1="61" x2="710" y2="61"/><line x1="795" y1="125" x2="795" y2="97"/><line x1="880" y1="61" x2="975" y2="140"/><line x1="175" y1="291" x2="215" y2="291"/><line x1="425" y1="291" x2="465" y2="291"/><line x1="655" y1="291" x2="710" y2="291"/><line x1="880" y1="291" x2="975" y2="228"/><line x1="560" y1="350" x2="560" y2="327"/></g><text x="890" y="115" font-size="34" text-anchor="middle" fill="#A33A1F">không gradient</text></svg>
