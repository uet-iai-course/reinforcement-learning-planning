<line x1="100" y1="225" x2="128" y2="225" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="130" y="195" width="160" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="210.0" y="235.0" font-size="30" text-anchor="middle"><tspan font-style="italic">Q</tspan><tspan font-size="21" dy="8" font-style="italic">θ</tspan><tspan dy="-8"> </tspan></text>
<line x1="290" y1="225" x2="328" y2="225" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="330" y="195" width="140" height="60" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="400.0" y="235.0" font-size="30" text-anchor="middle">gather</text>
<line x1="470" y1="225" x2="758" y2="225" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="760" y="195" width="120" height="60" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="820.0" y="235.0" font-size="30" text-anchor="middle"><tspan font-style="italic">q</tspan><tspan font-size="21" dy="8" font-style="italic">i</tspan><tspan dy="-8"> </tspan></text>
<rect x="980" y="120" width="130" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="1045" y="160" font-size="30" text-anchor="middle">MSE</text>
<line x1="880" y1="75" x2="978" y2="135" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<line x1="880" y1="225" x2="978" y2="165" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
