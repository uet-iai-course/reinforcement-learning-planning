<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 214" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Mini-batch liên tiếp và mini-batch lấy rải trên một quỹ đạo</title>
<desc id="d">Hai hàng, mỗi hàng là 20 bước thời gian t từ 1 đến 20 của cùng một quỹ đạo, vẽ bằng chấm tròn rỗng. Hàng trên, ghi liên tiếp: bốn mẫu chuyển ở t bằng 17, 18, 19, 20 được đánh dấu bằng hình vuông đặc và một ngoặc chung. Hàng dưới, ghi lấy rải: bốn mẫu chuyển ở t bằng 3, 8, 12, 19 được đánh dấu bằng tam giác đặc. Trục dưới cùng ghi các mốc t bằng 1, 5, 10, 15, 20.</desc>
<text x="20" y="72" font-size="30" font-weight="700" fill="#2F3E7A">liên tiếp</text>
<text x="20" y="152" font-size="30" font-weight="700" fill="#2F3E7A">lấy rải</text>
