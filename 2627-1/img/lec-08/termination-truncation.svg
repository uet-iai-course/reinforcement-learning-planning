<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 206" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Hai cờ của một mẫu chuyển và mục tiêu tương ứng</title>
<desc id="d">Quan sát O t, qua hành động A t và phần thưởng R t+1, tới quan sát O t+1. Từ O t+1 có hai nhánh. Nhánh trên, khung viền liền: Z t+1 bằng 1, MDP kết thúc; mục tiêu y t bằng R t+1. Nhánh dưới, khung viền nét đứt: U t+1 bằng 1 và Z t+1 bằng 0, hết giới hạn bước; mục tiêu y t bằng R t+1 cộng gamma nhân max của Q theta trừ tại O t+1. Cả hai nhánh đều đặt lại môi trường.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="18" refY="10" orient="auto"><path d="M0,0 L20,10 L0,20 Z" fill="#B15A2B"/></marker></defs>
<rect x="10" y="74" width="96" height="60" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
<text x="58" y="114" font-size="30" text-anchor="middle"><tspan font-style="italic">O</tspan><tspan font-size="20" dy="7" font-style="italic">t</tspan><tspan dy="-7"> </tspan></text>
<line x1="108" y1="104" x2="236" y2="104" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<text x="172" y="88" font-size="26" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan font-size="20" dy="7" font-style="italic">t</tspan><tspan dy="-7"> </tspan>, <tspan font-style="italic">R</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan></text>
<rect x="240" y="74" width="110" height="60" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/>
<text x="295" y="114" font-size="30" text-anchor="middle"><tspan font-style="italic">O</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan></text>
<line x1="352" y1="94" x2="446" y2="54" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<line x1="352" y1="114" x2="446" y2="154" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<rect x="452" y="6" width="638" height="90" rx="12" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="4"/>
<text x="472" y="42" font-size="28"><tspan font-style="italic">Z</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan> = 1: MDP kết thúc</text>
<text x="472" y="82" font-size="28">mục tiêu <tspan font-style="italic">y</tspan><tspan font-size="20" dy="7" font-style="italic">t</tspan><tspan dy="-7"> </tspan> = <tspan font-style="italic">R</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan></text>
<rect x="452" y="110" width="638" height="90" rx="12" fill="#FFFFFF" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="12 8"/>
<text x="472" y="146" font-size="28"><tspan font-style="italic">U</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan> = 1, <tspan font-style="italic">Z</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan> = 0: hết giới hạn bước</text>
<text x="472" y="186" font-size="28">mục tiêu <tspan font-style="italic">y</tspan><tspan font-size="20" dy="7" font-style="italic">t</tspan><tspan dy="-7"> </tspan> = <tspan font-style="italic">R</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan> + <tspan font-style="italic" font-family="'Noto Serif','Times New Roman',serif">γ</tspan> max <tspan font-style="italic">Q</tspan><tspan font-size="20" dy="7"><tspan font-style="italic">θ</tspan>−</tspan><tspan dy="-7"> </tspan>(<tspan font-style="italic">O</tspan><tspan font-size="20" dy="7" font-style="italic">t+1</tspan><tspan dy="-7"> </tspan>, ·)</text>
</svg>
