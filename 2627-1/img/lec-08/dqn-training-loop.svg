<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 388" role="img" aria-labelledby="t d" font-family="'Source Sans 3','Source Sans Pro','Noto Sans',Arial,sans-serif">
<title id="t">Vòng huấn luyện DQN: thu thập và tối ưu</title>
<desc id="d">Sơ đồ hai vòng. Vòng thu thập bên trái, mỗi bước tăng bộ đếm t: mạng trực tuyến Q theta chọn hành động A theo quy tắc epsilon exp tham lam và gửi cho môi trường; môi trường trả quan sát kế tiếp O phẩy về mạng trực tuyến và gửi mẫu chuyển O, A, R, O phẩy, Z, U vào bộ nhớ phát lại D. Vòng tối ưu bên phải, mỗi bước tăng bộ đếm k opt: rút đều b mẫu từ bộ nhớ thành mini-batch B; mạng mục tiêu Q theta trừ cấp đích y i cho mini-batch; gradient của hàm mất mát L B theo theta cập nhật mạng trực tuyến. Mũi tên nét đứt từ mạng trực tuyến sang mạng mục tiêu: mỗi C bước tối ưu gán theta trừ bằng theta.</desc>
<defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#B15A2B"/></marker><marker id="arrb" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" refX="16" refY="9" orient="auto"><path d="M0,0 L18,9 L0,18 Z" fill="#2F3E7A"/></marker></defs>
<rect x="10" y="165" width="210" height="80" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="115.0" y="215.0" font-size="29" text-anchor="middle">Môi trường</text>
<rect x="430" y="50" width="280" height="80" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="570.0" y="100.0" font-size="29" text-anchor="middle">Mạng trực tuyến <tspan font-style="italic">Q</tspan><tspan font-size="20" dy="7" font-style="italic">θ</tspan><tspan dy="-7"></tspan></text>
<rect x="430" y="260" width="280" height="80" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="570.0" y="310.0" font-size="29" text-anchor="middle">Bộ nhớ phát lại <tspan font-family="'STIX Two Math','Cambria Math','Noto Sans Math',STIXGeneral,serif" font-size="33">𝒟</tspan></text>
<rect x="965" y="50" width="280" height="80" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="1105.0" y="100.0" font-size="29" text-anchor="middle">Mạng mục tiêu <tspan font-style="italic">Q</tspan><tspan font-size="20" dy="7"><tspan font-style="italic">θ</tspan>−</tspan><tspan dy="-7"></tspan></text>
<rect x="965" y="260" width="280" height="80" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><text x="1105.0" y="310.0" font-size="29" text-anchor="middle">Mini&#8209;batch <tspan font-style="italic">B</tspan></text>
<path d="M430,78 C285,62 115,72 115,161" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<text x="250" y="40" font-size="26" text-anchor="middle"><tspan font-style="italic">A</tspan>, <tspan font-style="italic">ε</tspan><tspan font-size="20" dy="7">exp</tspan><tspan dy="-7"></tspan>-tham lam</text>
<path d="M220,192 L476,134" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<text x="372" y="200" font-size="26" text-anchor="middle"><tspan font-style="italic">O</tspan>′</text>
<path d="M220,228 L426,292" fill="none" stroke="#B15A2B" stroke-width="4" marker-end="url(#arr)"/>
<text x="10" y="300" font-size="26" text-anchor="start">lưu (<tspan font-style="italic">O</tspan>, <tspan font-style="italic">A</tspan>, <tspan font-style="italic">R</tspan>, <tspan font-style="italic">O</tspan>′, <tspan font-style="italic">Z</tspan>, <tspan font-style="italic">U</tspan>)</text>
<path d="M710,300 L961,300" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrb)"/>
<text x="837" y="286" font-size="26" text-anchor="middle">rút đều <tspan font-style="italic">b</tspan> mẫu</text>
<path d="M1105,130 L1105,256" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrb)"/>
<text x="1119" y="202" font-size="26" text-anchor="start"><tspan font-style="italic">y</tspan><tspan font-size="20" dy="7" font-style="italic">i</tspan><tspan dy="-7"></tspan></text>
<path d="M1000,260 L692,134" fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrb)"/>
<text x="948" y="186" font-size="26" text-anchor="middle">∇<tspan font-size="20" dy="7" font-style="italic">θ</tspan><tspan dy="-7"></tspan> <tspan font-style="italic">L</tspan><tspan font-size="20" dy="7" font-style="italic">B</tspan><tspan dy="-7"></tspan></text>
<path d="M710,90 L961,90" fill="none" stroke="#2F3E7A" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrb)"/>
<text x="837" y="76" font-size="26" text-anchor="middle"><tspan font-style="italic">θ</tspan><tspan font-size="20" dy="-10">−</tspan><tspan dy="10"> ← </tspan><tspan font-style="italic">θ</tspan></text>
<text x="837" y="124" font-size="26" text-anchor="middle">mỗi <tspan font-style="italic">C</tspan> bước tối ưu</text>
<text x="10" y="370" font-size="26" text-anchor="start" font-weight="700" fill="#8A3F17">thu thập: mỗi bước tăng <tspan font-style="italic">t</tspan></text>
<text x="1245" y="370" font-size="26" text-anchor="end" font-weight="700" fill="#2F3E7A">tối ưu: mỗi bước tăng <tspan font-style="italic">k</tspan><tspan font-size="20" dy="7">opt</tspan><tspan dy="-7"></tspan></text>
</svg>
