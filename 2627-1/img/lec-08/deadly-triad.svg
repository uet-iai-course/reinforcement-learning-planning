<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Bộ ba nguy hiểm trong DQN</title><desc id="d">Ba vòng xấp xỉ hàm, bootstrap và dữ liệu lệch chính sách chồng lên nhau; vùng giao có nguy cơ bất ổn nhưng không có nghĩa luôn phân kỳ.</desc><circle cx="330" cy="160" r="135" fill="#EDF4FF" fill-opacity=".85" stroke="#2F3E7A" stroke-width="5"/><circle cx="570" cy="160" r="135" fill="#F7EFE6" fill-opacity=".85" stroke="#B15A2B" stroke-width="5"/><circle cx="450" cy="270" r="135" fill="#E8F5E9" fill-opacity=".82" stroke="#2E7D32" stroke-width="5"/><g font-size="34" text-anchor="middle" font-weight="700"><text x="270" y="95">xấp xỉ hàm</text><text x="630" y="95">bootstrap</text><text x="450" y="360">lệch chính sách</text><text x="450" y="190" fill="#A33A1F">nguy cơ</text><text x="450" y="225" fill="#A33A1F">bất ổn</text></g><text x="450" y="32" font-size="34" text-anchor="middle">DQN chứa cả ba thành phần</text></svg>
