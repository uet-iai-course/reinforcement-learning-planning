<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Rời rạc hóa CartPole</title><desc id="d">Trạng thái liên tục gồm vị trí, vận tốc, góc và vận tốc góc được lượng tử thành 3 nhân 3 nhân 6 nhân 6 bằng 324 trạng thái, nhưng vẫn cần mô hình chuyển.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#B15A2B"/></marker></defs><g font-family="Arial" text-anchor="middle"><rect x="50" y="105" width="300" height="200" rx="18" fill="#F7EFE6" stroke="#B15A2B" stroke-width="6"/><text x="200" y="160" font-size="34">s=(x,ẋ,θ,θ̇)</text><text x="200" y="215" font-size="30">không gian liên tục</text><text x="200" y="260" font-size="30">Left / Right</text><rect x="650" y="105" width="300" height="200" rx="18" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="6"/><text x="800" y="160" font-size="34">3×3×6×6</text><text x="800" y="215" font-size="34">= 324 trạng thái</text><text x="800" y="260" font-size="30">vẫn cần p(s′,r|s,a)</text><text x="500" y="125" font-size="30">lượng tử hóa</text></g><path d="M360 205H630" fill="none" stroke="#B15A2B" stroke-width="8" marker-end="url(#a)"/></svg>
