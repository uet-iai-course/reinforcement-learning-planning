<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc"><title id="title">Gom trạng thái liên tục thành ô</title><desc id="desc">Hai điểm khác nhau trong miền liên tục được gộp vào cùng ô. Biểu diễn dạng bảng còn cần xác định động lực chuyển và phần thưởng; việc gộp không tự bảo đảm tính Markov.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 12 6 0 12Z" fill="#333"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle" font-size="32"><rect x="20" y="20" width="300" height="190" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="170" y="65">Trạng thái liên tục</text><circle cx="125" cy="120" r="10" fill="#2F3E7A"/><path d="M193 141 l12 20 h-24Z" fill="#B15A2B"/><text x="170" y="189">hai điểm khác nhau</text><rect x="390" y="20" width="300" height="190" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="540" y="65">Cùng một ô</text><rect x="470" y="85" width="140" height="95" fill="white" stroke="#333" stroke-width="3"/><circle cx="502" cy="114" r="9" fill="#2F3E7A"/><path d="M568 132 l11 19 h-22Z" fill="#B15A2B"/><rect x="760" y="20" width="320" height="190" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="920" y="71">Mô hình dạng bảng</text><text x="920" y="130">Chuyển trạng thái</text><text x="920" y="177">và phần thưởng</text></g><g stroke="#333" stroke-width="3" marker-end="url(#arrow)"><path d="M325 110H380"/><path d="M695 110H750"/></g></svg>