<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="229" viewBox="0 0 1160 229" role="img" aria-labelledby="title desc">
<title id="title">Tương tác đánh giá và cải thiện</title><desc id="desc">Đánh giá làm bảng V phù hợp với chính sách pi. Cải thiện làm chính sách tham lam theo bảng V. Hai quá trình tác động qua lại.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="140" y="37" width="340" height="100" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="310" y="80" font-size="36" fill="#2F3E7A" font-weight="bold">Bảng giá trị V</text><text x="310" y="118" font-size="28" fill="#202938" font-weight="normal">Điều chỉnh theo π</text><rect x="685" y="37" width="340" height="100" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="855" y="80" font-size="36" fill="#B15A2B" font-weight="bold">Chính sách π</text><text x="855" y="118" font-size="28" fill="#202938" font-weight="normal">Chọn theo V</text><path d="M482 53 Q584 -6 683 53" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><text x="584" y="29" font-size="29" fill="#B15A2B" font-weight="bold">Cải thiện</text><path d="M683 129 Q584 210 482 129" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><text x="584" y="204" font-size="29" fill="#2F3E7A" font-weight="bold">Đánh giá</text></g></svg>