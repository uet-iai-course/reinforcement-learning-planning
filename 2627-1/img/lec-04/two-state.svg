<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="360" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">Mô hình hai trạng thái và hai hành động</title>
  <desc id="desc">Tại s0, a nhận thưởng 2 và ở s0; b nhận thưởng −1 và đến s1. Tại s1, a nhận thưởng 5 và đến s0; b nhận thưởng 10 và ở s1. Mọi chuyển là tất định.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 12 6 0 12Z" fill="#333"/></marker></defs>
  <g fill="none" stroke="#333" stroke-width="4.5" marker-end="url(#arrow)">
    <path d="M340 163 C430 92 590 92 680 163"/>
    <path d="M680 207 C590 280 430 280 340 207"/>
    <path d="M235 142 C134 31 105 222 215 185"/>
    <path d="M785 142 C886 31 915 222 805 185"/>
  </g>
  <g stroke-width="4"><circle cx="280" cy="185" r="62" fill="#F7EFE6" stroke="#B15A2B"/><circle cx="740" cy="185" r="62" fill="#EDF4FF" stroke="#2F3E7A"/></g>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#202631"><text x="280" y="201" font-size="48">s₀</text><text x="740" y="201" font-size="48">s₁</text><g font-size="36"><text x="510" y="93">b / −1</text><text x="510" y="303">a / 5</text><text x="142" y="65">a / 2</text><text x="878" y="65">b / 10</text></g></g>
</svg>
