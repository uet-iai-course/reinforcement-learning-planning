<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="330" viewBox="0 0 1160 330" role="img" aria-labelledby="title desc">
<title id="title">Chu trình lặp chính sách</title><desc id="desc">Đánh giá giữ chính sách cố định tạo giá trị chính xác. Cải thiện giữ giá trị cố định tạo chính sách mới; chính sách mới quay lại bước đánh giá.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="22" y="76" width="215" height="117" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="129" y="121" font-size="32" fill="#2F3E7A" font-weight="bold">Chính sách</text><text x="129" y="167" font-size="44" fill="#2F3E7A" font-weight="normal">πᵢ</text><path d="M240 132 H312" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="325" y="62" width="244" height="143" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="447" y="106" font-size="34" fill="#B15A2B" font-weight="bold">Đánh giá</text><text x="447" y="154" font-size="32" fill="#202938" font-weight="normal">πᵢ cố định</text><text x="447" y="190" font-size="27" fill="#202938" font-weight="normal">Giá trị chính xác</text><path d="M572 132 H644" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="657" y="76" width="201" height="117" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="757" y="122" font-size="32" fill="#2F3E7A" font-weight="bold">Giá trị</text><text x="757" y="168" font-size="42" fill="#2F3E7A" font-weight="normal">v<tspan baseline-shift="sub" font-size="70%">πᵢ</tspan></text><path d="M861 132 H930" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="943" y="62" width="205" height="143" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="1045" y="108" font-size="32" fill="#B15A2B" font-weight="bold">Cải thiện</text><text x="1045" y="152" font-size="30" fill="#202938" font-weight="normal">v<tspan baseline-shift="sub" font-size="70%">πᵢ</tspan> cố định</text><text x="1045" y="190" font-size="28" fill="#202938" font-weight="normal">Tạo πᵢ₊₁</text><path d="M1045 207 V268 H129 V198" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><text x="590" y="306" font-size="32" fill="#B15A2B" font-weight="normal">Chính sách mới được đánh giá lại</text></g></svg>