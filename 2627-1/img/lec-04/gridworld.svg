="Arial" text-anchor="middle" font-size="40">c₄</text><path d="M839 140 H914" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><text x="878" y="78" text-anchor="middle" font-family="Arial" font-size="34">+24</text><rect x="920" y="95" width="125" height="100" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="982" y="157" font-family="Arial" text-anchor="middle" font-size="40">c₅</text><path d="M80 110 C12 36 15 222 80 175" fill="none" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/><text x="38" y="64" font-family="Arial" font-size="32">−1</text><text x="500" y="251" text-anchor="middle" font-family="Arial" font-size="30">Đi trái hoặc phải · Thưởng bước thường: −1</text><text x="982" y="237" text-anchor="middle" font-family="Arial" font-size="30">kết thúc</text></svg>