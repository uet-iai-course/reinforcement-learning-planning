<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img" aria-labelledby="t d"><title id="t">Gridworld năm ô</title><desc id="d">Năm ô c1 đến c5. Left và Right chuyển tất định; Left ở c1 giữ nguyên và thưởng âm một; chuyển từ c4 sang c5 thưởng dương mười; c5 hấp thụ với thưởng không.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#B15A2B"/></marker></defs><g font-family="Arial" font-size="34" text-anchor="middle"><rect x="45" y="105" width="170" height="120" fill="#fff" stroke="#333" stroke-width="4"/><rect x="215" y="105" width="170" height="120" fill="#fff" stroke="#333" stroke-width="4"/><rect x="385" y="105" width="170" height="120" fill="#fff" stroke="#333" stroke-width="4"/><rect x="555" y="105" width="170" height="120" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><rect x="725" y="105" width="170" height="120" fill="#EEF7EE" stroke="#2E7D32" stroke-width="6"/><text x="130" y="175">c₁</text><text x="300" y="175">c₂</text><text x="470" y="175">c₃</text><text x="640" y="175">c₄</text><text x="810" y="160">c₅</text><text x="810" y="200">hấp thụ</text><text x="470" y="282">Left ← · chuyển tất định · → Right</text><text x="470" y="325">mọi chuyển thường: −1</text><text x="810" y="70" fill="#2E7D32">Right: +10</text><text x="115" y="70">Left: giữ c₁, −1</text></g><path d="M665 82H780" fill="none" stroke="#B15A2B" stroke-width="7" marker-end="url(#a)"/><path d="M865 96C955 18 970 180 910 174" fill="none" stroke="#2E7D32" stroke-width="6" marker-end="url(#a)"/><text x="925" y="62" font-family="Arial" font-size="30" text-anchor="middle">0</text></svg>
