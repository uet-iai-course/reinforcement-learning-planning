<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc"><title id="title">Chuyển theo chính sách luôn chọn a</title><desc id="desc">Tại s0 chọn a nhận thưởng2 và ở lại. Tại s1 chọn a nhận thưởng5 và đến s0. Chỉ hai chuyển theo chính sách được giữ.</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 12 6 0 12Z" fill="#333"/></marker></defs><g fill="none" stroke="#333" stroke-width="4.5" marker-end="url(#arrow)"><path d="M680 155 H348"/><path d="M235 108 C120 5 105 212 215 155"/></g><circle cx="280" cy="155" r="62" fill="#F7EFE6" stroke="#B15A2B" stroke-width="4"/><circle cx="740" cy="155" r="62" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#202631"><text x="280" y="173" font-size="48">s₀</text><text x="740" y="173" font-size="48">s₁</text><text x="510" y="125" font-size="36">a / 5</text><text x="140" y="55" font-size="36">a / 2</text></g></svg>