<svg xmlns="http://www.w3.org/2000/svg" width="600" height="396" viewBox="0 0 600 396" role="img" aria-labelledby="title desc">
<title id="title">Thứ tự cập nhật tại chỗ</title><desc id="desc">Từ bảng không, cập nhật s0 thành 1 trước, rồi dùng giá trị mới 1 để cập nhật s1 thành 2,9.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="15" y="15" width="570" height="85" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="300" y="69" font-size="34" fill="#2F3E7A" font-weight="bold">Khởi tạo: (0, 0)</text><path d="M300 103 V143" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="15" y="156" width="570" height="85" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="300" y="210" font-size="34" fill="#B15A2B" font-weight="bold">① Cập nhật s₀: (1, 0)</text><path d="M300 244 V285" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="15" y="298" width="570" height="85" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="300" y="352" font-size="34" fill="#2F3E7A" font-weight="bold">② Cập nhật s₁: (1; 2,9)</text></g></svg>