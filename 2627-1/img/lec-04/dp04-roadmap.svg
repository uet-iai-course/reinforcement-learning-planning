<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="178" viewBox="0 0 1160 178" role="img" aria-labelledby="title desc">
<title id="title">Các thành phần của quy hoạch động</title><desc id="desc">Từ đánh giá đến cải thiện, lặp chính sách, lặp giá trị và tổ chức lịch cập nhật.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="4" y="6" width="216" height="160" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="112" y="49" font-size="32" fill="#2F3E7A" font-weight="bold">Đánh giá</text><text x="112" y="85" font-size="32" fill="#2F3E7A" font-weight="bold">chính sách</text><text x="112" y="137" font-size="26" fill="#202938" font-weight="normal">Giá trị hiện tại</text><path d="M221 88 H232" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="236" y="6" width="216" height="160" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="344" y="49" font-size="32" fill="#2F3E7A" font-weight="bold">Cải thiện</text><text x="344" y="85" font-size="32" fill="#2F3E7A" font-weight="bold">chính sách</text><text x="344" y="137" font-size="26" fill="#202938" font-weight="normal">Lựa chọn mới</text><path d="M453 88 H464" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="468" y="6" width="216" height="160" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="576" y="49" font-size="32" fill="#2F3E7A" font-weight="bold">Lặp</text><text x="576" y="85" font-size="32" fill="#2F3E7A" font-weight="bold">chính sách</text><text x="576" y="137" font-size="26" fill="#202938" font-weight="normal">Cặp ổn định</text><path d="M685 88 H696" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="700" y="6" width="216" height="160" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="808" y="49" font-size="32" fill="#2F3E7A" font-weight="bold">Lặp</text><text x="808" y="85" font-size="32" fill="#2F3E7A" font-weight="bold">giá trị</text><text x="808" y="137" font-size="26" fill="#202938" font-weight="normal">Bảng tối ưu</text><path d="M917 88 H928" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="932" y="6" width="216" height="160" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="1040" y="49" font-size="32" fill="#2F3E7A" font-weight="bold">Lịch</text><text x="1040" y="85" font-size="32" fill="#2F3E7A" font-weight="bold">cập nhật</text><text x="1040" y="137" font-size="26" fill="#202938" font-weight="normal">Phân bổ tính</text></g></svg>