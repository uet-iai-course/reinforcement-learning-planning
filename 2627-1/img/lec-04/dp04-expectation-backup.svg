<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="294" viewBox="0 0 1160 294" role="img" aria-labelledby="title desc">
<title id="title">Cập nhật kỳ vọng theo chính sách</title><desc id="desc">Chính sách chọn hành động; mô hình gán xác suất cho các kết quả chuyển và phần thưởng. Mỗi nhánh cộng thưởng hiện tại với giá trị tiếp nối đã chiết khấu.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="12" y="89" width="205" height="104" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="114" y="132" font-size="34" fill="#2F3E7A" font-weight="bold">Trạng thái</text><text x="114" y="174" font-size="32" fill="#202938" font-weight="normal">hiện tại</text><path d="M220 141 H289" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="299" y="78" width="255" height="126" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="426" y="124" font-size="34" fill="#B15A2B" font-weight="bold">Hành động</text><text x="426" y="168" font-size="30" fill="#202938" font-weight="normal">theo chính sách</text><path d="M557 115 L641 53" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M557 167 L641 229" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><rect x="653" y="5" width="490" height="105" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="898" y="47" font-size="30" fill="#202938" font-weight="normal">Phần thưởng + giá trị tiếp nối</text><text x="898" y="87" font-size="30" fill="#2F3E7A" font-weight="normal">Kết quả chuyển thứ nhất</text><rect x="653" y="179" width="490" height="105" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="898" y="221" font-size="30" fill="#202938" font-weight="normal">Phần thưởng + giá trị tiếp nối</text><text x="898" y="261" font-size="30" fill="#2F3E7A" font-weight="normal">Kết quả chuyển khác</text><text x="894" y="146" font-size="30" fill="#B15A2B" font-weight="bold">Trung bình theo mô hình</text></g></svg>