<svg xmlns="http://www.w3.org/2000/svg" width="600" height="357" viewBox="0 0 600 357" role="img" aria-labelledby="title desc">
<title id="title">Biểu diễn trạng thái CartPole</title><desc id="desc">Xe chuyển động trên trục ngang x với vận tốc x chấm. Cột có góc theta và vận tốc góc theta chấm. Bốn biến được chia thành 3, 3, 6, 6 khoảng. Hình là sơ đồ các biến, không biểu diễn dữ liệu đo.</desc>
