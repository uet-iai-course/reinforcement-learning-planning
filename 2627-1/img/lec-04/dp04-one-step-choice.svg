<svg xmlns="http://www.w3.org/2000/svg" width="600" height="345" viewBox="0 0 600 345" role="img" aria-labelledby="title desc">
<title id="title">Nhìn trước một bước tại s1</title><desc id="desc">Hai hành động được so sánh với cùng chính sách tiếp nối pi0. Nhánh a nhận 2 và tới s0 có giá trị 10. Nhánh b nhận 3 và tới s1 có giá trị 11.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><circle cx="75" cy="166" r="53" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="75" y="180" font-size="44" fill="#2F3E7A" font-weight="bold">s₁</text><path d="M120 137 L295 70" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M120 194 L295 268" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><text x="203" y="72" font-size="34" fill="#2F3E7A" font-weight="normal">a / 2</text><text x="203" y="286" font-size="34" fill="#B15A2B" font-weight="normal">b / 3</text><rect x="314" y="11" width="268" height="112" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="448" y="53" font-size="34" fill="#2F3E7A" font-weight="bold">Tới s₀</text><text x="448" y="96" font-size="32" fill="#202938" font-weight="normal">Giá trị: 10</text><rect x="314" y="215" width="268" height="112" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="448" y="257" font-size="34" fill="#B15A2B" font-weight="bold">Tới s₁</text><text x="448" y="300" font-size="32" fill="#202938" font-weight="normal">Giá trị: 11</text><text x="430" y="176" font-size="30" fill="#202938" font-weight="normal">Tiếp tục theo π₀</text></g></svg>