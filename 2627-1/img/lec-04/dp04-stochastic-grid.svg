<svg xmlns="http://www.w3.org/2000/svg" width="590" height="370" viewBox="0 0 590 370" role="img" aria-labelledby="title desc">
<title id="title">Chuyển tiếp ngẫu nhiên khi chọn phải tại c4</title><desc id="desc">Nhãn có dạng xác suất / phần thưởng. Xác suất 0,8 đi tới c5 và nhận 10; 0,1 đứng yên tại c4 và nhận -1; 0,1 đi ngược tới c3 và nhận -1. c5 là trạng thái kết thúc.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="222" y="134" width="145" height="78" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="294" y="184" font-size="40" fill="#2F3E7A" font-weight="bold">c₄</text><rect x="20" y="18" width="143" height="77" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="92" y="68" font-size="40" fill="#2F3E7A" font-weight="bold">c₃</text><rect x="427" y="18" width="143" height="77" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="498" y="68" font-size="40" fill="#B15A2B" font-weight="bold">c₅</text><path d="M245 137 L143 96" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><text x="95" y="145" font-size="30" fill="#202938" font-weight="normal">0,1 / −1</text><path d="M344 137 L447 96" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><text x="499" y="145" font-size="30" fill="#B15A2B" font-weight="normal">0,8 / 10</text><path d="M264 214 C156 278 430 278 323 214" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><text x="295" y="298" font-size="30" fill="#2F3E7A" font-weight="normal">0,1 / −1</text><text x="294" y="344" font-size="32" fill="#B15A2B" font-weight="bold">Hành động chọn: phải</text></g></svg>