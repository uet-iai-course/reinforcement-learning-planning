<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
<title id="title">MDP hai trạng thái</title><desc id="desc">Các nhãn có dạng hành động / phần thưởng. s0 chọn a ở lại nhận 1, chọn b sang s1 nhận 0. s1 chọn a sang s0 nhận 2, chọn b ở lại nhận 3. Mọi chuyển có xác suất 1.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><path d="M232 143 Q300 48 368 143" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><path d="M368 207 Q300 292 232 207" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M125 143 C18 30 18 315 125 207" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><path d="M475 143 C582 30 582 315 475 207" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><circle cx="180" cy="175" r="58" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="180" y="190" font-size="48" fill="#2F3E7A" font-weight="bold">s₀</text><circle cx="420" cy="175" r="58" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"/><text x="420" y="190" font-size="48" fill="#2F3E7A" font-weight="bold">s₁</text><text x="300" y="64" font-size="34" fill="#B15A2B" font-weight="normal">b / 0</text><text x="300" y="309" font-size="34" fill="#2F3E7A" font-weight="normal">a / 2</text><text x="66" y="73" font-size="32" fill="#2F3E7A" font-weight="normal">a / 1</text><text x="532" y="73" font-size="32" fill="#B15A2B" font-weight="normal">b / 3</text></g></svg>