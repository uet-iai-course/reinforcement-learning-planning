<svg xmlns="http://www.w3.org/2000/svg" width="590" height="247" viewBox="0 0 590 247" role="img" aria-labelledby="title desc">
<title id="title">Lưới năm ô và chính sách tối ưu</title><desc id="desc">Các ô c1 đến c5 nằm nối tiếp. c5 có viền kép là trạng thái kết thúc. Đi trái ở c1 giữ nguyên trạng thái. Bốn mũi tên phải biểu diễn chính sách tối ưu của lưới xác định.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#2F3E7A"/></marker><marker id="warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#B15A2B"/></marker></defs>
<g font-family="Arial, Helvetica, sans-serif" fill="#202938" font-size="32" text-anchor="middle"><rect x="54" y="78" width="90" height="95" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="99" y="135" font-size="38" fill="#2F3E7A" font-weight="bold">c₁</text><path d="M101 188 H201" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><rect x="157" y="78" width="90" height="95" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="202" y="135" font-size="38" fill="#2F3E7A" font-weight="bold">c₂</text><path d="M204 188 H304" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><rect x="260" y="78" width="90" height="95" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="305" y="135" font-size="38" fill="#2F3E7A" font-weight="bold">c₃</text><path d="M307 188 H407" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><rect x="363" y="78" width="90" height="95" rx="12" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="408" y="135" font-size="38" fill="#2F3E7A" font-weight="bold">c₄</text><path d="M410 188 H510" fill="none" stroke="#B15A2B" stroke-width="3.5" marker-end="url(#warm)"/><rect x="466" y="78" width="90" height="95" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="511" y="135" font-size="38" fill="#2F3E7A" font-weight="bold">c₅</text><rect x="473" y="85" width="76" height="81" rx="7" fill="none" stroke="#B15A2B" stroke-width="2"/><path d="M52 102 C2 94 2 168 49 156" fill="none" stroke="#2F3E7A" stroke-width="3.5" marker-end="url(#arrow)"/><text x="119" y="47" font-size="29" fill="#202938" font-weight="normal">Trái ở c₁: ở lại</text><text x="510" y="48" font-size="30" fill="#B15A2B" font-weight="bold">Đích</text><text x="306" y="230" font-size="30" fill="#B15A2B" font-weight="normal">Mũi tên: chính sách tối ưu</text></g></svg>