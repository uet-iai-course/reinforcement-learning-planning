<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-label="Cây hai bước từ H. Bước 1: Tìm, phần thưởng 2, tới H hoặc L, mỗi nhánh xác suất 1/2. Từ H, chính sách chọn Tìm với xác suất 1, phần thưởng 2; nhánh này có lợi tức cắt sau hai bước bằng 3 và xác suất 1/2, gộp hai trạng thái kế tiếp H và L. Từ L, Chờ với xác suất 1/2, phần thưởng 1, cho 5/2 với xác suất 1/4; Sạc với xác suất 1/2, phần thưởng 0, cho 2 với xác suất 1/4." font-family="Arial,sans-serif" class="figure"><defs><marker id="two-step-arrow-d" markerWidth="7" markerHeight="7" refX="7" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#2F3E7A"/></marker></defs>
<text x="180" y="32" font-size="28" fill="#2F3E7A">Bước 1: Tìm, +2</text><text x="660" y="32" font-size="28" fill="#B15A2B" text-anchor="middle">Hành động 2</text><text x="945" y="32" font-size="28" text-anchor="middle">G<tspan baseline-shift="sub" font-size="20">0</tspan><tspan baseline-shift="super" font-size="20">[2]</tspan>; xác suất</text>
<circle cx="60" cy="170" r="30" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="60" y="181" text-anchor="middle" font-size="32">H</text>
<path d="M92 159L340 80M92 181L340 245" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#two-step-arrow-d)"/>
<text x="215" y="106" font-size="30" text-anchor="middle">1/2</text><text x="215" y="240" font-size="30" text-anchor="middle">1/2</text>
<circle cx="375" cy="80" r="32" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="375" y="91" text-anchor="middle" font-size="32">H</text>
<circle cx="375" cy="245" r="32" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="375" y="256" text-anchor="middle" font-size="32">L</text>
