<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" font-family="Arial,sans-serif"><title>Hai lựa chọn tại C2</title><desc>C2 dẫn tới hai hành động Study và Sleep. Study dẫn tới C3, thưởng -2. Sleep kết thúc, thưởng 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f3e7a"/></marker></defs><path d="M166 137L360 70" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M166 163L360 230" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 70H780" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><path d="M500 230H760" fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#arrow)"/><circle cx="120" cy="150" r="48" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="120" y="160" font-size="30" text-anchor="middle" fill="#17213f">C2</text><rect x="360" y="40" width="140" height="60" rx="7" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="430.0" y="80.0" font-size="28" text-anchor="middle" fill="#17213f">Study</text><rect x="360" y="200" width="140" height="60" rx="7" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="430.0" y="240.0" font-size="28" text-anchor="middle" fill="#17213f">Sleep</text><circle cx="828" cy="70" r="48" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="828" y="80" font-size="30" text-anchor="middle" fill="#17213f">C3</text><rect x="760" y="200" width="140" height="60" rx="7" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="830.0" y="240.0" font-size="28" text-anchor="middle" fill="#17213f">Sleep</text><text x="625" y="55" font-size="28" text-anchor="middle" fill="#8b3a18">thưởng −2</text><text x="625" y="215" font-size="28" text-anchor="middle" fill="#8b3a18">thưởng 0</text></svg>