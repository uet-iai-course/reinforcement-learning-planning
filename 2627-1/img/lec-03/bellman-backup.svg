<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Phép sao lưu Bellman cho MRP</title><desc id="desc">Trạng thái s nhận phần thưởng tức thời rồi chuyển tới ba trạng thái kế tiếp; giá trị s là thưởng cộng trung bình chiết khấu của các giá trị kế tiếp.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs><g font-family="sans-serif" text-anchor="middle"><circle cx="170" cy="180" r="62" fill="#F7EFE6" stroke="#B15A2B" stroke-width="5"/><text x="170" y="190" font-size="38">s</text><g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="5"><circle cx="690" cy="75" r="52"/><circle cx="690" cy="180" r="52"/><circle cx="690" cy="285" r="52"/></g><text x="690" y="85" font-size="30">s′₁</text><text x="690" y="190" font-size="30">s′₂</text><text x="690" y="295" font-size="30">s′₃</text><g stroke="#2F3E7A" stroke-width="5" marker-end="url(#a)"><path d="M230 160L625 90"/><path d="M232 180H625"/><path d="M230 200L625 270"/></g><text x="430" y="95" font-size="30">p₁</text><text x="430" y="170" font-size="30">p₂</text><text x="430" y="270" font-size="30">p₃</text><text x="420" y="335" font-size="30" fill="#B15A2B">r(s) + γ · trung bình giá trị kế tiếp</text></g></svg>
