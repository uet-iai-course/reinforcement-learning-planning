<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 280" role="img" font-family="Arial,sans-serif"><title>Từ mô hình tới giá trị</title><desc>Mô hình và chính sách xác định phương trình Bellman kỳ vọng; giải phương trình cho giá trị dài hạn.</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b15a2b"/></marker></defs><path d="M300 145H440" fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"/><path d="M700 145H840" fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"/><rect x="40" y="95" width="260" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="170.0" y="137.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Mô hình</text><text x="170.0" y="173.0" text-anchor="middle" font-size="30" fill="#2f3e7a">và chính sách</text><rect x="440" y="95" width="260" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="570.0" y="137.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Bellman</text><text x="570.0" y="173.0" text-anchor="middle" font-size="30" fill="#2f3e7a">kỳ vọng</text><rect x="840" y="95" width="260" height="100" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="970.0" y="137.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Giá trị</text><text x="970.0" y="173.0" text-anchor="middle" font-size="30" fill="#2f3e7a">dài hạn</text></svg>