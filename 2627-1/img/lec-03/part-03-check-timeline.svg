<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 145" role="img"><title>Quỹ đạo C1 tới C2 rồi Sleep</title><desc>Các nút là trạng thái theo thứ tự thời gian; số dưới mỗi mũi tên là thưởng nhận trên bước chuyển đó.</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="10" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs><g font-family="Arial,sans-serif" font-size="28" fill="#2F3E7A" text-anchor="middle"><rect x="25.0" y="25" width="110" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="80.0" y="65">C1</text><path d="M135.0 55H464.0" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="302.5" y="123" fill="#B15A2B">−2</text><rect x="470.0" y="25" width="110" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="525.0" y="65">C2</text><path d="M580.0 55H909.0" stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="747.5" y="123" fill="#B15A2B">−2</text><rect x="915.0" y="25" width="110" height="60" rx="10" fill="#EDF4FF" stroke="#2F3E7A" stroke-width="3"/><text x="970.0" y="65">Sleep</text></g></svg>