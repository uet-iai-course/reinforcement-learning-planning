<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 450" role="img" aria-labelledby="cs-title cs-desc" font-family="Arial,sans-serif">
<title id="cs-title">Cấu trúc chương Bài 03</title>
<desc id="cs-desc">Sáu khối nối bằng mũi tên. Hàng trên: Mục 1, mô hình môi trường với trạng thái Markov và hàm động lực p(s', r | s, a); mũi tên "chuỗi thưởng" sang Mục 2, lợi tức G_t = R_{t+1} + γR_{t+2} + … với cận |G_t| ≤ M/(1 − γ); mũi tên "lấy kỳ vọng" sang Mục 3, chính sách π(a | s), giá trị v_π(s) và q_π(s, a). Mũi tên "tách bước đầu, dùng tính Markov" xuống hàng dưới: Mục 4, phương trình Bellman v_π(s) = Σ π Σ p [r + γ v_π(s')]; mũi tên "S hữu hạn, γ &lt; 1" sang Mục 5, hệ (I − γP^π) v = r^π có nghiệm duy nhất; mũi tên "giải hệ hai ẩn" sang khối viền đứt robot hai mức pin với v_π(H) = 13/4 và v_π(L) = 7/4.</desc>
<defs><marker id="cs-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2F3E7A"/></marker></defs>
<rect x="0" y="0" width="1160" height="450" fill="#ffffff"/>
<g stroke="#2F3E7A" stroke-width="2" fill="#edf4ff">
<rect x="20" y="60" width="330" height="140" rx="10"/>
<rect x="415" y="60" width="330" height="140" rx="10"/>
<rect x="810" y="60" width="330" height="140" rx="10"/>
<rect x="20" y="290" width="330" height="140" rx="10"/>
<rect x="415" y="290" width="330" height="140" rx="10"/>
</g>
<rect x="810" y="290" width="330" height="140" rx="10" fill="#F7EFE6" stroke="#B15A2B" stroke-width="2" stroke-dasharray="8 5"/>
<g font-size="23" text-anchor="middle" fill="#1d1d1d">
<text x="185" y="100" font-weight="bold">Mục 1. Mô hình</text>
<text x="185" y="138">trạng thái Markov</text>
<text x="185" y="176">p(s′, r | s, a)</text>
<text x="580" y="100" font-weight="bold">Mục 2. Lợi tức</text>
<text x="580" y="138">Gₜ = Rₜ₊₁ + γRₜ₊₂ + …</text>
<text x="580" y="176">|Gₜ| ≤ M/(1 − γ)</text>
<text x="975" y="100" font-weight="bold">Mục 3. Chính sách, giá trị</text>
<text x="975" y="138">π(a | s)</text>
<text x="975" y="176">v<tspan baseline-shift="sub" font-size="17">π</tspan>(s), q<tspan baseline-shift="sub" font-size="17">π</tspan>(s, a)</text>
<text x="185" y="330" font-weight="bold">Mục 4. Bellman</text>
<text x="185" y="370" font-size="21">v<tspan baseline-shift="sub" font-size="15">π</tspan>(s) = Σ π Σ p [r + γ v<tspan baseline-shift="sub" font-size="15">π</tspan>(s′)]</text>
<text x="185" y="408" font-size="20">mỗi trạng thái một phương trình</text>
<text x="580" y="330" font-weight="bold">Mục 5. Hệ tuyến tính</text>
<text x="580" y="370">(I − γP<tspan baseline-shift="super" font-size="17">π</tspan>) v = r<tspan baseline-shift="super" font-size="17">π</tspan></text>
<text x="580" y="408" font-size="20">nghiệm duy nhất khi γ &lt; 1</text>
<text x="975" y="330" font-weight="bold">Robot hai mức pin</text>
<text x="975" y="370">v<tspan baseline-shift="sub" font-size="17">π</tspan>(H) = 13/4</text>
<text x="975" y="408">v<tspan baseline-shift="sub" font-size="17">π</tspan>(L) = 7/4</text>
</g>
<g stroke="#2F3E7A" stroke-width="3" fill="none" marker-end="url(#cs-arrow)">
<path d="M352 130H411"/>
<path d="M747 130H806"/>
<path d="M975 202V240H185V286"/>
<path d="M352 360H411"/>
<path d="M747 360H806"/>
</g>
<g font-size="19" text-anchor="middle" fill="#1d1d1d">
<text x="382" y="42">chuỗi thưởng</text>
<text x="777" y="42">lấy kỳ vọng</text>
<text x="580" y="232">tách bước đầu, dùng tính Markov</text>
<text x="382" y="276">S hữu hạn, γ &lt; 1</text>
<text x="777" y="276">giải hệ hai ẩn</text>
</g>
</svg>
