<svg class="figure" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img" aria-label="Hai lịch sử quá khứ khác nhau nhập vào cùng trạng thái L, cùng chọn Tìm, rồi dẫn tới hai kết quả" font-family="Arial,sans-serif">
    <rect x="0" y="0" width="1100" height="320" fill="#F7EFE6"/>
    <!-- history 1 -->
    <rect x="40" y="30" width="300" height="80" rx="10" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/>
    <text x="190" y="65" font-size="28" fill="#424954" text-anchor="middle">Lịch sử 1: vừa Tìm</text>
    <text x="190" y="98" font-size="28" fill="#424954" text-anchor="middle">H → L</text>
    <!-- history 2 -->
    <rect x="40" y="210" width="300" height="80" rx="10" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/>
    <text x="190" y="245" font-size="28" fill="#424954" text-anchor="middle">Lịch sử 2: vừa Chờ</text>
    <text x="190" y="278" font-size="28" fill="#424954" text-anchor="middle">L → L</text>
    <!-- merge node L -->
    <circle cx="470" cy="160" r="40" fill="#2F3E7A"/>
    <text x="470" y="170" font-size="30" fill="#ffffff" text-anchor="middle">L</text>
    <line x1="340" y1="80" x2="438" y2="140" stroke="#2F3E7A" stroke-width="4"/>
    <polygon points="444,144 420,138 432,124" fill="#2F3E7A"/>
    <line x1="340" y1="240" x2="438" y2="180" stroke="#2F3E7A" stroke-width="4"/>
    <polygon points="444,176 432,196 420,182" fill="#2F3E7A"/>
    <!-- action node Tìm -->
    <rect x="560" y="125" width="160" height="70" rx="10" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/>
    <text x="640" y="170" font-size="30" fill="#424954" text-anchor="middle">Tìm</text>
    <line x1="510" y1="160" x2="552" y2="160" stroke="#2F3E7A" stroke-width="4"/>
    <polygon points="560,160 540,150 540,170" fill="#2F3E7A"/>
    <!-- two outcomes -->
    <line x1="720" y1="145" x2="860" y2="80" stroke="#B15A2B" stroke-width="4"/>
    <polygon points="868,76 842,72 850,92" fill="#B15A2B"/>
    <line x1="720" y1="175" x2="860" y2="240" stroke="#B15A2B" stroke-width="4"/>
    <polygon points="868,244 850,228 842,248" fill="#B15A2B"/>
    <text x="880" y="90" font-size="28" fill="#424954">kết quả 1</text>
    <text x="880" y="250" font-size="28" fill="#424954">kết quả 2</text>
  </svg>
