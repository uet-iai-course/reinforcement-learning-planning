<text x="60" y="480" font-size="20" fill="#1d1d1d">Hành động: bắc, nam, đông, tây; chính sách đều chọn mỗi hành động với xác suất 1/4.</text>
<text x="60" y="508" font-size="20" fill="#1d1d1d">Tại A mọi hành động đưa tới A′, thưởng +10; tại B mọi hành động đưa tới B′, thưởng +5.</text>
<text x="60" y="536" font-size="20" fill="#1d1d1d">Bước ra ngoài lưới: giữ nguyên ô, thưởng −1. Các bước khác: thưởng 0.</text>
