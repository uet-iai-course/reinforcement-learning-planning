<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="gw-title gw-desc" font-family="Arial,sans-serif">
<title id="gw-title">Lưới 5×5: động lực đặc biệt và giá trị của chính sách đều</title>
<desc id="gw-desc">Hai lưới 5 hàng 5 cột. Lưới trái, (a) động lực đặc biệt: ô A ở hàng 1 cột 2, ô A' ở hàng 5 cột 2, ô B ở hàng 1 cột 4, ô B' ở hàng 3 cột 4; mũi tên từ A xuống A' ghi +10, mũi tên từ B xuống B' ghi +5. Chú thích: bốn hành động bắc, nam, đông, tây; mọi hành động tại A đưa tới A' với thưởng +10, tại B đưa tới B' với thưởng +5; bước ra ngoài lưới giữ nguyên ô với thưởng −1; các bước khác thưởng 0. Lưới phải, (b) giá trị v_π của chính sách chọn đều bốn hành động, γ = 0,9, làm tròn một chữ số thập phân, theo hàng từ trên xuống: 3,3 8,8 4,4 5,3 1,5; 1,5 3,0 2,3 1,9 0,5; 0,1 0,7 0,7 0,4 −0,4; −1,0 −0,4 −0,4 −0,6 −1,2; −1,9 −1,3 −1,2 −1,4 −2,0.</desc>
<defs><marker id="gw-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#B15A2B"/></marker></defs>
<rect x="0" y="0" width="1100" height="560" fill="#ffffff"/>
<g font-size="22" font-weight="bold" fill="#1d1d1d" text-anchor="middle"><text x="235" y="50">(a) Động lực đặc biệt</text><text x="815" y="50">(b) v<tspan baseline-shift="sub" font-size="16">π</tspan> của chính sách đều, γ = 0,9</text></g>
