<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img"><title>Một hành động, hai trạng thái kế tiếp</title><desc>Cùng trạng thái hiện tại và hành động có thể dẫn tới trạng thái 1 hoặc trạng thái 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="10" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs><g font-family="Arial,sans-serif" font-size="28" fill="#2F3E7A"><rect x="30" y="122" width="165" height="76" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="112.5" y="170.0" text-anchor="middle" fill="#2F3E7A">hiện tại</text><rect x="340" y="122" width="225" height="76" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="452.5" y="170.0" text-anchor="middle" fill="#2F3E7A">hành động a</text><path d="M195 160L332 160" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="25" width="195" height="85" rx="12" fill="#EDF4FF" stroke="#B15A2B" stroke-width="3"/><text x="867" y="59" text-anchor="middle" fill="#2F3E7A">trạng thái</text><text x="867" y="93" text-anchor="middle" fill="#2F3E7A">1</text><path d="M565 160L762 67" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><rect x="770" y="220" width="195" height="85" rx="12" fill="#EDF4FF" stroke="#B15A2B" stroke-width="3"/><text x="867" y="254" text-anchor="middle" fill="#2F3E7A">trạng thái</text><text x="867" y="288" text-anchor="middle" fill="#2F3E7A">2</text><path d="M565 160L762 262" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/></g></svg>