<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 320" role="img" font-family="Arial,sans-serif"><title>Quan hệ giữa các lớp mô hình</title><desc>Chuỗi Markov thêm thưởng thành MRP. MRP thêm lựa chọn hành động thành MDP. Cố định một chính sách trong MDP thu được MRP cảm sinh.</desc><defs><marker id="a" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b15a2b"/></marker></defs><path d="M250 85H390" fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"/><path d="M610 85H770" fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"/><path d="M890 130V245H620" fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"/><rect x="30" y="40" width="220" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="140.0" y="95.0" text-anchor="middle" font-size="30" fill="#2f3e7a">Chuỗi Markov</text><rect x="390" y="40" width="220" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="500.0" y="95.0" text-anchor="middle" font-size="30" fill="#2f3e7a">MRP</text><rect x="770" y="40" width="240" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="890.0" y="95.0" text-anchor="middle" font-size="30" fill="#2f3e7a">MDP</text><rect x="380" y="200" width="240" height="90" rx="9" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="500.0" y="255.0" text-anchor="middle" font-size="30" fill="#2f3e7a">MRP cảm sinh</text><text x="320" y="27" text-anchor="middle" font-size="27" fill="#424954">thêm thưởng</text><text x="690" y="27" text-anchor="middle" font-size="27" fill="#424954">thêm lựa chọn</text><text x="1020" y="184" text-anchor="middle" font-size="27" fill="#424954">cố định</text><text x="1020" y="222" text-anchor="middle" font-size="27" fill="#424954">chính sách</text></svg>