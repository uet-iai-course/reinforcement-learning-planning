<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img"><title>Từ C1 tỏa ra nhiều quỹ đạo với tổng G khác nhau</title><desc>Nút C1 bên trái, ba mũi tên tới ba hộp: quỹ đạo qua Pass cho G = −2,25; quỹ đạo qua FB hai lần cho G = −3,125; và nhiều quỹ đạo khác.</desc><defs><marker id="ar4" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#2F3E7A"/></marker></defs><g stroke="#2F3E7A" stroke-width="2.5" fill="none"><line x1="162" y1="144" x2="372" y2="64" marker-end="url(#ar4)"/><line x1="170" y1="160" x2="372" y2="160" marker-end="url(#ar4)"/><line x1="162" y1="176" x2="372" y2="256" marker-end="url(#ar4)"/></g><circle cx="120" cy="160" r="48" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="2.5"/><text x="120" y="169" font-family="Arial, sans-serif" font-size="25" text-anchor="middle" fill="#2F3E7A" font-weight="bold">C1</text><g fill="#FFFFFF" stroke="#2F3E7A" stroke-width="2"><rect x="380" y="25" width="590" height="70" rx="10"/><rect x="380" y="125" width="590" height="70" rx="10"/><rect x="380" y="225" width="590" height="70" rx="10"/></g><g font-family="Arial, sans-serif" font-size="25" fill="#2F3E7A"><text x="405" y="70">Quỹ đạo 1: −2,25</text><text x="405" y="170">Quỹ đạo 2: −3,125</text><text x="405" y="270">… các quỹ đạo và tổng thưởng khác</text></g></svg>