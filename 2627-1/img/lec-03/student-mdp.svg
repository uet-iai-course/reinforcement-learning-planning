<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" role="img" aria-labelledby="title desc">
  <title id="title">Student MDP</title>
  <desc id="desc">Student MDP có các trạng thái Facebook, C1, C2, C3 và Sleep. Tại C1, hành động Facebook đi tới trạng thái Facebook với thưởng âm một, còn Study đi tới C2 với thưởng âm hai. Tại trạng thái Facebook, hành động Facebook tự lặp với thưởng âm một, còn Quit trở về C1 với thưởng không. C2 có Study tới C3 và Sleep đi thẳng tới Sleep. C3 có Study tới Sleep và Pub đi qua một nút ngẫu nhiên rồi trở về C1, C2 hoặc C3 với xác suất 0,2, 0,4, 0,4.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2F3E7A"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#2F3E7A" stroke-width="4" marker-end="url(#arrow)"><path d="M145 320 V190"/><path d="M95 190 C20 240,25 340,90 378"/><path d="M100 90 C40 15,245 15,190 100"/><path d="M195 385 H355"/><path d="M465 385 H625"/><path d="M735 375 C825 330,900 250,940 190"/><path d="M410 330 C500 235,740 225,925 155"/><path d="M680 440 C650 500,570 520,495 505"/><path d="M445 500 C340 520,230 500,180 435"/><path d="M470 493 C455 465,435 450,420 443"/><path d="M500 500 C580 530,690 515,700 445"/></g>
    <g fill="#EDF4FF" stroke="#2F3E7A" stroke-width="4"><circle cx="145" cy="135" r="58"/><circle cx="145" cy="385" r="58"/><circle cx="410" cy="385" r="58"/><circle cx="680" cy="385" r="58"/><rect x="925" y="80" width="125" height="115" rx="8" fill="#F7EFE6"/></g>
    <circle cx="470" cy="505" r="12" fill="#17213F"/>
    <g font-size="32" fill="#17213F"><text x="145" y="146">Facebook</text><text x="145" y="396">C1</text><text x="410" y="396">C2</text><text x="680" y="396">C3</text><text x="987" y="148">Sleep</text></g>
    <g font-size="30" fill="#17213F"><text x="225" y="255" fill="#8B3A18">Facebook · −1</text><text x="52" y="285" fill="#8B3A18">Quit · 0</text><text x="275" y="360" fill="#8B3A18">Study · −2</text><text x="545" y="360" fill="#8B3A18">Study · −2</text><text x="830" y="300" fill="#8B3A18">Study · +10</text><text x="650" y="215" fill="#8B3A18">Sleep · 0</text><text x="615" y="480" fill="#8B3A18">Pub · +1</text><text x="295" y="520">0,2</text><text x="430" y="460">0,4</text><text x="660" y="520">0,4</text><text x="145" y="35" fill="#8B3A18">Facebook · −1</text></g>
    <text x="470" y="540" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" fill="#17213F">nút ngẫu nhiên</text>
  </g>
</svg>
