<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img"><title>Ba lớp mô hình</title><desc>Cùng hai trạng thái A và B. Chuỗi Markov có bước chuyển. Quá trình phần thưởng Markov thêm thưởng. Quá trình quyết định Markov có hai hành động a và b, mỗi hành động dẫn tới phản hồi có thưởng.</desc><defs><marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="10" refY="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2F3E7A"/></marker></defs><g font-family="Arial,sans-serif" font-size="28" fill="#2F3E7A"><text x="20" y="76" text-anchor="start" fill="#2F3E7A">1. Chuỗi Markov</text><rect x="480" y="38" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="535.0" y="80.0" text-anchor="middle" fill="#2F3E7A">A</text><rect x="870" y="38" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="925.0" y="80.0" text-anchor="middle" fill="#2F3E7A">B</text><path d="M590 70L864 70" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><text x="20" y="196" text-anchor="start" fill="#2F3E7A">2. Thêm phần thưởng</text><rect x="480" y="158" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="535.0" y="200.0" text-anchor="middle" fill="#2F3E7A">A</text><rect x="870" y="158" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="925.0" y="200.0" text-anchor="middle" fill="#2F3E7A">B</text><path d="M590 190L864 190" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><text x="730" y="166" text-anchor="middle" fill="#B15A2B">thưởng</text><text x="20" y="316" text-anchor="start" fill="#2F3E7A">3. Thêm lựa chọn</text><text x="55" y="352" text-anchor="start" fill="#2F3E7A">hành động</text><rect x="480" y="292" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="535.0" y="334.0" text-anchor="middle" fill="#2F3E7A">A</text><rect x="870" y="292" width="110" height="64" rx="12" fill="#F7EFE6" stroke="#2F3E7A" stroke-width="3"/><text x="925.0" y="334.0" text-anchor="middle" fill="#2F3E7A">B</text><rect x="685" y="260" width="90" height="50" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="730.0" y="295.0" text-anchor="middle" fill="#B15A2B">a</text><path d="M590 324L679 285" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 285L864 324" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><rect x="685" y="340" width="90" height="50" rx="12" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="730.0" y="375.0" text-anchor="middle" fill="#B15A2B">b</text><path d="M590 324L679 365" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><path d="M775 365L864 324" fill="none" stroke="#2F3E7A" stroke-width="3" marker-end="url(#arrow)"/><text x="824" y="270" text-anchor="middle" fill="#B15A2B">thưởng</text><text x="824" y="382" text-anchor="middle" fill="#B15A2B">thưởng</text></g></svg>