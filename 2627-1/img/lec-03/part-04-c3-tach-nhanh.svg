<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" font-family="Arial,sans-serif"><title>Ví dụ C3: thưởng ngay -2 và hai hộp giá trị chưa biết</title><desc>Nút C3 ở trái với nhãn thưởng -2 trên cạnh ra; hai mũi tên tới Pass (xác suất 0,6) và Pub (xác suất 0,4); mỗi nút kế tiếp nối tới một hộp giá trị để trống.</desc><rect x="0" y="0" width="1000" height="320" fill="#ffffff"/><circle cx="140" cy="160" r="56" fill="#edf4ff" stroke="#2F3E7A" stroke-width="3"/><text x="140" y="170" font-size="28" text-anchor="middle" fill="#2F3E7A">C3</text><circle cx="500" cy="80" r="56" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="500" y="90" font-size="26" text-anchor="middle" fill="#B15A2B">Pass</text><circle cx="500" cy="240" r="56" fill="#F7EFE6" stroke="#B15A2B" stroke-width="3"/><text x="500" y="250" font-size="26" text-anchor="middle" fill="#B15A2B">Pub</text><rect x="770" y="40" width="200" height="80" rx="10" fill="#ffffff" stroke="#424954" stroke-width="3" stroke-dasharray="8 6"/><text x="870" y="90" font-size="24" text-anchor="middle" fill="#424954">giá trị từ Pass</text><rect x="770" y="200" width="200" height="80" rx="10" fill="#ffffff" stroke="#424954" stroke-width="3" stroke-dasharray="8 6"/><text x="870" y="250" font-size="24" text-anchor="middle" fill="#424954">giá trị từ Pub</text><line x1="192" y1="140" x2="444" y2="88" stroke="#2F3E7A" stroke-width="3"/><polygon points="444,88 426,84 432,100" fill="#2F3E7A"/><line x1="192" y1="180" x2="444" y2="232" stroke="#2F3E7A" stroke-width="3"/><polygon points="444,232 432,220 426,236" fill="#2F3E7A"/><line x1="556" y1="80" x2="770" y2="80" stroke="#B15A2B" stroke-width="3"/><polygon points="770,80 752,72 752,88" fill="#B15A2B"/><line x1="556" y1="240" x2="770" y2="240" stroke="#B15A2B" stroke-width="3"/><polygon points="770,240 752,232 752,248" fill="#B15A2B"/><text x="310" y="92" font-size="24" text-anchor="middle" fill="#424954">0,6</text><text x="310" y="248" font-size="24" text-anchor="middle" fill="#424954">0,4</text><text x="140" y="252" font-size="26" text-anchor="middle" fill="#B15A2B">thưởng −2</text></svg>