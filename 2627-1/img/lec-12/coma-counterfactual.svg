<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d"><title id="t">Baseline phản thực của COMA</title><desc id="d">Giữ hành động của các tác tử khác cố định, thay lần lượt hành động của tác tử i và lấy trung bình theo chính sách của nó.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="30"><rect x="25" y="95" width="250" height="105" rx="12" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="150" y="137">giữ a₋ᵢ cố định</text><text x="150" y="177">biết lịch sử τᵢ</text><g fill="#f7efe6" stroke="#b15a2b" stroke-width="3"><rect x="365" y="25" width="190" height="65" rx="10"/><rect x="365" y="118" width="190" height="65" rx="10"/><rect x="365" y="210" width="190" height="65" rx="10"/></g><text x="460" y="67">aᵢ′ = 1</text><text x="460" y="160">aᵢ′ = 2</text><text x="460" y="252">aᵢ′ = K</text><rect x="670" y="90" width="305" height="115" rx="12" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="822" y="137">∑ πᵢ(aᵢ′|τᵢ)</text><text x="822" y="177">Q(s,(a₋ᵢ,aᵢ′))</text><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M275 147L360 58"/><path d="M275 147H360"/><path d="M275 147L360 242"/><path d="M555 58L665 120"/><path d="M555 150H665"/><path d="M555 242L665 178"/></g></g></svg>
