<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-labelledby="t d"><title id="t">Chính sách quyết định thời điểm giao tiếp</title><desc id="d">Quan sát và trạng thái ẩn đi vào một cổng; cổng quyết định gửi hoặc im lặng dưới giới hạn băng thông.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="30"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="30" y="50" width="220" height="70" rx="10"/><rect x="30" y="165" width="220" height="70" rx="10"/></g><text x="140" y="94">quan sát oᵢ</text><text x="140" y="209">trạng thái hᵢ</text><rect x="355" y="75" width="280" height="130" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="495" y="127">cổng gᵢ ∈ {0,1}</text><text x="495" y="172">lịch hoặc cổng học</text><g fill="#fff" stroke="#2f3e7a" stroke-width="3"><rect x="750" y="40" width="210" height="75" rx="10"/><rect x="750" y="165" width="210" height="75" rx="10"/></g><text x="855" y="88">gửi mᵢ</text><text x="855" y="213">im lặng</text><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M250 85L350 115"/><path d="M250 200L350 165"/><path d="M635 120L745 78"/><path d="M635 165L745 200"/></g></g></svg>
