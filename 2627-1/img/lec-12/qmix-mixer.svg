<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Kiến trúc trộn đơn điệu của QMIX</title><desc id="d">Các Q cục bộ đi vào mixing network có trọng số không âm; trạng thái toàn cục điều kiện hóa hypernetwork; đầu ra là Q tổng.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="30"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="25" y="28" width="210" height="65" rx="10"/><rect x="25" y="132" width="210" height="65" rx="10"/><rect x="25" y="236" width="210" height="65" rx="10"/></g><text x="130" y="70">Q₁(τ₁,a₁)</text><text x="130" y="174">Q₂(τ₂,a₂)</text><text x="130" y="278">Qₙ(τₙ,aₙ)</text><rect x="355" y="75" width="310" height="180" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="510" y="132">mạng trộn</text><text x="510" y="180">trọng số ≥ 0</text><text x="510" y="225">điều kiện theo s</text><rect x="770" y="130" width="205" height="75" rx="11" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="872" y="178">Qₜₒₜ</text><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M235 60L350 112"/><path d="M235 165H350"/><path d="M235 268L350 218"/><path d="M665 165H765"/></g></g></svg>
