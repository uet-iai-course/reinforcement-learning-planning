<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Hai góc nhìn về hệ đa tác tử</title><desc id="d">Bên trái gom các tác tử thành một tác tử lớn với hành động chung; bên phải mỗi tác tử thấy môi trường cảm sinh thay đổi khi chính sách tác tử khác đổi.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial"><rect x="20" y="20" width="455" height="340" rx="16" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><rect x="525" y="20" width="455" height="340" rx="16" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><g fill="#fff" stroke="#2f3e7a" stroke-width="3"><circle cx="120" cy="170" r="42"/><circle cx="235" cy="170" r="42"/><circle cx="350" cy="170" r="42"/></g><path d="M120 225Q235 285 350 225" fill="none" stroke="#2f3e7a" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="270" width="175" height="60" rx="10" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><g fill="#fff" stroke="#b15a2b" stroke-width="3"><circle cx="625" cy="170" r="42"/><circle cx="765" cy="105" r="35"/><circle cx="855" cy="240" r="35"/></g><g fill="none" stroke="#b15a2b" stroke-width="4" marker-end="url(#a)"><path d="M665 150L730 120"/><path d="M665 190L820 230"/></g><g font-size="32" text-anchor="middle"><text x="247" y="62">Góc nhìn chung</text><text x="120" y="181">1</text><text x="235" y="181">2</text><text x="350" y="181">N</text><text x="237" y="309">joint action</text><text x="752" y="62">Góc nhìn tác tử 1</text><text x="625" y="181">1</text><text x="765" y="116">2</text><text x="855" y="251">N</text><text x="752" y="310">π₂,…,πₙ đổi</text><text x="752" y="345">MDP cảm sinh đổi</text></g></g></svg>
