<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 330" role="img" aria-labelledby="t d"><title id="t">Huấn luyện tập trung, thực thi phân tán</title><desc id="d">Khi huấn luyện, critic hoặc mixer nhận trạng thái và hành động chung; khi thực thi, mỗi actor chỉ nhận lịch sử cục bộ và phát hành động riêng.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial"><rect x="20" y="20" width="1000" height="135" rx="15" fill="#f7efe6" stroke="#b15a2b" stroke-width="3"/><text x="50" y="58" font-size="32" font-weight="bold">Huấn luyện</text><g fill="#fff" stroke="#b15a2b" stroke-width="3"><rect x="90" y="75" width="210" height="58" rx="9"/><rect x="415" y="75" width="210" height="58" rx="9"/><rect x="740" y="75" width="230" height="58" rx="9"/></g><g font-size="30" text-anchor="middle"><text x="195" y="114">s, a₁,…,aₙ</text><text x="520" y="114">critic / mixer</text><text x="855" y="114">gradient / đích</text></g><g fill="none" stroke="#b15a2b" stroke-width="3" marker-end="url(#a)"><path d="M300 104H410"/><path d="M625 104H735"/></g><rect x="20" y="175" width="1000" height="135" rx="15" fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"/><text x="50" y="213" font-size="32" font-weight="bold">Thực thi</text><g fill="#fff" stroke="#2f3e7a" stroke-width="3"><rect x="90" y="230" width="210" height="58" rx="9"/><rect x="415" y="230" width="210" height="58" rx="9"/><rect x="740" y="230" width="230" height="58" rx="9"/></g><g font-size="30" text-anchor="middle"><text x="195" y="269">τᵢ</text><text x="520" y="269">actor πᵢ</text><text x="855" y="269">aᵢ</text></g><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M300 259H410"/><path d="M625 259H735"/></g></g></svg>
