<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Các lớp của một framework MARL</title><desc id="d">Từ dưới lên gồm môi trường, giao diện batch và replay, thuật toán, quản lý thí nghiệm và báo cáo.</desc><g font-family="Arial" font-size="32" text-anchor="middle"><g stroke-width="3"><rect x="100" y="270" width="800" height="55" rx="10" fill="#edf4ff" stroke="#2f3e7a"/><rect x="140" y="205" width="720" height="55" rx="10" fill="#fff" stroke="#2f3e7a"/><rect x="180" y="140" width="640" height="55" rx="10" fill="#f7efe6" stroke="#b15a2b"/><rect x="220" y="75" width="560" height="55" rx="10" fill="#fff" stroke="#2f3e7a"/><rect x="260" y="10" width="480" height="55" rx="10" fill="#edf4ff" stroke="#2f3e7a"/></g><text x="500" y="308">Môi trường và wrapper</text><text x="500" y="243">Batch, replay, rollout và logging</text><text x="500" y="178">Thuật toán và critic / mixer</text><text x="500" y="113">Cấu hình, seed và chạy phân tán</text><text x="500" y="48">Đánh giá, checkpoint và báo cáo</text></g></svg>
