<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 330" role="img" aria-labelledby="t d"><title id="t">Đường tích hợp thông điệp vào chính sách và hàm giá trị</title><desc id="d">Thông điệp từ tác tử khác được kết hợp với quan sát cục bộ, sau đó đi tới biểu diễn ẩn, actor và critic; actor phụ thuộc thông điệp thì thông điệp phải có lúc thực thi.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2f3e7a"/></marker></defs><g font-family="Arial" text-anchor="middle" font-size="30"><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="20" y="50" width="225" height="70" rx="10"/><rect x="20" y="210" width="225" height="70" rx="10"/></g><text x="132" y="95">quan sát oᵢ</text><text x="132" y="255">message m₋ᵢ</text><rect x="320" y="75" width="300" height="180" rx="14" fill="#f7efe6" stroke="#b15a2b" stroke-width="4"/><text x="470" y="125">kết hợp</text><text x="470" y="172">tổng / attention</text><text x="470" y="219">RNN</text><rect x="680" y="115" width="145" height="100" rx="14" fill="#fff" stroke="#2f3e7a" stroke-width="3"/><text x="752" y="178">hᵢ</text><g fill="#edf4ff" stroke="#2f3e7a" stroke-width="3"><rect x="875" y="50" width="155" height="75" rx="10"/><rect x="875" y="205" width="155" height="75" rx="10"/></g><text x="952" y="98">actor πᵢ</text><text x="952" y="253">critic V/Q</text><g fill="none" stroke="#2f3e7a" stroke-width="3" marker-end="url(#a)"><path d="M245 85L315 120"/><path d="M245 245L315 210"/><path d="M620 165H675"/><path d="M825 145L870 100"/><path d="M825 185L870 230"/></g></g></svg>
